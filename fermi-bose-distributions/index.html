<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fermi-Dirac and Bose-Einstein Distributions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #111; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { display: block; }
  .title {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .3;
    pointer-events: none; white-space: nowrap;
  }
  .eqbox {
    position: absolute; top: 34px; left: 12px;
    font-size: 10px; line-height: 1.5; pointer-events: none; opacity: .8;
  }
  .eqbox div { font-size: 11px; margin-bottom: 2px; }
  .data {
    position: absolute; right: 10px; top: 34px;
    font-size: 9px; line-height: 1.6; text-align: right;
    pointer-events: none; opacity: .75;
  }
  .ctrl {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
    background: rgba(255,255,255,.92); padding: 5px 12px;
    border: 1px solid #000; font-size: 9px; font-family: 'Courier New', monospace;
  }
  .ctrl button {
    background: #fff; border: 1px solid #000; color: #000;
    padding: 2px 8px; font: 8px 'Courier New'; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .ctrl button:hover { background: #000; color: #fff; }
  .ctrl label {
    font-size: 7px; color: #666; text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 3px;
  }
  .ctrl input[type=range] { accent-color: #000; width: 50px; height: 14px; vertical-align: middle; }
  .ctrl .v { min-width: 24px; display: inline-block; text-align: right; font-size: 8px; }
</style>
</head>
<body>

<div class="title">Fermi-Dirac · Bose-Einstein · Maxwell-Boltzmann</div>

<div class="eqbox" id="eq">
  <div>f<sub>FD</sub> = 1 / (e<sup>(E−μ)/kT</sup> + 1)</div>
  <div>f<sub>BE</sub> = 1 / (e<sup>(E−μ)/kT</sup> − 1)</div>
  <div>f<sub>MB</sub> = e<sup>−(E−μ)/kT</sup></div>
</div>

<div class="data" id="d"></div>

<canvas id="c"></canvas>

<div class="ctrl">
  <button id="pb">PAUSE</button>
  <button id="rb">RESET</button>
  <label>μ <input type="range" id="mS" min="-8" max="4" step=".05" value="-2.5"><span class="v" id="mV">-2.50</span></label>
  <label>kT <input type="range" id="kS" min=".1" max="5" step=".05" value="1"><span class="v" id="kV">1.00</span></label>
  <label>Spd <input type="range" id="sS" min="1" max="20" value="5"><span class="v" id="sV">5</span></label>
</div>

<script>
const c = document.getElementById('c');
const cx = c.getContext('2d');
let W, H;

function resizeCanvas() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let mu = -2.5;
let kT = 1.0;
let speed = 5;
let running = true;
let phase = 0;

const HIST_LEN = 150;
let histFD = [];
let histBE = [];

function fermiDirac(E) {
  return 1 / (Math.exp((E - mu) / kT) + 1);
}

function boseEinstein(E) {
  return 1 / (Math.exp((E - mu) / kT) - 1);
}

function maxwellBoltzmann(E) {
  return Math.exp(-(E - mu) / kT);
}

function draw() {
  cx.fillStyle = '#fff';
  cx.fillRect(0, 0, W, H);

  const gx = W * 0.06;
  const gw = W * 0.55;
  const gy = H * 0.10;
  const gh = H * 0.55;
  const Emin = -8, Emax = 8, pts = 300;

  cx.strokeStyle = 'rgba(0,0,0,0.12)';
  cx.lineWidth = 0.5;
  cx.strokeRect(gx, gy, gw, gh);

  cx.strokeStyle = 'rgba(0,0,0,0.2)';
  cx.lineWidth = 0.5;
  cx.beginPath();
  cx.moveTo(gx, gy + gh);
  cx.lineTo(gx + gw, gy + gh);
  cx.stroke();
  cx.beginPath();
  cx.moveTo(gx, gy);
  cx.lineTo(gx, gy + gh);
  cx.stroke();

  const muX = gx + (mu - Emin) / (Emax - Emin) * gw;
  cx.strokeStyle = 'rgba(0,0,0,0.15)';
  cx.lineWidth = 0.5;
  cx.setLineDash([3, 4]);
  cx.beginPath();
  cx.moveTo(muX, gy);
  cx.lineTo(muX, gy + gh);
  cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle = 'rgba(0,0,0,0.4)';
  cx.font = '8px monospace';
  cx.fillText('\u03bc=' + mu.toFixed(2), muX + 3, gy + gh - 3);

  // Fermi-Dirac curve
  cx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const E = Emin + (Emax - Emin) * i / pts;
    const f = fermiDirac(E);
    const x = gx + i / pts * gw;
    const y = gy + gh - f * gh;
    if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
  }
  cx.strokeStyle = '#111';
  cx.lineWidth = 1.5;
  cx.stroke();

  // Bose-Einstein curve
  cx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const E = Emin + (Emax - Emin) * i / pts;
    if (Math.abs(E - mu) > 0.001) {
      const f = boseEinstein(E);
      cx.lineTo(gx + i / pts * gw, gy + gh - f * gh);
    } else {
      cx.stroke();
      cx.beginPath();
    }
  }
  cx.strokeStyle = 'rgba(0,0,0,0.35)';
  cx.lineWidth = 1;
  cx.setLineDash([4, 3]);
  cx.stroke();
  cx.setLineDash([]);

  // Maxwell-Boltzmann curve
  cx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const E = Emin + (Emax - Emin) * i / pts;
    const f = maxwellBoltzmann(E);
    const x = gx + i / pts * gw;
    const y = gy + gh - f * gh;
    if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
  }
  cx.strokeStyle = 'rgba(0,0,0,0.15)';
  cx.lineWidth = 0.7;
  cx.setLineDash([1, 3]);
  cx.stroke();
  cx.setLineDash([]);

  // Axis labels
  cx.fillStyle = '#111';
  cx.font = '9px monospace';
  cx.fillText('f(E)', gx + 3, gy + 12);
  cx.fillText('E', gx + gw - 8, gy + gh - 3);

  // Legend
  const lx = W * 0.63, ly = H * 0.12;
  cx.strokeStyle = '#111'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(lx, ly); cx.lineTo(lx + 18, ly); cx.stroke();
  cx.fillStyle = '#111'; cx.font = '8px monospace'; cx.fillText('FD', lx + 22, ly + 3);

  cx.strokeStyle = 'rgba(0,0,0,0.35)'; cx.lineWidth = 1; cx.setLineDash([4, 3]);
  cx.beginPath(); cx.moveTo(lx, ly + 14); cx.lineTo(lx + 18, ly + 14); cx.stroke(); cx.setLineDash([]);
  cx.fillText('BE', lx + 22, ly + 17);

  cx.strokeStyle = 'rgba(0,0,0,0.15)'; cx.lineWidth = 0.7; cx.setLineDash([1, 3]);
  cx.beginPath(); cx.moveTo(lx, ly + 28); cx.lineTo(lx + 18, ly + 28); cx.stroke(); cx.setLineDash([]);
  cx.fillText('MB', lx + 22, ly + 31);

  // Mini graph in top-right of plot
  const mgx = gx + gw - 110, mgy = gy + 3, mgw = 105, mgh = 42;
  cx.strokeStyle = 'rgba(0,0,0,0.1)'; cx.lineWidth = 0.5;
  cx.strokeRect(mgx, mgy, mgw, mgh);
  cx.fillStyle = 'rgba(0,0,0,0.3)'; cx.font = '6px monospace';
  cx.fillText('FD(0),BE(0)', mgx + 2, mgy + 8);

  if (histFD.length > 1) {
    const yLo = -0.5, yHi = 2.5;
    cx.strokeStyle = 'rgba(0,0,0,0.5)'; cx.lineWidth = 0.6; cx.beginPath();
    for (let i = 0; i < histFD.length; i++) {
      const x = mgx + (i / (HIST_LEN - 1)) * mgw;
      const y = mgy + mgh - (histFD[i] - yLo) / (yHi - yLo) * mgh;
      if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
    }
    cx.stroke();

    cx.strokeStyle = 'rgba(0,0,0,0.2)'; cx.lineWidth = 0.5; cx.beginPath();
    for (let i = 0; i < histBE.length; i++) {
      const x = mgx + (i / (HIST_LEN - 1)) * mgw;
      const y = mgy + mgh - (histBE[i] - yLo) / (yHi - yLo) * mgh;
      if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
    }
    cx.stroke();
  }

  // Data displays (12+)
  const f0 = fermiDirac(0), b0 = boseEinstein(0), m0 = maxwellBoltzmann(0);
  const fdAtMu = fermiDirac(mu);
  let intFD = 0, intBE = 0, intMB = 0;
  for (let i = 0; i < 200; i++) {
    const E = Emin + (Emax - Emin) * (i + 0.5) / 200;
    intFD += fermiDirac(E);
    if (Math.abs(E - mu) > 0.001) intBE += boseEinstein(E);
    intMB += maxwellBoltzmann(E);
  }
  intFD *= (Emax - Emin) / 200;
  intBE *= (Emax - Emin) / 200;
  intMB *= (Emax - Emin) / 200;
  const fdSlope = fermiDirac(mu + 0.01) - fermiDirac(mu - 0.01);
  const beNearMu = boseEinstein(mu + 0.01);

  document.getElementById('d').innerHTML =
    '\u03bc=' + mu.toFixed(3) + '<br>kT=' + kT.toFixed(3) +
    '<br>f<sub>FD</sub>(0)=' + f0.toFixed(4) +
    '<br>f<sub>BE</sub>(0)=' + b0.toFixed(4) +
    '<br>f<sub>MB</sub>(0)=' + m0.toFixed(4) +
    '<br>f<sub>FD</sub>(\u03bc)=' + fdAtMu.toFixed(4) +
    '<br>\u222bFD=' + intFD.toFixed(3) +
    '<br>\u222bBE=' + intBE.toFixed(3) +
    '<br>\u222bMB=' + intMB.toFixed(3) +
    '<br>FD\'(\u03bc)=' + fdSlope.toFixed(4) +
    '<br>kT\u00b7ln2=' + (kT * Math.LN2).toFixed(3) +
    '<br>BE(\u03bc+.01)=' + beNearMu.toFixed(2) +
    '<br>exp(-μ/kT)=' + Math.exp(-mu / kT).toFixed(4);
}

document.getElementById('pb').onclick = () => {
  running = !running;
  document.getElementById('pb').textContent = running ? 'PAUSE' : 'PLAY';
};

document.getElementById('rb').onclick = () => {
  mu = -2.5; kT = 1; phase = 0;
  histFD = []; histBE = [];
  document.getElementById('mS').value = -2.5;
  document.getElementById('kS').value = 1;
  document.getElementById('mV').textContent = '-2.50';
  document.getElementById('kV').textContent = '1.00';
};

document.getElementById('mS').oninput = function () {
  mu = parseFloat(this.value);
  document.getElementById('mV').textContent = mu.toFixed(2);
};

document.getElementById('kS').oninput = function () {
  kT = parseFloat(this.value);
  document.getElementById('kV').textContent = kT.toFixed(2);
};

document.getElementById('sS').oninput = function () {
  speed = parseFloat(this.value);
  document.getElementById('sV').textContent = speed;
};

function loop() {
  if (running) {
    phase += 0.015 * speed / 5;
    kT = 1 + 0.8 * Math.sin(phase);
    document.getElementById('kS').value = kT;
    document.getElementById('kV').textContent = kT.toFixed(2);
    histFD.push(fermiDirac(0));
    histBE.push(boseEinstein(0));
    if (histFD.length > HIST_LEN) {
      histFD.shift();
      histBE.shift();
    }
  }
  draw();
  requestAnimationFrame(loop);
}

resizeCanvas();
loop();
</script>
</body>
</html>
