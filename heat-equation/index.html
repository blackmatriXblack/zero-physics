<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Heat Equation · ∂T/∂t = α∇²T</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}
h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
p{font-size:0.75em;color:#666;margin-bottom:8px}
canvas{border:1px solid #000;display:block}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:6px;max-width:900px}
.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:3px 8px;border-radius:2px}
.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-group input[type=range]{width:60px;accent-color:#000}
.ctrl-group .val{font-size:0.65em;color:#000;min-width:22px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font-family:'Courier New',monospace;font-size:0.65em;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
button:hover{background:#000;color:#fff}
button.active{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:0.62em;color:#666;max-width:900px;justify-content:center}
.stats span{white-space:nowrap}
.stats .label{color:#999}
.stats .val{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Heat Equation</h1>
<p>∂T/∂t = α∇²T — FTCS finite difference · Dirichlet BCs</p>
<canvas id="c" width="900" height="520"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=900,H=520;
let alpha=0.2,N=80,paused=false,speed=1,pattern=0;
let T,Tnew,gridT=0;
let hist={avg:[],min:[],max:[],entropy:[]};

function initGrid(){
  T=new Float64Array(N*N);Tnew=new Float64Array(N*N);gridT=0;
  hist={avg:[],min:[],max:[],entropy:[]};
  const cy=N/2,cx=N/2;
  if(pattern===0){ // Hot spot center + cold square
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=x-cx,dy=y-cy,r2=dx*dx+dy*dy;T[y*N+x]=r2<64?1:(x>N*0.7&&x<N*0.85&&y>N*0.15&&y<N*0.85?-0.5:0);}
  }else if(pattern===1){ // Two hot spots
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d1=(x-N*0.3)*(x-N*0.3)+(y-cy)*(y-cy),d2=(x-N*0.7)*(x-N*0.7)+(y-cy)*(y-cy);T[y*N+x]=(d1<100||d2<100)?1:0;}
  }else{ // Random
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)T[y*N+x]=(Math.random()-0.5)*0.5;
  }
  for(let i=0;i<N*N;i++)gridT+=T[i];
}

initGrid();
const CFL=0.24;

function step(){
  if(paused)return;
  for(let iter=0;iter<speed;iter++){
    const dt=CFL*N*N/(4*alpha*N*N); // CFL condition: alpha*dt/dx² < 0.25
    for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
      const lap=T[(y+1)*N+x]+T[(y-1)*N+x]+T[y*N+x+1]+T[y*N+x-1]-4*T[y*N+x];
      Tnew[y*N+x]=T[y*N+x]+alpha*lap;
    }
    for(let x=0;x<N;x++){Tnew[x]=T[x];Tnew[(N-1)*N+x]=T[(N-1)*N+x];}
    for(let y=0;y<N;y++){Tnew[y*N]=T[y*N];Tnew[y*N+N-1]=T[y*N+N-1];}
    [T,Tnew]=[Tnew,T];
    gridT++;
    if(gridT%5===0){
      let s=0,mn=Infinity,mx=-Infinity,ent=0;
      for(let i=0;i<N*N;i++){const v=T[i];s+=v;if(v<mn)mn=v;if(v>mx)mx=v;ent+=v*v;}
      hist.avg.push(s/(N*N));hist.min.push(mn);hist.max.push(mx);hist.entropy.push(ent/(N*N));
      if(hist.avg.length>180){hist.avg.shift();hist.min.shift();hist.max.shift();hist.entropy.shift();}
    }
  }
}

function resetSim(){
  alpha=parseFloat(document.getElementById('aS')?.value)||0.2;
  N=parseInt(document.getElementById('nS')?.value)||80;
  pattern=parseInt(document.getElementById('pS')?.value)||0;
  initGrid();paused=false;
  const pb=document.getElementById('pauseBtn');if(pb)pb.textContent='Pause';
}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const cs=Math.min(420,420)/N;
  const ox=20+(420-N*cs)/2,oy=30+(420-N*cs)/2;
  const sz=N*cs;

  // Temperature field
  const imgData=ctx.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=T[y*N+x],idx=(y*N+x)*4;
    const g=Math.min(255,Math.max(0,128+v*150));
    imgData.data[idx]=g>128?Math.min(255,g+20):Math.max(0,g-20);
    imgData.data[idx+1]=g;
    imgData.data[idx+2]=g<128?Math.min(255,g+20):Math.max(0,g-20);
    imgData.data[idx+3]=255;
  }
  const tc=document.createElement('canvas');tc.width=N;tc.height=N;
  const tctx=tc.getContext('2d');tctx.putImageData(imgData,0,0);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(tc,ox,oy,sz,sz);
  ctx.strokeStyle='#111';ctx.lineWidth=0.8;ctx.strokeRect(ox,oy,sz,sz);

  // Legend
  const lx=ox,ly=oy+sz+8,lgw=sz;
  for(let i=0;i<=lgw;i++){const v=i/lgw;const g=Math.floor(255*(0.5+0.5*(v-0.5)*2));ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(lx+i,ly,1,8);}
  ctx.fillStyle='#999';ctx.font='5px monospace';ctx.fillText('cold',ox,ly+16);ctx.fillText('hot',ox+sz-12,ly+16);

  // Temperature profile slice (right top)
  const prX=480,prY=30,prW=390,prH=140;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(prX,prY,prW,prH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('T PROFILE (y=N/2)',prX+3,prY+10);
  let mn=Infinity,mx=-Infinity;
  for(let x=0;x<N;x++){const v=T[(N>>1)*N+x];if(v<mn)mn=v;if(v>mx)mx=v;}
  const rng=mx-mn||1;
  ctx.beginPath();
  for(let x=0;x<N;x++){const v=T[(N>>1)*N+x];const sx=prX+(x/N)*prW,sy=prY+prH-(v-mn)/rng*prH;x===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
  ctx.strokeStyle='#111';ctx.lineWidth=0.8;ctx.stroke();
  ctx.fillStyle='#999';ctx.font='5px monospace';ctx.fillText(mx.toFixed(2),prX+prW-28,prY+8);ctx.fillText(mn.toFixed(2),prX+prW-28,prY+prH-2);

  // Time evolution graphs (right middle & bottom)
  const eX=480,eY=190,eW=390,eH=140;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(eX,eY,eW,eH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('EVOLUTION  avg/min/max T',eX+3,eY+10);
  if(hist.avg.length>2){
    const all=[...hist.avg,...hist.min,...hist.max];const gMn=Math.min(...all),gMx=Math.max(...all),gR=gMx-gMn||1;
    for(const [data,col] of [[hist.avg,'#666'],[hist.min,'#999'],[hist.max,'#000']]){
      ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=0.6;
      for(let i=0;i<data.length;i++){const sx=eX+(i/data.length)*eW,sy=eY+eH-(data[i]-gMn)/gR*eH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
      ctx.stroke();
    }
  }

  // Entropy proxy (∫T²)
  const sX=480,sY=350,sW=390,sH=120;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(sX,sY,sW,sH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('ENTROPY PROXY  ⟨T²⟩',sX+3,sY+10);
  if(hist.entropy.length>2){const eMn=Math.min(...hist.entropy),eMx=Math.max(...hist.entropy),eR=eMx-eMn||1;
    ctx.beginPath();for(let i=0;i<hist.entropy.length;i++){const sx=sX+(i/hist.entropy.length)*sW,sy=sY+sH-(hist.entropy[i]-eMn)/eR*sH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='#111';ctx.lineWidth=0.7;ctx.stroke();ctx.fillStyle='#999';ctx.font='5px monospace';
    ctx.fillText(eMx.toFixed(4),sX+sW-28,sY+8);ctx.fillText(eMn.toFixed(4),sX+sW-28,sY+sH-2);}

  let s=0,mnT=Infinity,mxT=-Infinity,ent=0;
  for(let i=0;i<N*N;i++){const v=T[i];s+=v;if(v<mnT)mnT=v;if(v>mxT)mxT=v;ent+=v*v;}
  const avgT=s/(N*N),totalHeat=s;
  const dt=CFL*N*N/(4*alpha*N*N);

if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>α</label><input type="range" id="aS" min="0.01" max="0.8" step="0.01" value="${alpha.toFixed(2)}"><span class="val" id="aV">${alpha.toFixed(2)}</span></div>`+
    `<div class="ctrl-group"><label>N</label><input type="range" id="nS" min="30" max="120" step="5" value="${N}"><span class="val" id="nV">${N}</span></div>`+
    `<div class="ctrl-group"><label>Pattern</label><input type="range" id="pS" min="0" max="2" step="1" value="${pattern}"><span class="val" id="pV">${['spot','dual','rand'][pattern]}</span></div>`+
    `<button id="pauseBtn">${paused?'Play':'Pause'}</button><button id="resetBtn">Reset</button>`+
    `<div class="ctrl-group"><label>Speed</label><input type="range" id="speedS" min="1" max="20" step="1" value="${speed}"><span class="val" id="speedV">${speed}x</span></div>`;

  document.getElementById('aS')?.addEventListener('input',function(){alpha=parseFloat(this.value);document.getElementById('aV').textContent=alpha.toFixed(2);});
  document.getElementById('nS')?.addEventListener('input',function(){N=parseInt(this.value);document.getElementById('nV').textContent=N;});
  document.getElementById('pS')?.addEventListener('input',function(){pattern=parseInt(this.value);document.getElementById('pV').textContent=['spot','dual','rand'][pattern];});
  document.getElementById('pauseBtn')?.addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';});
  document.getElementById('resetBtn')?.addEventListener('click',resetSim);
  document.getElementById('speedS')?.addEventListener('input',function(){speed=parseInt(this.value);document.getElementById('speedV').textContent=speed+'x';});

}
  document.getElementById('stats').innerHTML=
    `<span><span class="label">t =</span> <span class="val">${gridT}</span></span>`+
    `<span><span class="label">α =</span> <span class="val">${alpha.toFixed(3)}</span></span>`+
    `<span><span class="label">N×N =</span> <span class="val">${N}×${N}</span></span>`+
    `<span><span class="label">dx =</span> <span class="val">${(1/N).toFixed(4)}</span></span>`+
    `<span><span class="label">dt =</span> <span class="val">${dt.toFixed(4)}</span></span>`+
    `<span><span class="label">⟨T⟩ =</span> <span class="val">${avgT.toFixed(4)}</span></span>`+
    `<span><span class="label">T<sub>min</sub> =</span> <span class="val">${mnT.toFixed(4)}</span></span>`+
    `<span><span class="label">T<sub>max</sub> =</span> <span class="val">${mxT.toFixed(4)}</span></span>`+
    `<span><span class="label">Total heat =</span> <span class="val">${totalHeat.toFixed(4)}</span></span>`+
    `<span><span class="label">Conservation =</span> <span class="val">${totalHeat.toFixed(4)}</span></span>`+
    `<span><span class="label">⟨T²⟩ =</span> <span class="val">${ent.toFixed(4)}</span></span>`+
    `<span><span class="label">Max ∇T =</span> <span class="val">${(mxT-mnT).toFixed(4)}</span></span>`+
    `<span><span class="label">CFL =</span> <span class="val">${(alpha*dt*N*N).toFixed(4)}</span></span>`;
}
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
