<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Double Slit Fluid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:55px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Double Slit Fluid Analogy</h1>
<div class="eq">∂²u/∂t² = c²∇²u − β∂u/∂t · Quantum analog via fluid surface waves</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>c <input type="range" id="cS" min="20" max="100" value="55"></label>
<label>ω <input type="range" id="fS" min="10" max="80" value="35"></label>
<label>β <input type="range" id="dS" min="1" max="30" value="8"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const cols=200,rows=128;
let play=1,wSpd=.55,freq=.028,damp=.008,spd=3,time=0;
let cur=new Float64Array(cols*rows),prev=new Float64Array(cols*rows);
let hist={t:[],maxAmp:[],energy:[],vis:[]};
const slitY=Math.floor(rows*.22),sL=Math.floor(cols*.43),sR=Math.floor(cols*.57);
function resetS(){cur.fill(0);prev.fill(0);time=0;hist={t:[],maxAmp:[],energy:[],vis:[]}}
function step(){if(!play)return;for(let s=0;s<spd;s++){const next=new Float64Array(cols*rows);const c2=wSpd*wSpd,d=damp;
for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){const idx=x+y*cols;const lap=cur[idx-1]+cur[idx+1]+cur[idx-cols]+cur[idx+cols]-4*cur[idx];const diff=cur[idx]-prev[idx];next[idx]=2*cur[idx]-prev[idx]+c2*lap-d*diff}
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let decay=1;const dx=Math.min(x,cols-1-x),dy=Math.min(y,rows-1-y);if(dx<8)decay*=dx/8;if(dy<8)decay*=dy/8;if(decay<1){const idx=x+y*cols;next[idx]=cur[idx]+(next[idx]-cur[idx])*decay}}
const src=.7*Math.sin(freq*time);next[sL+slitY*cols]+=src;next[sR+slitY*cols]+=src;
prev=cur;cur=next;time++}
if(time%3===0){let maxA=0,energy=0;for(let i=0;i<cur.length;i++){const a=Math.abs(cur[i]);if(a>maxA)maxA=a;energy+=a*a}energy/=cur.length;
let A1=0,A2=0;for(let y=slitY;y<rows;y++){const idx=(sL-10)+y*cols;A1+=Math.abs(cur[idx])}for(let y=slitY;y<rows;y++){const idx=(sR+10)+y*cols;A2+=Math.abs(cur[idx])}const vis=Math.abs(A1-A2)/(A1+A2+1e-10);
hist.t.push(time);hist.maxAmp.push(maxA);hist.energy.push(energy);hist.vis.push(vis);if(hist.t.length>200){hist.t.shift();hist.maxAmp.shift();hist.energy.shift();hist.vis.shift()}}}
function drawMini(x,y,w,h,data,color,label){if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<data.length;i++){const px=x+i*w/data.length,py=y+h-(data[i]-mn)/rng*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);ctx.restore()}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
let maxA=1e-10;for(let i=0;i<cur.length;i++){const a=Math.abs(cur[i]);if(a>maxA)maxA=a}
const norm=maxA>.01?maxA:1;
const img=ctx.createImageData(W,H);
for(let py=0;py<H;py++)for(let px=0;px<W;px++){const gx=Math.floor(px*cols/W),gy=Math.floor(py*rows/H);const val=cur[gx+gy*cols]/norm;const gray=Math.max(0,Math.min(255,Math.floor(128+val*110)));const i=(py*W+px)*4;img.data[i]=gray;img.data[i+1]=gray;img.data[i+2]=gray;img.data[i+3]=255}
ctx.putImageData(img,0,0);
const barY=slitY*H/rows,slitW=7,slitH=H/rows*2.5,lX=sL*W/cols,rX=sR*W/cols;
ctx.fillStyle='#000';ctx.fillRect(0,barY-slitH/2,lX-slitW,slitH);ctx.fillRect(rX+slitW,barY-slitH/2,W-rX-slitW,slitH);
ctx.fillStyle='#666';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('slit',lX,barY+4);ctx.fillText('slit',rX,barY+4);
drawMini(5,H-90,130,45,hist.maxAmp,'rgba(0,0,0,.7)','max|u|');drawMini(W-135,H-90,130,45,hist.energy,'rgba(0,0,0,.5)','Energy');
ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('Wave analog of quantum double-slit · t='+time,8,14);
const vis=hist.vis.length>0?hist.vis[hist.vis.length-1]:0;
let h='';const fields=[['t',time],['max|u|',maxA.toFixed(4)],['RMS amp',Math.sqrt(cur.reduce((s,v)=>s+v*v,0)/cur.length).toFixed(5)],['c (wave spd)',wSpd.toFixed(2)],['ω (freq)',freq.toFixed(4)],['β (damp)',damp.toFixed(4)],['λ est',(wSpd*2*Math.PI/freq/cols*W).toFixed(1)+'px'],['visibility',vis.toFixed(3)],['src amp',(.7*Math.sin(freq*time)).toFixed(4)],['phase',(freq*time%(2*Math.PI)).toFixed(2)],['energy Σ|u|²',hist.energy.length>0?hist.energy[hist.energy.length-1].toExponential(3):'0'],
['decay rate',hist.energy.length>10?((hist.energy[hist.energy.length-1]-hist.energy[Math.max(0,hist.energy.length-10)])/10).toExponential(3):'0'],
['A(L)/A(R)',hist.vis.length>0?((1-vis)/(1+vis+1e-10)).toFixed(3):'N/A'],['grid',cols+'×'+rows]];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=resetS;
document.getElementById('cS').oninput=e=>{wSpd=e.value/100;document.getElementById('cS').previousSibling.textContent=wSpd.toFixed(2)}
document.getElementById('fS').oninput=e=>{freq=e.value/1000;document.getElementById('fS').previousSibling.textContent=freq.toFixed(3)}
document.getElementById('dS').oninput=e=>{damp=e.value/1000;document.getElementById('dS').previousSibling.textContent=damp.toFixed(3)}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
resetS();loop();
</script>
</body>
</html>
