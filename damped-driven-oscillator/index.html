<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damped Driven Oscillator · mẍ + cẋ + kx = F₀cos ωt</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}p{font-size:0.75em;color:#666;margin-bottom:10px}canvas{border:1px solid #000;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;max-width:900px}.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:4px 10px;border-radius:2px}.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}.ctrl-group input[type=range]{width:70px;accent-color:#000}.ctrl-group .val{font-size:0.7em;color:#000;min-width:24px;text-align:right}button{background:#fff;border:1px solid #000;color:#000;padding:4px 12px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}button:hover{background:#000;color:#fff}.stats{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px;font-size:0.65em;color:#666;max-width:900px;justify-content:center}.stats span{white-space:nowrap}.stats .label{color:#999}.stats .val{color:#000;font-weight:700}</style>
</head>
<body>
<h1>Damped Driven Oscillator</h1>
<p>mẍ + cẋ + kx = F₀cos ωt — Resonance & phase response</p>
<canvas id="c" width="900" height="520"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let k=3,m=1,cDamp=0.3,F0=1.5,omegaDrive=1.5;
let x=0,v=0;const dt=0.01;let t=0;let paused=false,speed=1;
const xhist=[],forcehist=[],ptrail=[];

function step(){
  if(paused)return;
  for(let s=0;s<speed;s++){
    const force=F0*Math.cos(omegaDrive*t);
    const a=(-k*x-cDamp*v+force)/m;
    v+=a*dt*0.5;x+=v*dt;v+=a*dt*0.5;
    t+=dt;
    xhist.push({t,x,force});
    if(xhist.length>1500)xhist.shift();
    ptrail.push({x:W*0.32+x*90,y:H*0.55-v*90*0.6});
    if(ptrail.length>500)ptrail.shift();
  }
}
function resetSim(){x=0;v=0;t=0;xhist.length=0;forcehist.length=0;ptrail.length=0;paused=false;document.getElementById('pauseBtn').textContent='Pause';}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const w0=Math.sqrt(k/m);
  const gamma=cDamp/(2*m);
  const A=F0/m/Math.sqrt((w0*w0-omegaDrive*omegaDrive)**2+(2*gamma*omegaDrive)**2);
  const phi=Math.atan2(2*gamma*omegaDrive,w0*w0-omegaDrive*omegaDrive);
  const Q=w0/(2*gamma);

  // Time series
  const gx=380,gy=30,gW=500,gH=140;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gW,gH);
  ctx.fillStyle='#111';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText('x(t) & F(t)',gx+4,gy+12);
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.3;ctx.beginPath();ctx.moveTo(gx,gy+gH/2);ctx.lineTo(gx+gW,gy+gH/2);ctx.stroke();
  const tMin=Math.max(0,t-30);
  if(xhist.length>2){
    ctx.beginPath();
    for(let i=0;i<xhist.length;i++){const sx=gx+(xhist[i].t-tMin)/30*gW;const sy=gy+gH/2-xhist[i].x*(gH/12);i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<xhist.length;i++){const sx=gx+(xhist[i].t-tMin)/30*gW;const sy=gy+gH/2-xhist[i].force*(gH/16);i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.5;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);
  }

  // Phase portrait
  const px=380,py=220,pW=240,pH=200;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(px,py,pW,pH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('PHASE PORTRAIT',px+3,py+10);
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.3;
  ctx.beginPath();ctx.moveTo(px+pW/2,py);ctx.lineTo(px+pW/2,py+pH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px,py+pH/2);ctx.lineTo(px+pW,py+pH/2);ctx.stroke();
  if(ptrail.length>2){
    const xMax=Math.max(2,...ptrail.map(p=>Math.abs(p.x-px-pW/2)))*1.2||1;
    const vMax=Math.max(2,...ptrail.map(p=>Math.abs(p.y-py-pH/2)))*1.2||1;
    ctx.beginPath();
    for(let i=0;i<ptrail.length;i++){const cx_=px+pW/2+(ptrail[i].x-px-pW/2)/xMax*(pW/2-8);const cy_=py+pH/2+(ptrail[i].y-py-pH/2)/vMax*(pH/2-8);i===0?ctx.moveTo(cx_,cy_):ctx.lineTo(cx_,cy_);}
    ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.6;ctx.stroke();
  }

  // Resonance curve
  const rx=640,ry=220,rW=240,rH=200;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(rx,ry,rW,rH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('RESPONSE |A(ω)|',rx+3,ry+10);
  ctx.strokeStyle='#111';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(rx,ry+rH);ctx.lineTo(rx+rW,ry+rH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx,ry+rH);ctx.stroke();
  // Current drive freq marker
  const relFreq=omegaDrive/(w0||1);
  const fx_=rx+Math.min(relFreq/2.5,1)*rW;
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.5;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(fx_,ry);ctx.lineTo(fx_,ry+rH);ctx.stroke();ctx.setLineDash([]);
  // Resonance curve
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const w=i/100*2.5*w0;
    const a=F0/m/Math.sqrt((w0*w0-w*w)**2+(2*gamma*w)**2);
    const gx_=rx+i/100*rW;
    const gy_=ry+rH-Math.min(a/(F0/m/w0/w0||1),1)*rH;
    i===0?ctx.moveTo(gx_,gy_):ctx.lineTo(gx_,gy_);
  }
  ctx.strokeStyle='#111';ctx.lineWidth=0.8;ctx.stroke();
  // Q peak
  const wPeak=Math.sqrt(w0*w0-2*gamma*gamma);
  const aPeak=F0/m/Math.sqrt((w0*w0-wPeak*wPeak)**2+(2*gamma*wPeak)**2);
  ctx.fillStyle='#999';ctx.font='6px monospace';
  ctx.fillText('Q='+Q.toFixed(1),(rx+rx+rW)/2,ry+8);

  // Mechanical view
  const mcx=160,mcy=420;
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=-5;i<=5;i++){ctx.moveTo(mcx-165,mcy+i*6);ctx.lineTo(mcx-155,mcy+i*6);}
  ctx.stroke();
  // Spring
  const sx=mcx-160,ex=mcx+x*70-12,ncoils=12;
  ctx.beginPath();ctx.moveTo(sx,mcy);
  for(let i=1;i<=ncoils;i++){const rt=i/ncoils;const px_=sx+(ex-sx)*rt;const py_=mcy+(i%2===0?1:-1)*Math.min(12,(ex-sx)/ncoils);ctx.lineTo(px_,py_);}
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.stroke();
  // Dashpot
  ctx.strokeStyle='#111';ctx.lineWidth=1;
  ctx.strokeRect(mcx-140,mcy+5,22,16);
  // Mass
  const grad=ctx.createLinearGradient(mcx+x*70-16,mcy-16,mcx+x*70+4,mcy+4);
  grad.addColorStop(0,'#333');grad.addColorStop(1,'#000');
  ctx.fillStyle=grad;ctx.fillRect(mcx+x*70-16,mcy-16,32,32);
  ctx.strokeStyle='#fff';ctx.lineWidth=0.8;ctx.strokeRect(mcx+x*70-16,mcy-16,32,32);
  // Force arrow
  ctx.strokeStyle='#111';ctx.lineWidth=1.2;
  const fx_a=mcx+x*70+18;
  ctx.beginPath();ctx.moveTo(fx_a,mcy);ctx.lineTo(fx_a+22*(Math.cos(omegaDrive*t)>0?1:-1),mcy);ctx.stroke();
  ctx.fillStyle='#111';
  if(Math.cos(omegaDrive*t)>0){ctx.beginPath();ctx.moveTo(fx_a+18,mcy-4);ctx.lineTo(fx_a+24,mcy);ctx.lineTo(fx_a+18,mcy+4);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(fx_a-18,mcy-4);ctx.lineTo(fx_a-24,mcy);ctx.lineTo(fx_a-18,mcy+4);ctx.fill();}

  // Controls
if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>k</label><input type="range" id="kS" min="0.5" max="8" step="0.1" value="${k}"><span class="val" id="kV">${k.toFixed(1)}</span></div>`+
    `<div class="ctrl-group"><label>c</label><input type="range" id="cS" min="0.01" max="3" step="0.01" value="${cDamp}"><span class="val" id="cV">${cDamp.toFixed(2)}</span></div>`+
    `<div class="ctrl-group"><label>F₀</label><input type="range" id="f0S" min="0.1" max="5" step="0.1" value="${F0}"><span class="val" id="f0V">${F0.toFixed(1)}</span></div>`+
    `<div class="ctrl-group"><label>ω_d</label><input type="range" id="omS" min="0.1" max="5" step="0.05" value="${omegaDrive}"><span class="val" id="omV">${omegaDrive.toFixed(2)}</span></div>`+
    `<button id="pauseBtn">Pause</button><button id="resetBtn">Reset</button>`+
    `<div class="ctrl-group"><label>Speed</label><input type="range" id="speedS" min="1" max="10" step="1" value="${speed}"><span class="val" id="speedV">${speed}x</span></div>`;

  document.getElementById('kS').addEventListener('input',function(){k=parseFloat(this.value);document.getElementById('kV').textContent=k.toFixed(1);resetSim();});
  document.getElementById('cS').addEventListener('input',function(){cDamp=parseFloat(this.value);document.getElementById('cV').textContent=cDamp.toFixed(2);});
  document.getElementById('f0S').addEventListener('input',function(){F0=parseFloat(this.value);document.getElementById('f0V').textContent=F0.toFixed(1);});
  document.getElementById('omS').addEventListener('input',function(){omegaDrive=parseFloat(this.value);document.getElementById('omV').textContent=omegaDrive.toFixed(2);});
  document.getElementById('pauseBtn').addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';});
  document.getElementById('resetBtn').addEventListener('click',resetSim);
  document.getElementById('speedS').addEventListener('input',function(){speed=parseInt(this.value);document.getElementById('speedV').textContent=speed+'x';});

}
  document.getElementById('stats').innerHTML=
    `<span><span class="label">x =</span> <span class="val">${x.toFixed(4)}</span></span>`+
    `<span><span class="label">v =</span> <span class="val">${v.toFixed(4)}</span></span>`+
    `<span><span class="label">A(ss) =</span> <span class="val">${A.toFixed(4)}</span></span>`+
    `<span><span class="label">φ =</span> <span class="val">${(phi*180/Math.PI).toFixed(1)}°</span></span>`+
    `<span><span class="label">ω₀ =</span> <span class="val">${w0.toFixed(3)}</span></span>`+
    `<span><span class="label">ω_d =</span> <span class="val">${omegaDrive.toFixed(3)}</span></span>`+
    `<span><span class="label">γ =</span> <span class="val">${gamma.toFixed(4)}</span></span>`+
    `<span><span class="label">Q =</span> <span class="val">${Q.toFixed(2)}</span></span>`+
    `<span><span class="label">ωᵣ =</span> <span class="val">${wPeak>0?wPeak.toFixed(3):'none'}</span></span>`+
    `<span><span class="label">t =</span> <span class="val">${t.toFixed(1)}</span></span>`;
}

function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
