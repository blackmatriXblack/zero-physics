<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kinetic Theory of Gases · PV = ⅓Nm⟨v²⟩</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}
h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
p{font-size:0.75em;color:#666;margin-bottom:8px}
canvas{border:1px solid #000;display:block}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:6px;max-width:900px}
.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:3px 8px;border-radius:2px}
.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-group input[type=range]{width:60px;accent-color:#000}
.ctrl-group .val{font-size:0.65em;color:#000;min-width:22px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font-family:'Courier New',monospace;font-size:0.65em;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
button:hover{background:#000;color:#fff}
button.active{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:0.62em;color:#666;max-width:900px;justify-content:center}
.stats span{white-space:nowrap}
.stats .label{color:#999}
.stats .val{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Kinetic Theory of Gases</h1>
<p>PV = ⅓ Nm⟨v²⟩ — 2D molecular dynamics with piston</p>
<canvas id="c" width="900" height="520"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=900,H=520;
let N=150,Tscale=1.5,pistonPos=0.8,paused=false,speed=1;
const r=2.5,dt=0.3;
let px,py,vx,vy;
let wallHits=0,collisions=0,totalMomentum=0,frameCount=0;
let pressHist=[],keHist=[],tempHist=[];
const boxX=40,boxY=50,boxW=440,boxH=360;

function init(){
  px=new Float64Array(N);py=new Float64Array(N);
  vx=new Float64Array(N);vy=new Float64Array(N);
  wallHits=0;collisions=0;frameCount=0;pressHist=[];keHist=[];tempHist=[];
  for(let i=0;i<N;i++){
    px[i]=boxX+r+Math.random()*(boxW-2*r);
    py[i]=boxY+r+Math.random()*(boxH*pistonPos-2*r);
    const sp=Tscale*(0.5+Math.random()*1.5),ang=Math.random()*Math.PI*2;
    vx[i]=sp*Math.cos(ang);vy[i]=sp*Math.sin(ang);
  }
}
init();

function step(){
  if(paused)return;
  for(let iter=0;iter<speed;iter++){
    const pTop=boxY+boxH*pistonPos;
    totalMomentum=0;
    for(let i=0;i<N;i++){
      px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;
      if(px[i]<boxX+r){px[i]=boxX+r;vx[i]=Math.abs(vx[i]);wallHits++;}
      if(px[i]>boxX+boxW-r){px[i]=boxX+boxW-r;vx[i]=-Math.abs(vx[i]);wallHits++;}
      if(py[i]<boxY+r){py[i]=boxY+r;vy[i]=Math.abs(vy[i]);wallHits++;}
      // Piston at top: particles bounce off piston position
      if(py[i]>pTop-r){py[i]=pTop-r;vy[i]=-Math.abs(vy[i]);wallHits++;}
    }
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=px[i]-px[j],dy=py[i]-py[j];
        const d2=dx*dx+dy*dy;
        if(d2<4*r*r&&d2>0){
          const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
          const dvx=vx[i]-vx[j],dvy=vy[i]-vy[j],dvn=dvx*nx+dvy*ny;
          if(dvn>0){vx[i]-=dvn*nx;vy[i]-=dvn*ny;vx[j]+=dvn*nx;vy[j]+=dvn*ny;collisions++;}
        }
      }
    }
    frameCount++;
    // Track pressure (force from wall hits per unit length per frame)
    if(frameCount%10===0){
      let ke=0,mom=0;
      for(let i=0;i<N;i++){ke+=0.5*(vx[i]*vx[i]+vy[i]*vy[i]);mom+=Math.abs(vx[i])+Math.abs(vy[i]);}
      keHist.push(ke/N);tempHist.push(ke/(N));pressHist.push(wallHits/(boxW+2*boxH*pistonPos));
      if(keHist.length>150){keHist.shift();pressHist.shift();tempHist.shift();}
    }
  }
}

function resetSim(){
  Tscale=parseFloat(document.getElementById('tsS')?.value)||1.5;
  N=parseInt(document.getElementById('nS')?.value)||150;
  pistonPos=parseFloat(document.getElementById('pS')?.value)||0.8;
  init();paused=false;
  const pb=document.getElementById('pauseBtn');if(pb)pb.textContent='Pause';
}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const pTop=boxY+boxH*pistonPos;

  // Box walls
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;
  ctx.strokeRect(boxX,boxY,boxW,boxH);
  // Piston line
  ctx.strokeStyle='#111';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(boxX,pTop);ctx.lineTo(boxX+boxW,pTop);ctx.stroke();
  ctx.fillStyle='#111';ctx.font='7px monospace';
  ctx.fillText('PISTON',boxX+boxW-50,pTop-6);

  // Particles
  for(let i=0;i<N;i++){
    const sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);
    ctx.fillStyle=`rgba(0,0,0,${Math.min(0.9,0.3+sp*0.2)})`;
    ctx.beginPath();ctx.arc(px[i],py[i],r,0,Math.PI*2);ctx.fill();
  }

  // Stats
  let totKE=0,totVx=0,totVy=0;
  for(let i=0;i<N;i++){totKE+=0.5*(vx[i]*vx[i]+vy[i]*vy[i]);totVx+=vx[i];totVy+=vy[i];}
  const avgKE=totKE/N,Teff=avgKE,T_2d=avgKE; // 2D: KE = kT per particle
  const area=(boxW)*(boxH*pistonPos);
  const density=N/area;
  const pressure=wallHits/(Math.max(1,frameCount))*Teff*0.1;
  const vRms=Math.sqrt(2*totKE/N);

  // Speed histogram (top right)
  const hgX=540,hgY=30,hgW=330,hgH=180;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(hgX,hgY,hgW,hgH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('SPEED DISTRIBUTION',hgX+3,hgY+10);
  const bins=20;const hist=new Array(bins).fill(0);
  let maxSp=0;for(let i=0;i<N;i++){const sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);if(sp>maxSp)maxSp=sp;}
  maxSp=Math.max(maxSp,0.1);
  for(let i=0;i<N;i++){const sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);hist[Math.min(bins-1,Math.floor(sp/(maxSp*1.1)*bins))]++;}
  const mxCnt=Math.max(...hist,1);
  for(let b=0;b<bins;b++){const bh=hist[b]/mxCnt*hgH;ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(hgX+b/bins*hgW,hgY+hgH-bh,hgW/bins-1,bh);}
  // 2D Maxwell-Boltzmann fit: f(v) = (m/kT) v exp(-mv²/2kT)
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.8;
  ctx.beginPath();
  for(let i=0;i<=bins;i++){const v=i/bins*(maxSp*1.1);const fv=v/Teff*Math.exp(-v*v/(2*Teff));const sc=fv*maxSp*1.1/(0.5)*hgH/5;const sx=hgX+i/bins*hgW,sy=hgY+hgH-sc;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
  ctx.stroke();

  // Pressure history graph (right middle)
  const pX=540,pY=230,pW=330,pH=120;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(pX,pY,pW,pH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('PRESSURE HISTORY',pX+3,pY+10);
  if(pressHist.length>2){const pMn=Math.min(...pressHist),pMx=Math.max(...pressHist),pR=pMx-pMn||1;
    ctx.beginPath();for(let i=0;i<pressHist.length;i++){const sx=pX+(i/pressHist.length)*pW,sy=pY+pH-(pressHist[i]-pMn)/pR*pH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='#111';ctx.lineWidth=0.7;ctx.stroke();ctx.fillStyle='#999';ctx.font='5px monospace';
    ctx.fillText(pMx.toFixed(1),pX+pW-28,pY+8);ctx.fillText(pMn.toFixed(1),pX+pW-28,pY+pH-2);}

  // KE history (right bottom)
  const kX=540,kY=370,kW=330,kH=100;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(kX,kY,kW,kH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('KINETIC ENERGY HISTORY',kX+3,kY+10);
  if(keHist.length>2){const kMn=Math.min(...keHist),kMx=Math.max(...keHist),kR=kMx-kMn||1;
    ctx.beginPath();for(let i=0;i<keHist.length;i++){const sx=kX+(i/keHist.length)*kW,sy=kY+kH-(keHist[i]-kMn)/kR*kH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='#111';ctx.lineWidth=0.7;ctx.stroke();
    ctx.fillStyle='#999';ctx.font='5px monospace';ctx.fillText(kMx.toFixed(2),kX+kW-28,kY+8);ctx.fillText(kMn.toFixed(2),kX+kW-28,kY+kH-2);}

if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>N</label><input type="range" id="nS" min="20" max="300" step="10" value="${N}"><span class="val" id="nV">${N}</span></div>`+
    `<div class="ctrl-group"><label>T<sub>scale</sub></label><input type="range" id="tsS" min="0.2" max="5" step="0.1" value="${Tscale.toFixed(1)}"><span class="val" id="tsV">${Tscale.toFixed(1)}</span></div>`+
    `<div class="ctrl-group"><label>Piston</label><input type="range" id="pS" min="0.3" max="0.95" step="0.01" value="${pistonPos.toFixed(2)}"><span class="val" id="pV">${(pistonPos*100).toFixed(0)}%</span></div>`+
    `<button id="pauseBtn">${paused?'Play':'Pause'}</button><button id="resetBtn">Reset</button>`+
    `<div class="ctrl-group"><label>Speed</label><input type="range" id="speedS" min="1" max="10" step="1" value="${speed}"><span class="val" id="speedV">${speed}x</span></div>`;

  document.getElementById('nS')?.addEventListener('input',function(){N=parseInt(this.value);document.getElementById('nV').textContent=N;});
  document.getElementById('tsS')?.addEventListener('input',function(){Tscale=parseFloat(this.value);document.getElementById('tsV').textContent=Tscale.toFixed(1);});
  document.getElementById('pS')?.addEventListener('input',function(){pistonPos=parseFloat(this.value);document.getElementById('pV').textContent=(pistonPos*100).toFixed(0)+'%';});
  document.getElementById('pauseBtn')?.addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';});
  document.getElementById('resetBtn')?.addEventListener('click',resetSim);
  document.getElementById('speedS')?.addEventListener('input',function(){speed=parseInt(this.value);document.getElementById('speedV').textContent=speed+'x';});

}
  document.getElementById('stats').innerHTML=
    `<span><span class="label">N =</span> <span class="val">${N}</span></span>`+
    `<span><span class="label">⟨KE⟩ =</span> <span class="val">${avgKE.toFixed(3)}</span></span>`+
    `<span><span class="label">T<sub>eff</sub> =</span> <span class="val">${Teff.toFixed(3)}</span></span>`+
    `<span><span class="label">P<sub>est</sub> =</span> <span class="val">${pressure.toFixed(2)}</span></span>`+
    `<span><span class="label">v<sub>rms</sub> =</span> <span class="val">${vRms.toFixed(3)}</span></span>`+
    `<span><span class="label">ρ =</span> <span class="val">${density.toFixed(2)}</span></span>`+
    `<span><span class="label">Area =</span> <span class="val">${area.toFixed(0)}</span></span>`+
    `<span><span class="label">Wall hits =</span> <span class="val">${wallHits}</span></span>`+
    `<span><span class="label">Collisions =</span> <span class="val">${collisions}</span></span>`+
    `<span><span class="label">⟨v<sub>x</sub>⟩ =</span> <span class="val">${(totVx/N).toFixed(3)}</span></span>`+
    `<span><span class="label">⟨v<sub>y</sub>⟩ =</span> <span class="val">${(totVy/N).toFixed(3)}</span></span>`+
    `<span><span class="label">KE+PE =</span> <span class="val">${totKE.toFixed(2)}</span></span>`+
    `<span><span class="label">E<sub>cons</sub> =</span> <span class="val">${(totKE/(N*Teff)).toFixed(3)}</span></span>`;
}
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
