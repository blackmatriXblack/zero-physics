<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravitational Lensing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#ccc;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px}
h1{color:#fff;font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
canvas{border:1px solid #333;display:block}
#ctrl{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:11px}
#ctrl button{background:#222;border:1px solid #555;color:#ccc;padding:3px 10px;font:10px monospace;cursor:pointer;text-transform:uppercase}
#ctrl button:hover{background:#444;color:#fff}
#ctrl input[type=range]{accent-color:#888;width:100px;vertical-align:middle}
#ctrl label{font-size:10px;color:#888;text-transform:uppercase}
#data{font-size:10px;color:#777;margin-top:4px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<h1>Gravitational Lensing</h1>
<canvas id="c" width="750" height="480"></canvas>
<div id="ctrl"></div>
<div id="data"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),data=document.getElementById('data');
const W=750,H=480;
let paused=false, speed=1, mass=50;
let rays=[], showRing=true;
const NUM_RAYS=50;

function fireRays(){
  rays=[];
  for(let i=0;i<NUM_RAYS;i++){
    const yOff=(i-NUM_RAYS/2)*3.5+2, startX=-30;
    rays.push({
      x:startX,y:H/2+yOff,vx:2.8,vy:0,active:true,trail:[],
      b:Math.abs(yOff),origY:yOff
    });
  }
}

function update(){
  if(paused)return;
  for(const ray of rays){
    if(!ray.active)continue;
    const dx=ray.x-W/2, dy=ray.y-H/2, r2=dx*dx+dy*dy, r=Math.sqrt(r2);
    if(r>5){
      const alpha=4*mass/(r2+100);
      ray.vx-=alpha*dx;ray.vy-=alpha*dy;
    }
    const spd=Math.sqrt(ray.vx*ray.vx+ray.vy*ray.vy);
    if(spd>0){ray.vx=ray.vx/spd*2.8;ray.vy=ray.vy/spd*2.8}
    ray.x+=ray.vx*speed;ray.y+=ray.vy*speed;
    ray.trail.push({x:ray.x,y:ray.y});
    if(ray.trail.length>400)ray.trail.shift();
    if(r<10){ray.active=false;continue}
    if(ray.x>W+30||ray.y< -30||ray.y>H+30)ray.active=false;
  }
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(0,0,W,H);

  // background stars
  ctx.fillStyle='rgba(255,255,255,0.15)';
  for(let i=0;i<80;i++){
    const sx=(i*137.5)%W,sy=(i*97.3)%H;
    ctx.beginPath();ctx.arc(sx,sy,.5+i%2,0,Math.PI*2);ctx.fill();
  }

  // rays
  for(const ray of rays){
    if(ray.trail.length<2)continue;
    ctx.strokeStyle='rgba(200,200,200,0.6)';
    ctx.lineWidth=.8;
    ctx.beginPath();
    for(let i=0;i<ray.trail.length;i++){
      i===0?ctx.moveTo(ray.trail[i].x,ray.trail[i].y):ctx.lineTo(ray.trail[i].x,ray.trail[i].y);
    }
    ctx.stroke();
  }

  // lens
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,mass*.6+5);
  grad.addColorStop(0,'#444');grad.addColorStop(.4,'#222');grad.addColorStop(1,'#000');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(W/2,H/2,Math.max(mass*.5+5,8),0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#555';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(W/2,H/2,mass*.5+8,0,Math.PI*2);ctx.stroke();

  // Einstein ring
  if(showRing){
    const ringR=Math.sqrt(mass*4)*3+40;
    ctx.strokeStyle='rgba(200,200,200,0.15)';ctx.lineWidth=2;ctx.setLineDash([3,5]);
    ctx.beginPath();ctx.arc(W/2,H/2,ringR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#888';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('Einstein ring θ_E',W/2+ringR+30,H/2);
  }

  // labels
  ctx.fillStyle='#aaa';ctx.font='9px monospace';ctx.textAlign='left';
  ctx.fillText('Distant source (light from left)',10,20);
  ctx.fillText('Massive lens (galaxy / BH)',10,40);
  ctx.fillStyle='#888';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText(`α = 4GM/(bc²)  |  θ_E ∝ √M`,600,450);
  ctx.fillText(`M = ${mass}  |  Num rays: ${rays.filter(r=>r.active).length}/${rays.length}`,600,470);

  // deflection angle mini graph
  const gx=20,gy=350,gw=160,mgh=90;
  ctx.strokeStyle='#333';ctx.lineWidth=.5;ctx.strokeRect(gx,gy,gw,mgh);
  ctx.fillStyle='#888';ctx.font='7px monospace';ctx.fillText('Deflection α(b)',gx+3,gy+10);
  ctx.strokeStyle='rgba(200,200,200,.2)';ctx.lineWidth=.6;ctx.beginPath();
  for(let i=1;i<=gw;i++){const b=i/gw*100;const a=4*mass/(b+10);if(i===1)ctx.moveTo(gx+i,gy+mgh);else ctx.lineTo(gx+i,gy+mgh-a/30*mgh)}
  ctx.stroke();
  ctx.fillStyle='#888';ctx.font='6px monospace';
  ctx.fillText('b →',gx+gw-20,gy+mgh-3);

  // deflection stats per ray
  const activeRays=rays.filter(r=>r.active);
  let avgDeflection=0, count=0;
  for(const r of rays){
    if(r.trail.length>10){
      const last=r.trail[r.trail.length-1], first=r.trail[0];
      const def=Math.abs(last.y-first.y);
      avgDeflection+=def;count++;
    }
  }
  if(count>0)avgDeflection/=count;

  data.innerHTML=
    `Mass M = ${mass} | Einstein ring θ_E ∝ √M = ${Math.sqrt(mass*4).toFixed(1)}`+
    ` | Active rays: ${activeRays.length}/${rays.length}`+
    ` | Avg deflection: ${avgDeflection.toFixed(1)} px`+
    ` | α(b) = 4GM/(bc²) for small b`;
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

fireRays();

const ctrl=document.getElementById('ctrl');
ctrl.innerHTML=`
<label>Mass <input type="range" id="massS" min="10" max="150" value="${mass}" step="1"><span id="massD">${mass}</span></label>
<label>Speed <input type="range" id="spdS" min="0" max="3" value="1" step="0.1"></label>
<button id="playBtn">Pause</button>
<button id="fireBtn">Fire Rays</button>
<button id="clearBtn">Clear</button>`;

document.getElementById('massS').oninput=function(){mass=parseInt(this.value);document.getElementById('massD').textContent=mass};
document.getElementById('spdS').oninput=function(){speed=parseFloat(this.value)};
document.getElementById('playBtn').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause'};
document.getElementById('fireBtn').onclick=fireRays;
document.getElementById('clearBtn').onclick=()=>{rays=[]};
</script>
</body>
</html>
