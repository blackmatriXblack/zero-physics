<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bernoulli's Principle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:60px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Bernoulli's Principle</h1>
<div class="eq">P + ½ρv² + ρgh = const · A₁v₁ = A₂v₂</div>
<canvas id="c" width="820" height="420"></canvas>
<div class="ctrl" id="ctrl">
<label>Speed <input type="range" id="spd" min="5" max="150" value="50"></label>
<label>Constriction <input type="range" id="con" min="20" max="75" value="45"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="8" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let play=1,spd=1,con=0.45,spdMul=3,parts=[],t=0;
const rho=1,P0=100,N=300;
function hh(x){const t=x/W;return 75-con*55*Math.sin(t*Math.PI)}
function resetP(){parts=[];for(let i=0;i<N;i++){const x=Math.random()*W,h=hh(x);parts.push({x,y:H/2+(Math.random()-.5)*2*h*.9})}}
function getV(x){return spd*hh(0)/hh(x)}
function getP(x){const v=getV(x),v0=getV(0);return P0+.5*rho*(v0*v0-v*v)}
resetP();
let hist={t:[],vThroat:[],pInlet:[],pThroat:[],energy:[]};
function step(){if(!play)return;for(let i=0;i<spdMul;i++){for(const p of parts){const v=getV(p.x);p.x+=v*.5;const hh0=hh(p.x)*.9;const cy=H/2;p.y+=Math.random()-.5;p.y=Math.max(cy-hh0,Math.min(cy+hh0,p.y));if(p.x>W){p.x=0;p.y=H/2+(Math.random()-.5)*2*hh(0)*.9}}t++}if(t%3===0){hist.t.push(t);hist.vThroat.push(getV(W*.5));hist.pInlet.push(getP(W*.1));hist.pThroat.push(getP(W*.5));const ke=.5*rho*getV(W*.5)**2;hist.energy.push(ke);if(hist.t.length>200){hist.t.shift();hist.vThroat.shift();hist.pInlet.shift();hist.pThroat.shift();hist.energy.shift()}}}
function drawMiniGraph(x,y,w,h,data,color,label,minV,maxV){
  if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);
  if(minV===undefined){minV=Math.min(...data);maxV=Math.max(...data)}const range=maxV-minV||1;
  ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<data.length;i++){const px=x+i*w/data.length,py=y+h-(data[i]-minV)/range*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
  ctx.stroke();
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);
  ctx.restore();
}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=W;x+=2){const h=hh(x);x===0?ctx.moveTo(x,H/2-h):ctx.lineTo(x,H/2-h)}
  for(let x=W;x>=0;x-=2){const h=hh(x);ctx.lineTo(x,H/2+h)}ctx.closePath();ctx.stroke();
  for(const p of parts){const v=getV(p.x);const b=Math.max(0,Math.min(255,200-v*25));ctx.fillStyle=`rgb(${b},${b},${b})`;ctx.beginPath();ctx.arc(p.x,p.y,1.5+v*.25,0,Math.PI*2);ctx.fill()}
  const arr=[.15,.35,.5,.65,.85];ctx.strokeStyle='#666';ctx.lineWidth=1;
  for(const pos of arr){const x=pos*W,v=getV(x),len=8+v*18;ctx.beginPath();ctx.moveTo(x-len/2,H/2);ctx.lineTo(x+len/2,H/2);ctx.stroke();ctx.beginPath();ctx.moveTo(x+len/2,H/2);ctx.lineTo(x+len/2-4,H/2-3);ctx.moveTo(x+len/2,H/2);ctx.lineTo(x+len/2-4,H/2+3);ctx.stroke()}
  ctx.font='9px monospace';ctx.fillStyle='#666';ctx.textAlign='center';
  ctx.fillText('↓ Low v, High P',.18*W,H/2+hh(.18*W)+18);ctx.fillText('↓ High v, Low P',.5*W,H/2-hh(.5*W)-10);ctx.fillText('↓ Low v, High P',.82*W,H/2+hh(.82*W)+18);
  ctx.strokeStyle='#ccc';ctx.lineWidth=.5;
  for(const pos of arr){const x=pos*W;ctx.beginPath();ctx.setLineDash([2,2]);ctx.moveTo(x,H/2-hh(x));ctx.lineTo(x,H/2+hh(x)+10);ctx.stroke();ctx.setLineDash([])}
  drawMiniGraph(5,H-85,120,50,hist.vThroat,'rgba(0,0,0,.7)','v_throat');drawMiniGraph(W-125,H-85,120,50,hist.energy,'rgba(0,0,0,.5)','KE');
  const v0=getV(0),Bt=P0+.5*rho*v0*v0;
  ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('Bernoulli const: '+Bt.toFixed(1),8,14);
  ctx.fillText('v₀='+spd.toFixed(2)+' t='+t,8,26);
  let h='';const fields=[
    ['t',t.toFixed(0)],['v(0)',getV(0).toFixed(2)],['v(0.5)',getV(W*.5).toFixed(2)],['v(1)',getV(W).toFixed(2)],
    ['P(0)',getP(0).toFixed(1)],['P(0.5)',getP(W*.5).toFixed(1)],['P(1)',getP(W).toFixed(1)],
    ['A₀/A₁',(hh(0)/hh(W*.5)).toFixed(2)],['ρ',rho.toFixed(1)],['½ρv²(0)',(.5*rho*getV(0)**2).toFixed(1)],
    ['½ρv²(0.5)',(.5*rho*getV(W*.5)**2).toFixed(1)],['Bernoulli C',Bt.toFixed(1)],
    ['min P',Math.min(getP(0),getP(W*.5),getP(W)).toFixed(1)],['max v',Math.max(getV(0),getV(W*.5),getV(W)).toFixed(2)],
    ['dyn. head(0)',(.5*rho*getV(0)**2/rho/9.81).toFixed(2)]
  ];
  for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
  document.getElementById('d').innerHTML=h;
}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=()=>{t=0;resetP();hist={t:[],vThroat:[],pInlet:[],pThroat:[],energy:[]}}
document.getElementById('spd').oninput=e=>{spd=e.value/25;document.getElementById('spd').previousSibling.textContent=spd.toFixed(1)}
document.getElementById('con').oninput=e=>{con=e.value/100;resetP()}
document.getElementById('rate').oninput=e=>{spdMul=parseInt(e.value)}
loop();
</script>
</body>
</html>
