<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Duffing Oscillator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:55px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Duffing Oscillator</h1>
<div class="eq">ẍ + cẋ − x + αx³ = F·cos(ωt) · Bistability & Chaos</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>F <input type="range" id="fS" min="0" max="100" value="42"></label>
<label>c <input type="range" id="cS" min="0" max="100" value="25"></label>
<label>α <input type="range" id="aS" min="0" max="200" value="100"></label>
<label>ω <input type="range" id="wS" min="50" max="200" value="120"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const M={t:30,r:20,b:35,l:45},pw=W-M.l-M.r,ph=H-M.t-M.b;
let play=1,spd=3,F=.42,c0=.25,alpha=1,omega=1.2;
let x=.5,v=0,t=0,trail=[],poin=[],lastPT=0;
let hist={x:[],v:[],E:[],tData:[]};
const dt=.05;
function deriv(x,v,t_,F,c0,alpha){return{dx:v,dv:F*Math.cos(omega*t_)-c0*v-(-1)*x-alpha*x*x*x}}
function rk4(x,v,t_,dt,F,c0,alpha){const k1=deriv(x,v,t_,F,c0,alpha);const k2=deriv(x+.5*dt*k1.dx,v+.5*dt*k1.dv,t_+.5*dt,F,c0,alpha);const k3=deriv(x+.5*dt*k2.dx,v+.5*dt*k2.dv,t_+.5*dt,F,c0,alpha);const k4=deriv(x+dt*k3.dx,v+dt*k3.dv,t_+dt,F,c0,alpha);return{x:x+dt/6*(k1.dx+2*k2.dx+2*k3.dx+k4.dx),v:v+dt/6*(k1.dv+2*k2.dv+2*k3.dv+k4.dv),t:t_+dt}}
function mapC(xx,vv){const sX=2.5,sV=3.5;return{x:M.l+(xx/sX+.5)*pw,y:M.t+(.5-vv/sV)*ph}}
function reset(){x=.5+(Math.random()-.5)*.2;v=0;t=0;trail=[];poin=[];lastPT=0;hist={x:[],v:[],E:[],tData:[]}}
function step(){if(!play)return;for(let i=0;i<spd*2;i++){const r=rk4(x,v,t,dt,F,c0,alpha);x=r.x;v=r.v;t=r.t;trail.push({x,v});if(trail.length>20000)trail.shift();const T=2*Math.PI/omega;if(t-lastPT>=T){poin.push({x:mod(x),v});lastPT+=T;if(poin.length>3000)poin.shift()}}
if(t%Math.ceil(5/spd||1)===0){hist.x.push(x);hist.v.push(v);const Ek=.5*v*v,Ep=-.5*x*x+.25*alpha*x*x*x*x;hist.E.push(Ek+Ep);hist.tData.push(t);if(hist.x.length>200){hist.x.shift();hist.v.shift();hist.E.shift();hist.tData.shift()}}}
function mod(a){return((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI}
function drawMini(x,y,w,h,data,color,label){if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<data.length;i++){const px=x+i*w/data.length,py=y+h-(data[i]-mn)/rng*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);ctx.restore()}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ccc';ctx.lineWidth=.5;const cx0=M.l+pw/2,cy0=M.t+ph/2;ctx.beginPath();ctx.moveTo(M.l,cy0);ctx.lineTo(M.l+pw,cy0);ctx.moveTo(cx0,M.t);ctx.lineTo(cx0,M.t+ph);ctx.stroke();
ctx.fillStyle='#999';ctx.font='8px monospace';ctx.textAlign='center';for(let i=-2;i<=2;i++){if(i===0)continue;ctx.fillText(i.toFixed(1),M.l+(i/2.5+.5)*pw,cy0+13)}ctx.textAlign='right';for(let i=-2;i<=2;i++){if(i===0)continue;ctx.fillText(i.toFixed(1),cx0-5,M.t+(.5-i/3.5)*ph+3)}
if(trail.length>1){ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=.8;ctx.beginPath();const p0=mapC(trail[0].x,trail[0].v);ctx.moveTo(p0.x,p0.y);for(let i=1;i<trail.length;i++){const p=mapC(trail[i].x,trail[i].v);ctx.lineTo(p.x,p.y)}ctx.stroke()}
for(const p of poin){const pt=mapC(p.x,p.v);ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.arc(pt.x,pt.y,2,0,Math.PI*2);ctx.fill()}
if(trail.length>0){const p=mapC(trail[trail.length-1].x,trail[trail.length-1].v);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
drawMini(5,H-90,130,45,hist.E,'rgba(0,0,0,.7)','Energy');drawMini(W-135,H-90,130,45,hist.x,'rgba(0,0,0,.5)','x(t)');
ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';
const Ek=.5*v*v,Ep=-.5*x*x+.25*alpha*x*x*x*x,Et=Ek+Ep;
ctx.fillText('F='+F.toFixed(2)+' c='+c0.toFixed(2)+' α='+alpha.toFixed(2)+' ω='+omega.toFixed(2),8,14);
ctx.fillText('x='+x.toFixed(3)+' v='+v.toFixed(3)+' t='+t.toFixed(1),8,26);
let h='';const fields=[['x',x.toFixed(4)],['v',v.toFixed(4)],['t',t.toFixed(1)],['Ek',Ek.toFixed(4)],['Ep',Ep.toFixed(4)],['Et',Et.toFixed(4)],['F_drive',F.toFixed(3)],['c_damp',c0.toFixed(3)],['α_nonlin',alpha.toFixed(3)],['ω_drive',omega.toFixed(3)],['T_drive',(2*Math.PI/omega).toFixed(3)],['max|x|',trail.length>0?Math.max(...trail.map(p=>Math.abs(p.x))).toFixed(3):'0'],
['max|v|',trail.length>0?Math.max(...trail.map(p=>Math.abs(p.v))).toFixed(3):'0'],['Poincaré pts',poin.length],['restoring',(-x+alpha*x*x*x).toFixed(4)],['forcing',(F*Math.cos(omega*t)).toFixed(4)]];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=reset;
document.getElementById('fS').oninput=e=>{F=e.value/100;reset()}
document.getElementById('cS').oninput=e=>{c0=e.value/100;reset()}
document.getElementById('aS').oninput=e=>{alpha=e.value/100;reset()}
document.getElementById('wS').oninput=e=>{omega=.6+e.value/100;reset()}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
reset();loop();
</script>
</body>
</html>
