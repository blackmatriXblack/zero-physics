<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relativistic Doppler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
canvas{border:1px solid #000;display:block}
#ctrl{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:11px}
#ctrl button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font:10px monospace;cursor:pointer;text-transform:uppercase}
#ctrl button:hover{background:#000;color:#fff}
#ctrl input[type=range]{accent-color:#000;width:100px;vertical-align:middle}
#ctrl label{font-size:10px;color:#666;text-transform:uppercase}
#data{font-size:10px;color:#555;margin-top:4px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<h1>Relativistic Doppler Effect</h1>
<canvas id="c" width="750" height="480"></canvas>
<div id="ctrl"></div>
<div id="data"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),data=document.getElementById('data');
const W=750,H=480;
let paused=false, speed=1, beta=0.4, sourceX=100, time=0;
let waves=[], waveTimer=0, wavePeriod=20;
let historyApp=[], historyRec=[], historyBeta=[], historyGamma=[];
let approaching=true;

function resetSim(){waves=[];waveTimer=0;sourceX=100;time=0;historyApp=[];historyRec=[];historyBeta=[];historyGamma=[]}

function update(){
  if(paused)return;
  time+=.02*speed;
  waveTimer+=.02*speed;
  const gamma=1/Math.sqrt(1-beta*beta);
  const dopplerApp=Math.sqrt((1+beta)/(1-beta));
  const dopplerRec=Math.sqrt((1-beta)/(1+beta));
  historyApp.push({t:time,val:dopplerApp});historyRec.push({t:time,val:dopplerRec});historyBeta.push({t:time,val:beta});historyGamma.push({t:time,val:gamma});
  if(historyApp.length>300){historyApp.shift();historyRec.shift();historyBeta.shift();historyGamma.shift()}

  if(waveTimer>=wavePeriod/50*speed){
    waveTimer=0;
    waves.push({x:sourceX,y:H/2,r:0,age:0});
  }
  const dir=approaching?1:-1;
  sourceX+=beta*dir*1.2*speed;
  if(sourceX>550){approaching=false}
  if(sourceX<100){approaching=true}

  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];w.r+=2.5*speed;w.age++;
    if(w.r>650)waves.splice(i,1);
  }
  if(waves.length>120)waves.splice(0,waves.length-120);
}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const gamma=1/Math.sqrt(1-beta*beta);
  const dopplerApp=Math.sqrt((1+beta)/(1-beta));
  const dopplerRec=Math.sqrt((1-beta)/(1+beta));

  // wave circles
  for(const w of waves){
    const alpha=Math.max(0,1-w.age/80);
    const gray=Math.round(200*alpha);
    ctx.strokeStyle=`rgba(${gray},${gray},${gray},${alpha})`;
    ctx.lineWidth=.5+alpha*1.5;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();
  }

  // source
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sourceX,H/2,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText('S',sourceX,H/2+3);

  // observer
  const obsX=620;
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(obsX,H/2,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText('O',obsX,H/2+3);
  ctx.fillStyle='#999';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText('→ v',sourceX+14,H/2-8);

  // mid line
  ctx.strokeStyle='#ddd';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();

  // wave labels
  ctx.fillStyle='#999';ctx.font='8px monospace';ctx.textAlign='left';
  ctx.fillText('Source emits concentric wavefronts',10,20);
  ctx.fillText(approaching?'Approaching (blueshift)':'Receding (redshift)',10,35);

  // formulas
  ctx.fillStyle='#000';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText('Relativistic Doppler:  f\'/f = √((1+β)/(1-β))  (approach)',375,280);
  ctx.fillStyle='#666';
  ctx.fillText('f\'/f = √((1-β)/(1+β))  (recede)',375,300);
  ctx.fillStyle='#000';ctx.font='10px monospace';
  ctx.fillText(`β = ${beta.toFixed(3)}  γ = ${gamma.toFixed(3)}`,375,325);
  ctx.fillText(`f\'/f (approach) = ${dopplerApp.toFixed(4)}`,375,350);
  ctx.fillText(`f\'/f (recede) = ${dopplerRec.toFixed(4)}`,375,370);
  ctx.fillStyle='#999';ctx.font='8px monospace';
  ctx.fillText(`Classical approach: ${(1+beta).toFixed(4)}  |  Classical recede: ${(1-beta).toFixed(4)}`,375,390);

  // mini graph: doppler shift vs beta
  const gx=40,gy=310,gw=150,gh=120;
  ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.font='7px monospace';ctx.fillText('f\'/f vs β',gx+3,gy+10);
  ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=.6;ctx.beginPath();
  for(let i=0;i<=gw;i++){const b=i/gw*.95;const d=Math.sqrt((1+b)/(1-b));i===0?ctx.moveTo(gx+i,gy+gh-d/6*gh):ctx.lineTo(gx+i,gy+gh-d/6*gh)}
  ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=.6;ctx.beginPath();
  for(let i=0;i<=gw;i++){const b=i/gw*.95;const d=Math.sqrt((1-b)/(1+b));i===0?ctx.moveTo(gx+i,gy+gh):ctx.lineTo(gx+i,gy+gh-d)}
  ctx.stroke();
  const cgx=gx+beta/.95*gw;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cgx,gy+gh-dopplerApp/6*gh,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';ctx.beginPath();ctx.arc(cgx,gy+gh-dopplerRec,2.5,0,Math.PI*2);ctx.fill();

  // mini history graph
  const gx2=W-180,gy2=310,gw2=160,gh2=120;
  ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(gx2,gy2,gw2,gh2);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.font='7px monospace';ctx.fillText('f\'/f history',gx2+3,gy2+10);
  if(historyApp.length>3){
    ctx.strokeStyle='#000';ctx.lineWidth=.6;ctx.beginPath();
    for(let i=0;i<historyApp.length;i++){const px=gx2+i/historyApp.length*gw2,py=gy2+gh2/2-historyApp[i].val*10;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
    ctx.stroke();
    ctx.strokeStyle='#999';ctx.lineWidth=.6;ctx.beginPath();
    for(let i=0;i<historyRec.length;i++){const px=gx2+i/historyRec.length*gw2,py=gy2+gh2/2+historyRec[i].val*10;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
    ctx.stroke();
  }

  data.innerHTML=
    `β = ${beta.toFixed(3)} | γ = ${gamma.toFixed(3)} | f'_app/f = ${dopplerApp.toFixed(4)} | f'_rec/f = ${dopplerRec.toFixed(4)}`+
    ` | z_app = ${(dopplerApp-1).toFixed(4)} | z_rec = ${(dopplerRec-1).toFixed(4)}`+
    ` | Waves: ${waves.length} | ${approaching?'APPROACHING':'RECEDING'}`+
    ` | Classical app = ${(1+beta).toFixed(4)} | Classical rec = ${(1-beta).toFixed(4)}`;
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

const ctrl=document.getElementById('ctrl');
ctrl.innerHTML=`
<label>β <input type="range" id="betaS" min="0" max="0.9" value="${beta*100}" step="1"><span id="betaD">${beta.toFixed(2)}</span></label>
<label>Speed <input type="range" id="spdS" min="0" max="3" value="1" step="0.1"></label>
<button id="playBtn">Pause</button>
<button id="resetBtn">Reset</button>`;

document.getElementById('betaS').oninput=function(){beta=parseInt(this.value)/100;document.getElementById('betaD').textContent=beta.toFixed(2);resetSim()};
document.getElementById('spdS').oninput=function(){speed=parseFloat(this.value)};
document.getElementById('playBtn').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause'};
document.getElementById('resetBtn').onclick=resetSim;
</script>
</body>
</html>
