<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inclined Plane · a = g(sinθ − μcosθ)</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}p{font-size:0.75em;color:#666;margin-bottom:10px}canvas{border:1px solid #000;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;max-width:900px}.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:4px 10px;border-radius:2px}.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}.ctrl-group input[type=range]{width:70px;accent-color:#000}.ctrl-group .val{font-size:0.7em;color:#000;min-width:24px;text-align:right}button{background:#fff;border:1px solid #000;color:#000;padding:4px 12px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}button:hover{background:#000;color:#fff}.stats{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px;font-size:0.65em;color:#666;max-width:900px;justify-content:center}.stats span{white-space:nowrap}.stats .label{color:#999}.stats .val{color:#000;font-weight:700}</style>
</head>
<body>
<h1>Inclined Plane</h1>
<p>a = g(sinθ − μcosθ) — Block sliding with friction</p>
<canvas id="c" width="900" height="480"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const g=9.81;
let angle=30,mu=0.2,blockMass=1;
let blockX=0,v=0,simTime=0;
const blockW=40,blockH=30;
const rampLength=500;
const rampStartX=60,rampStartY=420;
let paused=false;
const history={t:[],v:[],a:[],x:[]};

function getA(theta){
  return g*(Math.sin(theta)-mu*Math.cos(theta));
}

function step(){
  if(paused)return;
  const theta=angle*Math.PI/180;
  const maxX=rampLength-blockW/Math.cos(theta);
  const a=getA(theta);
  v+=a*0.005;blockX+=v*0.005;simTime+=0.005;
  if(blockX>maxX){blockX=maxX;v=0;}
  if(blockX<0){blockX=0;v=0;}
  history.t.push(simTime);history.v.push(v);history.a.push(a);history.x.push(blockX);
  if(history.t.length>500){history.t.shift();history.v.shift();history.a.shift();history.x.shift();}
}

function resetSim(){
  blockX=0;v=0;simTime=0;
  history.t.length=0;history.v.length=0;history.a.length=0;history.x.length=0;
  paused=false;document.getElementById('pauseBtn').textContent='Pause';
}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const theta=angle*Math.PI/180;
  const cosA=Math.cos(theta),sinA=Math.sin(theta);
  const endX=rampStartX+rampLength*cosA;
  const endY=rampStartY-rampLength*sinA;

  // Ramp
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(rampStartX-30,rampStartY);ctx.lineTo(endX,endY);ctx.stroke();
  // Vertical wall
  ctx.beginPath();ctx.moveTo(endX,endY);ctx.lineTo(endX,rampStartY);ctx.stroke();
  // Ground
  ctx.beginPath();ctx.moveTo(rampStartX-30,rampStartY);ctx.lineTo(W-20,rampStartY);ctx.stroke();
  // Angle arc
  ctx.beginPath();ctx.arc(rampStartX,rampStartY,40,Math.PI,-Math.PI/2-theta,true);
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.5;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillText('θ='+angle.toFixed(1)+'°',rampStartX+60,rampStartY-12);

  // Block position
  const bx=rampStartX+(blockX+blockW/2)*cosA;
  const by=rampStartY-(blockX+blockW/2)*sinA;

  // Block
  ctx.save();ctx.translate(bx,by);ctx.rotate(-theta);
  const grad=ctx.createLinearGradient(-blockW/2,-blockH/2,blockW/2,blockH/2);
  grad.addColorStop(0,'#333');grad.addColorStop(1,'#000');
  ctx.fillStyle=grad;ctx.fillRect(-blockW/2,-blockH/2,blockW,blockH);
  ctx.strokeStyle='#fff';ctx.lineWidth=0.5;ctx.strokeRect(-blockW/2+2,-blockH/2+2,blockW-4,blockH-4);
  ctx.restore();

  // Force vectors
  const a=getA(theta);
  const aGrav=g*sinA;
  const aFric=mu*g*cosA;
  const N=g*cosA;
  const fs=12;

  ctx.save();ctx.translate(bx,by);ctx.rotate(-theta);
  // Normal
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-N*fs);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.fillText('N',4,-N*fs/2);
  // Friction
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-aFric*fs*0.5,0);ctx.stroke();
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.fillText('f',-aFric*fs*0.5-10,3);
  // Parallel gravity
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(aGrav*fs*0.7,0);ctx.stroke();
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('g sinθ',aGrav*fs*0.4-2,3);
  ctx.restore();

  // Velocity & acceleration graph
  const gx=500,gy=40,gW=380,gH=100;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gW,gH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('v(t)',gx+3,gy+10);
  if(history.v.length>2){
    const vMax=Math.max(...history.v)*1.1||1;
    const tMin=Math.max(0,simTime-3);
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.3;ctx.beginPath();ctx.moveTo(gx,gy+gH/2);ctx.lineTo(gx+gW,gy+gH/2);ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<history.v.length;i++){const sx=gx+(history.t[i]-tMin)/3*gW;const sy=gy+gH/2-(history.v[i]/vMax)*(gH/2-4);i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='#111';ctx.lineWidth=0.8;ctx.stroke();
  }

  // Acceleration graph
  const ax_=500,ay_=160,aW_=380,aH_=60;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(ax_,ay_,aW_,aH_);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('a(t)',ax_+3,ay_+10);
  if(history.a.length>2){
    const aMax=Math.max(...history.a.map(Math.abs))*1.1||1;
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.3;ctx.beginPath();ctx.moveTo(ax_,ay_+aH_/2);ctx.lineTo(ax_+aW_,ay_+aH_/2);ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<history.a.length;i++){const sx=ax_+(history.t[i]/simTime)*aW_;const sy=ay_+aH_/2-(history.a[i]/aMax)*(aH_/2-4);i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.6;ctx.stroke();
  }

  // Energy graph
  const ex=500,ey=240,eW=380,eH=80;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(ex,ey,eW,eH);
  ctx.fillStyle='#111';ctx.font='7px monospace';ctx.fillText('ENERGY',ex+3,ey+10);
  if(history.v.length>2){
    const m=blockMass;
    const pe=history.x.map(xi=>m*g*xi*sinA);
    const ke=history.v.map(vi=>0.5*m*vi*vi);
    const eMax=Math.max(...pe,...ke)*1.05||1;
    ctx.beginPath();
    for(let i=0;i<ke.length;i++){const sx=ex+(i/ke.length)*eW;const sy=ey+eH-(ke[i]/eMax)*eH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.6;ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<pe.length;i++){const sx=ex+(i/pe.length)*eW;const sy=ey+eH-(pe[i]/eMax)*eH;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.4;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);
  }

  // Critical angle info
  const thetaCrit=Math.atan(mu)*180/Math.PI;

  // Controls
if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>θ</label><input type="range" id="angS" min="1" max="85" step="0.5" value="${angle}"><span class="val" id="angV">${angle.toFixed(1)}°</span></div>`+
    `<div class="ctrl-group"><label>μ</label><input type="range" id="muS" min="0" max="1" step="0.005" value="${mu}"><span class="val" id="muV">${mu.toFixed(3)}</span></div>`+
    `<div class="ctrl-group"><label>m</label><input type="range" id="mS" min="0.1" max="10" step="0.1" value="${blockMass}"><span class="val" id="mV">${blockMass.toFixed(1)}</span></div>`+
    `<button id="pauseBtn">Pause</button><button id="resetBtn">Reset</button>`;

  document.getElementById('angS').addEventListener('input',function(){angle=parseFloat(this.value);document.getElementById('angV').textContent=angle.toFixed(1)+'°';resetSim();});
  document.getElementById('muS').addEventListener('input',function(){mu=parseFloat(this.value);document.getElementById('muV').textContent=mu.toFixed(3);resetSim();});
  document.getElementById('mS').addEventListener('input',function(){blockMass=parseFloat(this.value);document.getElementById('mV').textContent=blockMass.toFixed(1);});
  document.getElementById('pauseBtn').addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';});
  document.getElementById('resetBtn').addEventListener('click',resetSim);
}

  const KE=0.5*blockMass*v*v;
  const PE=blockMass*g*blockX*sinA/100;

  document.getElementById('stats').innerHTML=
    `<span><span class="label">v =</span> <span class="val">${v.toFixed(4)}</span> m/s</span>`+
    `<span><span class="label">a =</span> <span class="val">${a.toFixed(4)}</span> m/s²</span>`+
    `<span><span class="label">x =</span> <span class="val">${(blockX/100).toFixed(2)}</span> m</span>`+
    `<span><span class="label">KE =</span> <span class="val">${KE.toFixed(3)}</span> J</span>`+
    `<span><span class="label">PE =</span> <span class="val">${PE.toFixed(3)}</span> J</span>`+
    `<span><span class="label">θ_crit =</span> <span class="val">${thetaCrit.toFixed(2)}°</span></span>`+
    `<span><span class="label">a_∥ =</span> <span class="val">${aGrav.toFixed(3)}</span></span>`+
    `<span><span class="label">a_⊥ =</span> <span class="val">${aFric.toFixed(3)}</span></span>`+
    `<span><span class="label">N =</span> <span class="val">${(N*blockMass).toFixed(3)}</span> N</span>`+
    `<span><span class="label">t =</span> <span class="val">${simTime.toFixed(2)}</span> s</span>`;
}

function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
