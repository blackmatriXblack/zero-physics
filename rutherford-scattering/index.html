<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutherford Scattering · dσ/dΩ ∝ 1/sin⁴(θ/2)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;overflow:hidden;user-select:none}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px;right:10px;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;align-items:center}
.panel{background:rgba(255,255,255,0.85);border:1px solid rgba(0,0,0,0.15);padding:5px 10px;font-size:11px;line-height:1.5}
.panel .eq{font-size:13px;margin-bottom:3px}
button{background:#fff;border:1px solid #111;padding:4px 10px;font:11px/1.4 'Courier New',monospace;cursor:pointer;color:#111;pointer-events:auto;letter-spacing:1px;text-transform:uppercase}
button:hover{background:#111;color:#fff}
input[type=range]{accent-color:#111;width:72px;vertical-align:middle;pointer-events:auto}
label{font-size:11px;pointer-events:auto;white-space:nowrap}
#data{position:absolute;bottom:8px;left:8px;right:8px;pointer-events:none;display:flex;gap:5px;flex-wrap:wrap}
.dbox{border:1px solid rgba(0,0,0,0.12);padding:2px 6px;font-size:10px;line-height:1.4;background:rgba(255,255,255,0.8);min-width:65px}
.dbox b{font-size:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div class="row">
<div class="panel"><div class="eq">dσ/dΩ = (Z₁Z₂e²/4E)² · 1/sin⁴(θ/2)</div></div>
<div class="panel" style="display:flex;gap:6px;align-items:center">
<button id="playBtn">⏸</button>
<button id="resetBtn">↺</button>
<button id="fireBtn">FIRE</button>
<label>Speed <input type="range" id="speed" min="0.1" max="4" step="0.1" value="1"></label>
</div>
</div>
<div class="row">
<div class="panel" style="display:flex;gap:6px;align-items:center">
<label>E_α <input type="range" id="energy" min="1" max="20" step="0.5" value="5"></label>
<label>Z_targ <input type="range" id="zTarg" min="2" max="92" step="1" value="79"></label>
<label>impact b <input type="range" id="impact" min="0.5" max="8" step="0.5" value="4"></label>
<label>nParticles <input type="range" id="nPart" min="20" max="150" step="10" value="60"></label>
</div>
</div>
</div>
<div id="data"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
const CX=W*0.45,CY=H*0.55;
let particles=[],scatteringAngles=[],paused=false,speed=1;
let beamEnergy=5,zTarg=79,impactSpread=4,nParticles=60,emitCount=0;
let firePending=false;
const maxHist=500;

function coulombForce(px,py){
  const dx=px-CX,dy=py-CY,r2=dx*dx+dy*dy;
  if(r2<64)return {fx:0,fy:0};
  const r=Math.sqrt(r2),fMag=zTarg*2*7200/(r2*beamEnergy);
  return {fx:fMag*dx/r,fy:fMag*dy/r};
}
function step(){
  if(paused)return;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];if(!p.active)continue;
    const f=coulombForce(p.x,p.y);
    p.vx+=f.fx*0.03*speed;p.vy+=f.fy*0.03*speed;
    p.x+=p.vx*0.5*speed;p.y+=p.vy*0.5*speed;
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>80)p.trail.shift();
    const dx=p.x-CX,dy=p.y-CY,d2=dx*dx+dy*dy;
    if(d2<64){p.active=false;continue}
    if(p.x>W+50||p.x<-100||p.y<-100||p.y>H+100){
      p.active=false;
      if(p.x>W+50||p.y<0||p.y>H){
        const ang=Math.atan2(p.y-CY,p.x-CX)*180/Math.PI;
        if(ang>-5&&ang<175){scatteringAngles.push(ang);if(scatteringAngles.length>maxHist)scatteringAngles.shift()}
      }
    }
  }
  if(firePending){firePending=false;fireBeam()}
}
function fireBeam(){
  emitCount++;
  for(let i=0;i<nParticles;i++){
    const yOff=(i-nParticles/2)*impactSpread*0.6;
    const v=0.4+beamEnergy*0.1;
    particles.push({x:-30,y:CY+yOff,vx:v,vy:0,active:true,trail:[],radius:1.8,initialY:yOff});
  }
}
function reset(){
  particles=[];scatteringAngles=[];emitCount=0;
}
function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.beginPath();ctx.arc(CX,CY,8,0,6.28);ctx.fill();
  ctx.fillStyle='#111';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('Au',CX,CY+3);
  for(const p of particles){
    if(!p.active)continue;
    if(p.trail.length>1){
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.beginPath();
      for(let i=0;i<p.trail.length;i++){i===0?ctx.moveTo(p.trail[i].x,p.trail[i].y):ctx.lineTo(p.trail[i].x,p.trail[i].y)}
      ctx.stroke();
    }
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,6.28);ctx.fill();
  }
  const gx=W*0.78,gw=W*0.2,gy=H*0.08,gh=H*0.8;
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('θ distribution',gx+4,gy+12);
  ctx.fillText('N(θ)',gx+4,gy+gh-4);
  if(scatteringAngles.length>5){
    const bins=24,bw=gw/bins;const maxA=175,minA=0,rangeA=maxA-minA;
    const histB=new Array(bins).fill(0);
    for(const a of scatteringAngles){const idx=Math.min(bins-1,Math.max(0,Math.floor((a-minA)/rangeA*bins)));histB[idx]++}
    const maxC=Math.max(...histB,1);
    for(let i=0;i<bins;i++){const bh=histB[i]/maxC*gh*0.9;ctx.fillStyle='rgba(0,0,0,'+(0.3+0.4*histB[i]/maxC)+')';ctx.fillRect(gx+i*bw+1,gy+gh-bh,bw-2,bh)}
    ctx.beginPath();
    for(let i=1;i<bins-1;i++){const th=1.5+i*rangeA/bins*Math.PI/180;const r=1/Math.pow(Math.sin(th/2),4);if(isFinite(r)){const sx=gx+(i+0.5)*bw,sy=gy+gh-r/(1e4)*gh*0.5;i===1?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy)}}
    ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1;ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.font='8px monospace';ctx.fillText('∝ 1/sin⁴(θ/2)',gx+4,gy+gh-16);
  }
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.font='10px monospace';ctx.fillText('α beam →',10,20);
  const active=particles.filter(p=>p.active).length;
  const scatCount=scatteringAngles.length;
  const meanAng=scatCount>0?scatteringAngles.reduce((a,b)=>a+Math.abs(b),0)/scatCount:0;
  const dMin=zTarg*2*1.44/beamEnergy;
  const dataEl=document.getElementById('data');
  let html='';
  const meanSqAng=scatCount>0?Math.sqrt(scatteringAngles.reduce((s,a)=>s+a*a,0)/scatCount):0;
  const scatRatio=scatCount>0?(scatCount/(emitCount*nParticles)*100).toFixed(1):'—';
  const crossSec=zTarg*2>0?((zTarg*2*1.44/(4*beamEnergy))**2):0;
  const impactParamMin=0.5;const impactParamMax=impactSpread;
  const disp=[
    {k:'E_α',v:beamEnergy.toFixed(1)+' MeV'},{k:'Z_targ',v:zTarg},{k:'b(max)',v:impactSpread.toFixed(1)},{k:'active',v:active},{k:'scattered',v:scatCount},{k:'<θ>(°)',v:meanAng.toFixed(1)},{k:'θ_RMS',v:meanSqAng.toFixed(1)},{k:'d_min(fm)',v:dMin.toFixed(2)},{k:'cross-sec',v:crossSec.toExponential(2)},{k:'scat%',v:scatRatio+'%'},{k:'shots',v:emitCount},{k:'σ_rel%',v:scatCount>0?(Math.sqrt(scatCount)/scatCount*100).toFixed(1):'—'},    {k:'n_emit',v:nParticles},{k:'b_min',v:impactParamMin.toFixed(1)},{k:'b_max',v:impactParamMax.toFixed(1)},{k:'θ_max(°)',v:scatCount>0?Math.max(...scatteringAngles.map(Math.abs)).toFixed(1):'—'},{k:'θ_min(°)',v:scatCount>0?Math.min(...scatteringAngles.filter(a=>a>1).map(Math.abs),175).toFixed(1):'—'}
  ];
  for(const kv of disp)html+=`<div class="dbox"><b>${kv.k}</b><br>${kv.v}</div>`;
  dataEl.innerHTML=html;
}
document.getElementById('playBtn').onclick=()=>{paused=!paused;document.getElementById('playBtn').textContent=paused?'▶':'⏸'}
document.getElementById('resetBtn').onclick=reset;
document.getElementById('fireBtn').onclick=()=>{firePending=true};
document.getElementById('speed').oninput=function(){speed=parseFloat(this.value)};
document.getElementById('energy').oninput=function(){beamEnergy=parseFloat(this.value);document.getElementById('energy').nextElementSibling.textContent=beamEnergy.toFixed(1)};
document.getElementById('zTarg').oninput=function(){zTarg=parseInt(this.value)};
document.getElementById('impact').oninput=function(){impactSpread=parseFloat(this.value)};
document.getElementById('nPart').oninput=function(){nParticles=parseInt(this.value)};
fireBeam();
function loop(){step();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
