<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Heisenberg · ΔxΔp ≥ ℏ/2</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{font-size:1.3em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
p{font-size:0.7em;color:#666;margin-bottom:8px}
canvas{border:1px solid #000;display:block}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:6px;max-width:900px}
.ctrl-g{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:3px 8px;border-radius:2px}
.ctrl-g label{font-size:0.6em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-g input[type=range]{width:80px;accent-color:#000}
.ctrl-g .val{font-size:0.65em;color:#000;min-width:24px;text-align:right}
.st{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:5px;font-size:0.65em;color:#666;max-width:900px;justify-content:center}
.st span{white-space:nowrap}
.st .l{color:#999}
.st .v{color:#000;font-weight:700}
button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font-family:'Courier New',monospace;font-size:0.65em;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
button:hover{background:#000;color:#fff}
</style></head><body>
<h1>Heisenberg Uncertainty</h1>
<p>Δx·Δp ≥ ℏ/2 · ψ(x)=e^{−x²/2σ²}/√(σ√π)</p>
<canvas id="c" width="900" height="520"></canvas>
<div class="ctrl" id="ctrl"></div><div class="st" id="st"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=900,H=520;
let sig=0.5,t=0,paused=0,spd=1,hbar=1
let hx=[],hy=[],hxt=[]
function psi(x){const n=1/Math.sqrt(sig*Math.sqrt(Math.PI));return n*Math.exp(-x*x/(2*sig*sig))*Math.cos(2*Math.PI*t)}
function psiM(k){const n=1/Math.sqrt(1/sig*Math.sqrt(Math.PI));return n*Math.exp(-k*k*sig*sig/2)}
function drw(){
ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)
const dx=sig,dp=hbar/(2*sig),prod=dx*dp
const gX=80,gY=30,gW=500,gH=200
ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(gX,gY,gW,gH)
ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('ψ(x) — position',gX+3,gY+10)
ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(gX,gY+gH/2);ctx.lineTo(gX+gW,gY+gH/2);ctx.stroke()
ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();let fst=1
for(let x=0;x<=gW;x++){const xx=(x-gW/2)*0.04,val=psi(xx),py=gY+gH/2-val*50;fst?ctx.moveTo(gX+x,py):ctx.lineTo(gX+x,py);fst=0}ctx.stroke()
ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.3;ctx.setLineDash([3,3])
const x1=gX+gW/2-sig/0.04,x2=gX+gW/2+sig/0.04
ctx.beginPath();ctx.moveTo(x1,gY);ctx.lineTo(x1,gY+gH);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,gY);ctx.lineTo(x2,gY+gH);ctx.stroke();ctx.setLineDash([])
ctx.fillStyle='#999';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText('Δx',(x1+x2)/2,gY+gH-6)
const mX=80,mY=260,mW=500,mH=200
ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(mX,mY,mW,mH)
ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('|φ(k)|² — momentum',mX+3,mY+10)
ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(mX,mY+mH/2);ctx.lineTo(mX+mW,mY+mH/2);ctx.stroke()
ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();fst=1
for(let x=0;x<=mW;x++){const k=(x-mW/2)*0.05,val=psiM(k)**2,py=mY+mH/2-val*100;fst?ctx.moveTo(mX+x,py):ctx.lineTo(mX+x,py);fst=0}ctx.stroke()
const pSig=1/sig,p1=mX+mW/2-pSig/0.05,p2=mX+mW/2+pSig/0.05
ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.3;ctx.setLineDash([3,3])
ctx.beginPath();ctx.moveTo(p1,mY);ctx.lineTo(p1,mY+mH);ctx.stroke();ctx.beginPath();ctx.moveTo(p2,mY);ctx.lineTo(p2,mY+mH);ctx.stroke();ctx.setLineDash([])
ctx.fillStyle='#999';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText('Δp',(p1+p2)/2,mY+mH-6)
ctx.fillStyle='#111';ctx.font='8px monospace';ctx.textAlign='center'
ctx.fillText(`Δx·Δp = ${dx.toFixed(3)}×${dp.toFixed(3)} = ${prod.toFixed(4)}`,400,485)
ctx.fillStyle='#999';ctx.font='7px monospace';ctx.fillText(`ℏ/2 = ${(hbar/2).toFixed(4)} ${prod>=hbar/2?'✓ SATISFIED':'✗ VIOLATED'}`,400,500)
if(!paused){t+=0.01*spd
if(t<300){hx.push(t);hy.push(prod);hxt.push(dx);if(hx.length>200){hx.shift();hy.shift();hxt.shift()}}}
if(hx.length>1){const mgX=620,mgY=440,mgW=260,mgH=60
ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(mgX,mgY,mgW,mgH)
ctx.fillStyle='#999';ctx.font='6px monospace';ctx.textAlign='left';ctx.fillText('Δx·Δp(t)',mgX+2,mgY+8)
ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.8;ctx.beginPath()
const my=Math.max(...hy,0.5);for(let i=0;i<hx.length;i++){const xx=mgX+(hx[i]/hx[hx.length-1]||1)*mgW,yy=mgY+mgH-(hy[i]/my)*mgH*0.7
i===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}ctx.stroke()}
document.getElementById('st').innerHTML=
`<span><span class="l">Δx = σ =</span> <span class="v">${dx.toFixed(3)}</span></span>`+
`<span><span class="l">Δp = ℏ/2σ =</span> <span class="v">${dp.toFixed(3)}</span></span>`+
`<span><span class="l">Δx·Δp =</span> <span class="v">${prod.toFixed(4)}</span></span>`+
`<span><span class="l">ℏ/2 =</span> <span class="v">${(hbar/2).toFixed(4)}</span></span>`+
`<span><span class="l">σ =</span> <span class="v">${sig.toFixed(2)}</span></span>`+
`<span><span class="l">1/σ =</span> <span class="v">${(1/sig).toFixed(2)}</span></span>`+
`<span><span class="l">Min uncert =</span> <span class="v">${Math.abs(prod-hbar/2)<0.001?'✓ yes':'ordinary'}</span></span>`+
`<span><span class="l">∫|ψ|²dx =</span> <span class="v">1</span></span>`+
`<span><span class="l">⟨x⟩ =</span> <span class="v">0</span></span>`+
`<span><span class="l">⟨p⟩ =</span> <span class="v">0</span></span>`+
`<span><span class="l">Wave pkt =</span> <span class="v">Gaussian</span></span>`+
`<span><span class="l">Time evo =</span> <span class="v">oscillating</span></span>`
}
function anim(){drw();requestAnimationFrame(anim)}
if(!document.getElementById('ctrl').querySelector('button')){
document.getElementById('ctrl').innerHTML=
`<div class="ctrl-g"><label>σ (width)</label><input type="range" id="sS" min="0.1" max="1.5" step="0.05" value="${sig}"><span class="val" id="sV">${sig.toFixed(2)}</span></div>`+
`<div class="ctrl-g"><label>SPD</label><input type="range" id="spdS" min="0" max="5" step="0.5" value="${spd}"><span class="val" id="spdV">${spd}x</span></div>`+
`<button id="playB">${paused?'▶ PLAY':'❚❚ PAUSE'}</button><button id="rstB">⟳ RESET</button>`
document.getElementById('sS').oninput=function(){sig=+this.value;document.getElementById('sV').textContent=sig.toFixed(2);hx=[];hy=[];hxt=[];t=0}
document.getElementById('spdS').oninput=function(){spd=+this.value;document.getElementById('spdV').textContent=spd+'x'}
document.getElementById('playB').onclick=function(){paused=!paused;this.textContent=paused?'▶ PLAY':'❚❚ PAUSE'}
document.getElementById('rstB').onclick=function(){t=0;hx=[];hy=[];hxt=[]}
}
anim()
</script></body></html>
