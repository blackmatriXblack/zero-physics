<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Henon Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:60px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Henon Map</h1>
<div class="eq">xₙ₊₁=1−a·xₙ²+yₙ · yₙ₊₁=b·xₙ · Strange Attractor</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>a <input type="range" id="aS" min="50" max="200" value="140"></label>
<label>b <input type="range" id="bS" min="0" max="50" value="30"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let play=1,a=1.4,b=.3,spd=3,t=0,pts=[],px=.1,py=.1,viewCX=0,viewCY=0,viewScale=280;
let hist={x:[],y:[],lyap:[]};
function hen(x,y){return{x:1-a*x*x+y,y:b*x}}
function mapC(wx,wy){return{x:W/2+(wx-viewCX)*viewScale,y:H/2-(wy-viewCY)*viewScale}}
function mapW(cx,cy){return{x:viewCX+(cx-W/2)/viewScale,y:viewCY-(cy-H/2)/viewScale}}
function lyapunov(){let x=.1,y=.1,sum=0,n=0;for(let i=0;i<500;i++){const r=hen(x,y);x=r.x;y=r.y}for(let i=0;i<1000;i++){const r=hen(x,y);const J=[[-2*a*x,1],[b,0]];const eig=Math.sqrt((J[0][0]**2+J[0][1]**2+J[1][0]**2+J[1][1]**2)/4);if(eig>1e-10)sum+=Math.log(eig);x=r.x;y=r.y;n++}return n>0?sum/n:0}
function step(){if(!play)return;for(let i=0;i<spd*200;i++){const r=hen(px,py);px=r.x;py=r.y;if(Math.abs(px)<10&&Math.abs(py)<10){pts.push({x:px,y:py});if(pts.length>80000)pts.shift()}t++}if(t%50===0){hist.x.push(px);hist.y.push(py);hist.lyap.push(lyapunov());if(hist.x.length>100){hist.x.shift();hist.y.shift();hist.lyap.shift()}}}
function drawMini(x,y,w,h,data,color,label){if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<data.length;i++){const px2=x+i*w/data.length,py2=y+h-(data[i]-mn)/rng*h;i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2)}ctx.stroke();ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);ctx.restore()}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
if(pts.length>0){const step2=Math.max(1,Math.floor(pts.length/60000));ctx.fillStyle='#000';for(let i=0;i<pts.length;i+=step2){const p=mapC(pts[i].x,pts[i].y);if(p.x>=0&&p.x<W&&p.y>=0&&p.y<H)ctx.fillRect(p.x,p.y,1,1)}}
const o=mapC(0,0);ctx.strokeStyle='#ccc';ctx.lineWidth=.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(o.x,0);ctx.lineTo(o.x,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,o.y);ctx.lineTo(W,o.y);ctx.stroke();ctx.setLineDash([]);
const ly=hist.lyap.length>0?hist.lyap[hist.lyap.length-1]:0;
ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('a='+a.toFixed(2)+' b='+b.toFixed(2)+' pts='+pts.length.toLocaleString()+' λ≈'+ly.toFixed(3),8,14);
const barU=Math.pow(10,Math.round(Math.log10(1/viewScale*50))),barP=barU*viewScale;
if(barP>20&&barP<W/2){ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,H-18);ctx.lineTo(20+barP,H-18);ctx.stroke();ctx.fillStyle='#666';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText(barU.toExponential(0),22,H-22)}
drawMini(5,H-90,130,45,hist.x,'rgba(0,0,0,.7)','xₙ');drawMini(W-135,H-90,130,45,hist.lyap,'rgba(0,0,0,.5)','λ');
const mxX=pts.length>0?Math.max(...pts.map(p=>Math.abs(p.x))):0,mxY=pts.length>0?Math.max(...pts.map(p=>Math.abs(p.y))):0;
const mnX=pts.length>0?pts.reduce((s,p)=>s+p.x,0)/pts.length:0,mnY=pts.length>0?pts.reduce((s,p)=>s+p.y,0)/pts.length:0;
const dim=pts.length>100?2*ly/(Math.log(2)||1):0;
let h='';const fields=[['a',a.toFixed(3)],['b',b.toFixed(3)],['xₙ',px.toFixed(4)],['yₙ',py.toFixed(4)],['λ (Lyapunov)',ly.toFixed(4)],['pts',pts.length.toLocaleString()],['max|x|',mxX.toFixed(4)],['max|y|',mxY.toFixed(4)],['<x>',mnX.toFixed(4)],['<y>',mnY.toFixed(4)],['D (corr dim)',dim.toFixed(2)],['iter',t],['a·b',(a*b).toFixed(4)],['det(J)',(-b*2*a*px).toFixed(4)]];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=()=>{t=0;px=.1;py=.1;pts=[];hist={x:[],y:[],lyap:[]};viewCX=0;viewCY=0;viewScale=280}
document.getElementById('aS').oninput=e=>{a=e.value/100;document.getElementById('aS').previousSibling.textContent=a.toFixed(2);t=0;px=.1;py=.1;pts=[];hist={x:[],y:[],lyap:[]}}
document.getElementById('bS').oninput=e=>{b=e.value/100;document.getElementById('bS').previousSibling.textContent=b.toFixed(2);t=0;px=.1;py=.1;pts=[];hist={x:[],y:[],lyap:[]}}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
c.onwheel=e=>{e.preventDefault();const rect=c.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;const w=mapW(mx,my);viewScale=Math.max(10,Math.min(50000,viewScale*(e.deltaY>0?.85:1.18)));viewCX=w.x;viewCY=w.y}
let drag=0,dsx,dsy,dCX,dCY;
c.onmousedown=e=>{if(e.button===0){drag=1;dsx=e.clientX;dsy=e.clientY;dCX=viewCX;dCY=viewCY}}
window.onmousemove=e=>{if(drag){const rect=c.getBoundingClientRect();viewCX=dCX-(e.clientX-dsx)/viewScale;viewCY=dCY+(e.clientY-dsy)/viewScale}}
window.onmouseup=()=>{drag=0}
loop();
</script>
</body>
</html>
