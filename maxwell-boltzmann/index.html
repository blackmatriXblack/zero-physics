<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxwell–Boltzmann · f(v) ∝ v² exp(−mv²/2kT)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:1.2em;font-weight:900;text-transform:uppercase;letter-spacing:2px}
p{font-size:0.7em;color:#666;margin-bottom:6px}
canvas{border:1px solid #000;display:block}
.c{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;margin:5px 0;max-width:940px}
.cg{display:flex;align-items:center;gap:3px;background:#fafafa;border:1px solid #eee;padding:2px 7px;border-radius:2px}
.cg label{font-size:0.55em;color:#666;text-transform:uppercase;letter-spacing:1px}
.cg input[type=range]{width:60px;accent-color:#000;height:14px}
.cg .v{font-size:0.6em;color:#000;min-width:22px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:2px 8px;font:0.6em 'Courier New',monospace;cursor:pointer;text-transform:uppercase;transition:all .15s}
button:hover{background:#000;color:#fff}
.s{display:flex;flex-wrap:wrap;gap:2px 12px;margin:3px 0;font-size:0.6em;color:#666;max-width:940px;justify-content:center}
.s sp{white-space:nowrap}
.s .l{color:#999}
.s .vl{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Maxwell–Boltzmann</h1>
<p>f(v) = 4π (m/2πkT)^(3/2) v² exp(−mv²/2kT)</p>
<canvas id="c" width="940" height="480"></canvas>
<div class="c" id="ctrl"></div><div class="s" id="st"></div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),W=940,H=480;
const kB=1.381e-23,amu=1.66e-27;
let T=300,m=28,paused=0,speed=1;
const HL=100;
let hs={vmp:[],vavg:[],vrms:[],KE:[]};
function MB(v,T,m){const M=m*amu;return 4*Math.PI*Math.pow(M/(2*Math.PI*kB*T),1.5)*v*v*Math.exp(-M*v*v/(2*kB*T))}
let parts=[];
for(let i=0;i<180;i++)parts.push({v:100+Math.random()*800,x:Math.random()*160+540,y:20+Math.random()*250,dir:Math.random()<.5?1:-1});
function reset(){T=300;m=28;paused=0;speed=1;for(let k in hs)hs[k]=[];for(let p of parts){p.v=100+Math.random()*800;p.x=Math.random()*160+540;p.y=20+Math.random()*250;p.dir=Math.random()<.5?1:-1}}
const M_=m=>m*amu;
function step(){if(paused)return;const M=M_(m);const vmp=Math.sqrt(2*kB*T/M);const norm=MB(vmp,T,m);
for(let _=0;_<speed;_++){for(let p of parts){p.v+=200*(MB(p.v,T,m)/norm-.3)*.02;p.v=Math.max(50,Math.min(2500,p.v));p.x+=p.dir*p.v*.002;if(p.x>720||p.x<540)p.dir*=-1;}}
const vavg=Math.sqrt(8*kB*T/(Math.PI*M)),vrms=Math.sqrt(3*kB*T/M),KE=1.5*kB*T;
hs.vmp.push(vmp);hs.vavg.push(vavg);hs.vrms.push(vrms);hs.KE.push(KE);
for(let k in hs)if(hs[k].length>HL)hs[k].shift();}
function draw(){
x.fillStyle='#fff';x.fillRect(0,0,W,H);
const M=M_(m),vMax=Math.sqrt(8*kB*T/(Math.PI*M))*4;
const gX=60,gY=20,gW=470,gH=230;
x.strokeStyle='#ddd';x.lineWidth=.5;x.strokeRect(gX,gY,gW,gH);
x.fillStyle='#999';x.font='7px monospace';x.textAlign='left';x.fillText('f(v) — probability density',gX+3,gY+8);
x.textAlign='center';x.fillText('v (m/s)',gX+gW/2,gY+gH+12);
x.save();x.translate(gX-14,gY+gH/2);x.rotate(-Math.PI/2);x.fillText('f(v)',0,0);x.restore();
const vmp=Math.sqrt(2*kB*T/M),vavg=Math.sqrt(8*kB*T/(Math.PI*M)),vrms=Math.sqrt(3*kB*T/M);
let maxF=0;for(let x0=0;x0<=gW;x0++){const f=MB((x0/gW)*vMax,T,m);if(f>maxF)maxF=f;}
const norm=MB(vmp,T,m)*1.15;
x.strokeStyle='#111';x.lineWidth=1.3;x.beginPath();let fi=true;
for(let x0=0;x0<=gW;x0++){const v=(x0/gW)*vMax,f=MB(v,T,m),py=gY+gH-f/norm*(gH-16);fi?x.moveTo(gX+x0,py):x.lineTo(gX+x0,py);fi=false;}
x.stroke();
const spd=[{v:vmp,l:'v_mp',c:'rgba(0,0,0,0.08)'},{v:vavg,l:'v_avg',c:'rgba(0,0,0,0.13)'},{v:vrms,l:'v_rms',c:'rgba(0,0,0,0.18)'}];
for(let s of spd){const px=gX+(s.v/vMax)*gW;x.strokeStyle=s.c;x.lineWidth=.5;x.setLineDash([3,3]);
x.beginPath();x.moveTo(px,gY);x.lineTo(px,gY+gH);x.stroke();x.setLineDash([]);
x.fillStyle='#999';x.font='5px monospace';x.textAlign='center';x.fillText(s.l+'='+s.v.toFixed(0),px,gY+gH-3);}
x.fillStyle='rgba(0,0,0,0.02)';x.font='6px monospace';x.textAlign='left';
x.fillText('T='+T+'K M='+m+'amu',gX+4,gY+gH-16);
// History mini-graph (top right)
const mgX=550,mgY=20,mgW=350,mgH=85;
x.strokeStyle='#ddd';x.lineWidth=.5;x.strokeRect(mgX,mgY,mgW,mgH);
x.fillStyle='#999';x.font='6px monospace';x.textAlign='left';x.fillText('Speed history (past '+HL+' frames)',mgX+3,mgY+8);
for(let ki=0;ki<3;ki++){const k=['vmp','vavg','vrms'][ki];const arr=hs[k];if(arr.length<2)continue;
x.strokeStyle=['rgba(0,0,0,0.08)','rgba(0,0,0,0.18)','rgba(0,0,0,0.3)'][ki];x.lineWidth=.7;x.beginPath();let fi2=true;
const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1;
for(let i=0;i<arr.length;i++){const px=mgX+i*mgW/HL,py=mgY+mgH-3-(arr[i]-mn)/rg*(mgH-6);fi2?x.moveTo(px,py):x.lineTo(px,py);fi2=false;}
x.stroke();}
// Histogram of particle speeds
const hX=gX,hY=gY+gH+18,hW=gW,hH=50;
x.strokeStyle='#eee';x.lineWidth=.5;x.strokeRect(hX,hY,hW,hH);
x.fillStyle='#999';x.font='5px monospace';x.textAlign='left';x.fillText('Particle speed distribution',hX+3,hY+8);
const bins=25,bw=hW/bins,cts=new Array(bins).fill(0);
for(let p of parts){const bi=Math.min(bins-1,Math.floor(p.v/(vMax*1.2)*bins));cts[bi]++;}
const mxc=Math.max(...cts,1);
for(let i=0;i<bins;i++){const bh=cts[i]/mxc*(hH-10);x.fillStyle='rgba(0,0,0,0.07)';x.fillRect(hX+i*bw,hY+hH-3-bh,bw-1,bh);}
// Stats display
const KE=1.5*kB*T;
x.fillStyle='#999';x.font='6px monospace';x.textAlign='left';
x.fillText('⟨KE⟩='+(KE/1.602e-19).toFixed(3)+'eV  v_mp='+vmp.toFixed(1)+' v_avg='+vavg.toFixed(1)+' v_rms='+vrms.toFixed(1),550,130);
x.fillText('Gas: '+(m<=4?'He/H₂':m<=14?'N':m<=28?'N₂':m<=32?'O₂':m<=44?'CO₂':'heavy')+'  N='+parts.length,550,144);
// Particle box
const bx=550,by=155,bw2=170,bh2=140;
x.strokeStyle='rgba(0,0,0,0.08)';x.lineWidth=.3;x.strokeRect(bx,by,bw2,bh2);
x.fillStyle='#999';x.font='5px monospace';x.textAlign='center';x.fillText('Particle box',bx+bw2/2,by-2);
for(let p of parts){const px=bx+5+(p.x-540)/180*(bw2-10),py=by+5+(p.y-20)/250*(bh2-10);x.fillStyle='rgba(0,0,0,0.12)';x.beginPath();x.arc(px,py,1.5,0,Math.PI*2);x.fill();}
// Cycle sliders
if(!document.getElementById('ctrl').querySelector('button')){
document.getElementById('ctrl').innerHTML=
`<div class="cg"><label>T</label><input type="range" id="tS" min="100" max="2000" step="10" value="${T}"><span class="v" id="tV">${T}</span></div>`+
`<div class="cg"><label>M</label><input type="range" id="mS" min="2" max="200" step="2" value="${m}"><span class="v" id="mV">${m}</span></div>`+
`<div class="cg"><label>Speed</label><input type="range" id="spS" min="1" max="10" step="1" value="${speed}"><span class="v" id="spV">${speed}</span></div>`+
`<button id="ppBtn">⏸</button><button id="rsBtn">↺</button>`;
document.getElementById('tS').oninput=function(){T=+this.value;document.getElementById('tV').textContent=T;};
document.getElementById('mS').oninput=function(){m=+this.value;document.getElementById('mV').textContent=m;};
document.getElementById('spS').oninput=function(){speed=+this.value;document.getElementById('spV').textContent=speed;};
document.getElementById('ppBtn').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
document.getElementById('rsBtn').onclick=reset;
}
const fmp=MB(vmp,T,m);
document.getElementById('st').innerHTML=
`<sp><span class="l">T =</span> <span class="vl">${T}</span> K</sp>`+
`<sp><span class="l">M =</span> <span class="vl">${m}</span> amu</sp>`+
`<sp><span class="l">v_mp =</span> <span class="vl">${vmp.toFixed(1)}</span></sp>`+
`<sp><span class="l">v_avg =</span> <span class="vl">${vavg.toFixed(1)}</span></sp>`+
`<sp><span class="l">v_rms =</span> <span class="vl">${vrms.toFixed(1)}</span></sp>`+
`<sp><span class="l">v_rms/v_mp =</span> <span class="vl">${(vrms/vmp).toFixed(3)}</span></sp>`+
`<sp><span class="l">⟨KE⟩ =</span> <span class="vl">${(KE/1.602e-19).toFixed(3)}</span> eV</sp>`+
`<sp><span class="l">KE (J) =</span> <span class="vl">${KE.toExponential(3)}</span> J</sp>`+
`<sp><span class="l">f(v_mp) =</span> <span class="vl">${fmp.toExponential(3)}</span></sp>`+
`<sp><span class="l">v_max =</span> <span class="vl">${vMax.toFixed(0)}</span> m/s</sp>`+
`<sp><span class="l">Gas</span> <span class="vl">${m<=4?'He/H₂':m<=14?'N':m<=28?'N₂':m<=32?'O₂':m<=44?'CO₂':'heavy'}</span></sp>`+
`<sp><span class="l">N =</span> <span class="vl">${parts.length}</span></sp>`+
`<sp><span class="l">Mode =</span> <span class="vl">${vmp.toFixed(1)}</span> m/s</sp>`;
}
reset();
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
