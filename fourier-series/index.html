<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fourier Series · f(t) = Σ aₙ sin(nωt) + bₙ cos(nωt)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{font-size:1.3em;font-weight:900;text-transform:uppercase;letter-spacing:2px}
p{font-size:0.7em;color:#666;margin-bottom:6px}
canvas{border:1px solid #000;display:block}
.controls{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;margin:4px 0;max-width:920px}
.ctrl-group{display:flex;align-items:center;gap:2px;background:#fafafa;border:1px solid #eee;padding:2px 7px;border-radius:2px}
.ctrl-group label{font-size:0.55em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-group input[type=range]{width:55px;accent-color:#000;height:10px}
.ctrl-group .val{font-size:0.6em;color:#000;min-width:20px;text-align:right}
select{font-family:'Courier New',monospace;font-size:0.6em;border:1px solid #ddd;background:#fff;padding:1px 3px}
button{background:#fff;border:1px solid #000;color:#000;padding:2px 9px;font-family:'Courier New',monospace;font-size:0.6em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .12s}
button:hover{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:0.6em;color:#666;max-width:920px;justify-content:center}
.stats span{white-space:nowrap}
.stats .label{color:#999}
.stats .val{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Fourier Series</h1>
<p>f(t) = Σ aₙ sin(nωt) + bₙ cos(nωt) — Harmonic decomposition</p>
<canvas id="c" width="920" height="520"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),W=920,H=520;
let N=3,freq=1,time=0,paused=false,speed=1,waveType='square';
const errH=[],nH=[],tH=[],ampH=[];
const maxH=200;
function coef(n,type){
 if(type==='square')return n%2===0?0:4/(n*Math.PI);
 if(type==='sawtooth')return 2*((-1)**(n+1))/(n*Math.PI);
 if(type==='triangle'){if(n%2===0)return 0;return 8*((-1)**((n-1)/2))/(Math.PI*Math.PI*n*n);}
 return 0;
}
function fSeries(t,N,type){
 let sum=0;const w=2*Math.PI*freq;
 for(let n=1;n<=N;n++){const a=coef(n,type);if(a!==0)sum+=a*Math.sin(n*w*t);}
 return sum;
}
function target(t,type){
 const w=2*Math.PI*freq*t;
 if(type==='square')return Math.sin(w)>0?1:-1;
 if(type==='sawtooth')return 2*(w/(2*Math.PI)-Math.floor(w/(2*Math.PI)+0.5));
 if(type==='triangle'){const x=w/(2*Math.PI)-Math.floor(w/(2*Math.PI)+0.5);return 2*(0.5-4*(x*x));}
 return 0;
}
function step(){
 if(paused)return;
 for(let s=0;s<speed;s++){
  time+=0.008;
  let err=0;for(let i=0;i<50;i++){const tt=time+(i/50)*2/freq;err+=Math.abs(target(tt,waveType)-fSeries(tt,N,waveType));}err/=50;
  if(errH.length>maxH){errH.shift();nH.shift();tH.shift();}
  errH.push(err);nH.push(N);tH.push(time);
  let sumA=0;for(let n=1;n<=20;n++)sumA+=Math.abs(coef(n,waveType));
  ampH.push(sumA);if(ampH.length>maxH)ampH.shift();
 }
}
function draw(){
 cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
 const gX=45,gY=25,gW=560,gH=280;
 cx.strokeStyle='#ddd';cx.lineWidth=0.5;cx.strokeRect(gX,gY,gW,gH);
 cx.fillStyle='#999';cx.font='7px monospace';cx.fillText('f(t) = Σ aₙ sin(nωt) — '+waveType+' wave',gX+3,gY+10);
 cx.strokeStyle='rgba(0,0,0,0.08)';cx.lineWidth=0.5;
 cx.beginPath();cx.moveTo(gX,gY+gH/2);cx.lineTo(gX+gW,gY+gH/2);cx.stroke();
 // Target (dashed)
 cx.strokeStyle='rgba(0,0,0,0.1)';cx.lineWidth=0.3;cx.setLineDash([3,3]);cx.beginPath();
 for(let x=0;x<=gW;x++){const t=(x/gW)*4/freq;const val=target(t,waveType);const py=gY+gH/2-val*(gH/2-20)/2;x===0?cx.moveTo(gX+x,py):cx.lineTo(gX+x,py);}cx.stroke();cx.setLineDash([]);
 // Fourier approximation
 cx.strokeStyle='#111';cx.lineWidth=1.2;cx.beginPath();
 for(let x=0;x<=gW;x++){const t=(x/gW)*4/freq;const val=fSeries(t,N,waveType);const py=gY+gH/2-val*(gH/2-20)/2;x===0?cx.moveTo(gX+x,py):cx.lineTo(gX+x,py);}cx.stroke();
 // Partial sums overlay (lighter)
 for(let k=1;k<N;k+=Math.max(1,Math.floor(N/3))){
  cx.strokeStyle='rgba(0,0,0,0.08)';cx.lineWidth=0.3;cx.beginPath();
  for(let x=0;x<=gW;x++){const t=(x/gW)*4/freq;const val=fSeries(t,k,waveType);const py=gY+gH/2-val*(gH/2-20)/2;x===0?cx.moveTo(gX+x,py):cx.lineTo(gX+x,py);}cx.stroke();
 }
 // Spectrum
 const spX=620,spY=25,spW=130,spH=280;
 cx.strokeStyle='#ddd';cx.strokeRect(spX,spY,spW,spH);
 cx.fillStyle='#999';cx.font='6px monospace';cx.fillText('Spectrum |aₙ|',spX+3,spY+10);
 const maxN=20,barW=spW/(maxN+1);let maxA=0;
 for(let n=1;n<=maxN;n++)maxA=Math.max(maxA,Math.abs(coef(n,waveType)));
 for(let n=1;n<=maxN;n++){const a=Math.abs(coef(n,waveType));const h=a/maxA*(spH-30);cx.fillStyle=n<=N?'#111':'rgba(0,0,0,0.07)';cx.fillRect(spX+n*barW,spY+spH-15-h,barW-1,Math.max(0,h));}
 cx.fillStyle='#999';cx.font='4px monospace';for(let n=1;n<=maxN;n+=2){cx.fillText(n,spX+(n+0.5)*barW,spY+spH-3);}
 // Right mini-graphs
 const mgX=765,mgW=145,mgH=54,mgG=3;
 // 1: Error convergence
 const mgY1=25;
 cx.strokeStyle='#ddd';cx.strokeRect(mgX,mgY1,mgW,mgH);
 cx.fillStyle='#999';cx.font='5px monospace';cx.fillText('RMS Error vs N',mgX+2,mgY1+8);
 if(errH.length>2){const me=Math.max(...errH)||1;cx.strokeStyle='#111';cx.lineWidth=0.5;cx.beginPath();for(let i=0;i<errH.length;i++){const x=mgX+(i/errH.length)*mgW,y=mgY1+mgH-4-(errH[i]/me)*(mgH-10);i===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();}
 // 2: Coefficient decay
 const mgY2=mgY1+mgH+mgG;
 cx.strokeStyle='#ddd';cx.strokeRect(mgX,mgY2,mgW,mgH);
 cx.fillStyle='#999';cx.font='5px monospace';cx.fillText('|aₙ| decay (log)',mgX+2,mgY2+8);
 for(let n=1;n<=15;n++){const a=Math.abs(coef(n,waveType));if(a>0){const h=Math.min(mgH-16,a/maxA*(mgH-16));cx.fillStyle=n<=N?'#111':'rgba(0,0,0,0.1)';cx.fillRect(mgX+n*(mgW/16),mgY2+mgH-6-h,mgW/16-1,Math.max(0.5,h));}}
 // 3: Phase plot (f(t) vs f'(t))
 const mgY3=mgY2+mgH+mgG;
 cx.strokeStyle='#ddd';cx.strokeRect(mgX,mgY3,mgW,mgH);
 cx.fillStyle='#999';cx.font='5px monospace';cx.fillText('Phase: f(t) vs f\'(t)',mgX+2,mgY3+8);
 const dt=0.005;const ft=fSeries(time,N,waveType);const ft2=fSeries(time+dt,N,waveType);const deriv=(ft2-ft)/dt;
 const scale=1.5;cx.fillStyle='#111';cx.beginPath();cx.arc(mgX+mgW/2+ft*scale*8,mgY3+mgH/2-deriv*scale*2,3,0,7);cx.fill();
 // 4: Harmonic energy
 const mgY4=mgY3+mgH+mgG;
 cx.strokeStyle='#ddd';cx.strokeRect(mgX,mgY4,mgW,mgH);
 cx.fillStyle='#999';cx.font='5px monospace';cx.fillText('Harmonic energy Σ|aₙ|²',mgX+2,mgY4+8);
 let harmE=0;for(let n=1;n<=N;n++){const a=Math.abs(coef(n,waveType));harmE+=a*a;}
 const hEhist=ampH;if(hEhist.length>2){const maxHE=Math.max(...hEhist.map(a=>a*a))||1;cx.strokeStyle='#111';cx.lineWidth=0.5;cx.beginPath();for(let i=0;i<hEhist.length;i++){const x=mgX+(i/hEhist.length)*mgW,y=mgY4+mgH-4-(hEhist[i]*hEhist[i]/maxHE)*(mgH-10);i===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();}
 // Current values
 const curF=fSeries(time,N,waveType),curT=target(time,waveType);
 const errR=Math.abs(curT-curF);let sumA=0;
 for(let n=1;n<=N;n++)sumA+=Math.abs(coef(n,waveType));
if(!document.getElementById('controls').querySelector('button')){
 document.getElementById('controls').innerHTML=
  `<div class="ctrl-group"><label>N</label><input type="range" id="nS" min="1" max="25" step="1" value="${N}"><span class="val" id="nV">${N}</span></div>`+
  `<div class="ctrl-group"><label>f</label><input type="range" id="fS" min="0.3" max="5" step="0.1" value="${freq}"><span class="val" id="fV">${freq.toFixed(1)}</span></div>`+
  `<div class="ctrl-group"><label>Speed×</label><input type="range" id="spS" min="1" max="5" step="1" value="${speed}"><span class="val" id="spV">${speed}</span></div>`+
  `<select id="wS"><option value="square" ${waveType==='square'?'selected':''}>Square</option><option value="sawtooth" ${waveType==='sawtooth'?'selected':''}>Sawtooth</option><option value="triangle" ${waveType==='triangle'?'selected':''}>Triangle</option></select>`+
  `<button id="pauseBtn">${paused?'Play':'Pause'}</button><button id="resetBtn">Reset</button>`;
 document.getElementById('nS').oninput=function(){N=+this.value;document.getElementById('nV').textContent=N;};
 document.getElementById('fS').oninput=function(){freq=+this.value;document.getElementById('fV').textContent=freq.toFixed(1);};
 document.getElementById('spS').oninput=function(){speed=+this.value;document.getElementById('spV').textContent=speed;};
 document.getElementById('wS').onchange=function(){waveType=this.value;};
 document.getElementById('pauseBtn').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause';};
 document.getElementById('resetBtn').onclick=function(){time=0;errH.length=0;nH.length=0;tH.length=0;ampH.length=0;paused=false;document.getElementById('pauseBtn').textContent='Pause';};
}
 document.getElementById('stats').innerHTML=
  `<span><span class="label">N</span><span class="val">${N}</span></span>`+
  `<span><span class="label">f</span><span class="val">${freq.toFixed(1)}</span>Hz</span>`+
  `<span><span class="label">ω</span><span class="val">${(2*Math.PI*freq).toFixed(2)}</span>rad/s</span>`+
  `<span><span class="label">T</span><span class="val">${(1/freq).toFixed(2)}</span>s</span>`+
  `<span><span class="label">Type</span><span class="val">${waveType}</span></span>`+
  `<span><span class="label">f(t)</span><span class="val">${curF.toFixed(4)}</span></span>`+
  `<span><span class="label">Target</span><span class="val">${curT.toFixed(4)}</span></span>`+
  `<span><span class="label">Error</span><span class="val">${errR.toFixed(4)}</span></span>`+
  `<span><span class="label">RMS err</span><span class="val">${(errH[errH.length-1]||0).toFixed(4)}</span></span>`+
  `<span><span class="label">a₁</span><span class="val">${coef(1,waveType).toFixed(4)}</span></span>`+
  `<span><span class="label">a₃</span><span class="val">${coef(3,waveType).toFixed(4)}</span></span>`+
  `<span><span class="label">a₅</span><span class="val">${coef(5,waveType).toFixed(4)}</span></span>`+
  `<span><span class="label">Σ|aₙ|</span><span class="val">${sumA.toFixed(4)}</span></span>`+
  `<span><span class="label">t</span><span class="val">${time.toFixed(2)}s</span></span>`;
}
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
