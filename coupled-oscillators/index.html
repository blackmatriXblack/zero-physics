<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupled Oscillators · Normal Modes</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}p{font-size:0.75em;color:#666;margin-bottom:10px}canvas{border:1px solid #000;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;max-width:900px}.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:4px 10px;border-radius:2px}.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}.ctrl-group input[type=range]{width:70px;accent-color:#000}.ctrl-group .val{font-size:0.7em;color:#000;min-width:24px;text-align:right}button{background:#fff;border:1px solid #000;color:#000;padding:4px 12px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}button:hover{background:#000;color:#fff}.stats{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px;font-size:0.65em;color:#666;max-width:900px;justify-content:center}.stats span{white-space:nowrap}.stats .label{color:#999}.stats .val{color:#000;font-weight:700}</style>
</head>
<body>
<h1>Coupled Oscillators</h1>
<p>mẍᵢ + kxᵢ + kc(2xᵢ−xᵢ₋₁−xᵢ₊₁) = 0 — Normal modes & beats</p>
<canvas id="c" width="900" height="500"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const N=5;
let k=1.5,kc=0.6,m=1.0;
const x=new Float64Array(N),v=new Float64Array(N);
const dt=0.015;let t=0;let paused=false,speed=1;
const trails=Array.from({length:N},()=>[]);
const maxTrail=800;

function initMode(mode){
  for(let i=0;i<N;i++){x[i]=0;v[i]=0;}
  if(mode===0){for(let i=0;i<N;i++)x[i]=Math.sin((i+1)*Math.PI/(N+1));} // 1st mode
  else if(mode===1){for(let i=0;i<N;i++)x[i]=Math.sin(2*(i+1)*Math.PI/(N+1));} // 2nd
  else if(mode===2){for(let i=0;i<N;i++)x[i]=Math.sin(3*(i+1)*Math.PI/(N+1));} // 3rd
  else if(mode===3){for(let i=0;i<N;i++)x[i]=(i+1)%2===0?0.5:-0.5;} // mixed
  else{for(let i=0;i<N;i++){x[i]=(i-2)*0.4;v[i]=0;}} // pluck
  for(let i=0;i<N;i++)trails[i]=[];
  t=0;
}
initMode(3);
let currentMode=3;
const modeNames=['Mode 1 (fund.)','Mode 2 (1st overtone)','Mode 3 (2nd overtone)','Mixed','Pluck'];

function step(){
  if(paused)return;
  for(let s=0;s<speed;s++){
    const a=new Float64Array(N);
    for(let i=0;i<N;i++){let force=-k*x[i];if(i>0)force+=kc*(x[i-1]-x[i]);if(i<N-1)force+=kc*(x[i+1]-x[i]);a[i]=force/m;}
    for(let i=0;i<N;i++){v[i]+=a[i]*dt*0.5;x[i]+=v[i]*dt;}
    for(let i=0;i<N;i++){let force=-k*x[i];if(i>0)force+=kc*(x[i-1]-x[i]);if(i<N-1)force+=kc*(x[i+1]-x[i]);v[i]+=force/m*dt*0.5;}
    t+=dt;
    for(let i=0;i<N;i++){trails[i].push({t,val:x[i]});if(trails[i].length>maxTrail)trails[i].shift();}
  }
}

function resetSim(){
  initMode(currentMode);paused=false;
  document.getElementById('pauseBtn').textContent='Pause';
}

// Normal mode frequencies
function normalModeFreq(n){return Math.sqrt((k+2*kc*Math.sin(n*Math.PI/(2*(N+1)))**2)/m);}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  // Mechanical view
  const mcx=360,mcy=380,spacing=65;
  const sx=mcx-(N-1)*spacing/2;

  // Walls
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=-4;i<=4;i++){ctx.moveTo(sx-spacing-16,mcy+i*5);ctx.lineTo(sx-spacing-4,mcy+i*5);}
  ctx.stroke();
  ctx.beginPath();
  for(let i=-4;i<=4;i++){ctx.moveTo(sx+N*spacing+4,mcy+i*5);ctx.lineTo(sx+N*spacing+16,mcy+i*5);}
  ctx.stroke();

  for(let i=0;i<N;i++){
    const bx=sx+i*spacing;
    const lx=i===0?sx-spacing:bx-spacing+28;
    ctx.beginPath();ctx.moveTo(lx,mcy);
    const segs=i===0?6:4;
    const segLen=(bx+x[i]*22-14-lx)/Math.max(1,segs);
    for(let s=1;s<=segs;s++){const rt=s/segs;const px_=lx+rt*(bx+x[i]*22-14-lx);const py_=mcy+(s%2===0?1:-1)*Math.min(6,Math.max(3,segLen*0.5));ctx.lineTo(px_,py_);}
    ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.stroke();

    // Mass
    const grad=ctx.createLinearGradient(bx+x[i]*22-16,mcy-16,bx+x[i]*22+4,mcy+4);
    grad.addColorStop(0,'#333');grad.addColorStop(1,'#000');
    ctx.fillStyle=grad;
    ctx.fillRect(bx+x[i]*22-16,mcy-16,32,32);
    ctx.strokeStyle='#fff';ctx.lineWidth=0.5;ctx.strokeRect(bx+x[i]*22-16,mcy-16,32,32);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.font='7px monospace';ctx.textAlign='center';
    ctx.fillText('m'+(i+1),bx+x[i]*22,mcy+32);

    if(i<N-1){
      ctx.beginPath();ctx.moveTo(bx+x[i]*22+16,mcy);
      const ex=bx+spacing+x[i+1]*22-16;
      const cSegs=4;
      const cLen=(ex-bx-x[i]*22-16)/Math.max(1,cSegs);
      for(let s=1;s<=cSegs;s++){const rt=s/cSegs;const px_=bx+x[i]*22+16+rt*(ex-bx-x[i]*22-16);const py_=mcy+(s%2===0?1:-1)*Math.min(6,Math.max(3,cLen*0.5));ctx.lineTo(px_,py_);}
      ctx.stroke();
    }
  }

  // Time series
  const gx=20,gy=30,gw=450,gh=300;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='#111';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText('DISPLACEMENT xᵢ(t)',gx+4,gy+12);
  const tMin=Math.max(0,t-25);
  for(let i=0;i<N;i++){
    const h=trails[i];if(h.length<2)continue;
    const offset=gy+gh*0.08+i*gh/N;
    ctx.beginPath();
    for(let j=0;j<h.length;j++){const sx=gx+(h[j].t-tMin)/25*gw;const sy=offset-h[j].val*25;j===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}
    ctx.strokeStyle=`rgba(0,0,0,${0.1+0.18*i})`;ctx.lineWidth=0.4+0.1*i;ctx.stroke();
    ctx.fillStyle=`rgba(0,0,0,${0.2+0.3*i})`;ctx.font='6px monospace';ctx.fillText('m'+(i+1),gx+3,offset-2);
  }

  // Energy display
  let KE=0,PE=0;
  for(let i=0;i<N;i++){KE+=0.5*m*v[i]*v[i];PE+=0.5*k*x[i]*x[i];}
  for(let i=0;i<N-1;i++)PE+=0.5*kc*(x[i+1]-x[i])*(x[i+1]-x[i]);

  // Normal mode frequencies
  let freqStr='';
  for(let n=1;n<=N;n++){freqStr+=`ω${n}=${normalModeFreq(n).toFixed(2)} `;}

if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>k</label><input type="range" id="kS" min="0.2" max="5" step="0.1" value="${k}"><span class="val" id="kV">${k.toFixed(1)}</span></div>`+
    `<div class="ctrl-group"><label>kc</label><input type="range" id="kcS" min="0.05" max="2" step="0.05" value="${kc}"><span class="val" id="kcV">${kc.toFixed(2)}</span></div>`+
    `<button id="modeBtn">${modeNames[currentMode]}</button>`+
    `<button id="pauseBtn">Pause</button><button id="resetBtn">Reset</button>`+
    `<div class="ctrl-group"><label>Speed</label><input type="range" id="speedS" min="1" max="8" step="1" value="${speed}"><span class="val" id="speedV">${speed}x</span></div>`;

  document.getElementById('kS').addEventListener('input',function(){k=parseFloat(this.value);document.getElementById('kV').textContent=k.toFixed(1);});
  document.getElementById('kcS').addEventListener('input',function(){kc=parseFloat(this.value);document.getElementById('kcV').textContent=kc.toFixed(2);});
  document.getElementById('modeBtn').addEventListener('click',function(){currentMode=(currentMode+1)%5;this.textContent=modeNames[currentMode];initMode(currentMode);});
  document.getElementById('pauseBtn').addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';});
  document.getElementById('resetBtn').addEventListener('click',resetSim);
  document.getElementById('speedS').addEventListener('input',function(){speed=parseInt(this.value);document.getElementById('speedV').textContent=speed+'x';});

}
  document.getElementById('stats').innerHTML=
    `<span><span class="label">KE =</span> <span class="val">${KE.toFixed(3)}</span></span>`+
    `<span><span class="label">PE =</span> <span class="val">${PE.toFixed(3)}</span></span>`+
    `<span><span class="label">E =</span> <span class="val">${(KE+PE).toFixed(3)}</span></span>`+
    `<span><span class="label">t =</span> <span class="val">${t.toFixed(1)}</span></span>`+
    `<span><span class="label">${freqStr}</span></span>`;
}

function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
