<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billiard · Elastic 2D collisions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{font-size:1.3em;font-weight:900;text-transform:uppercase;letter-spacing:2px}
p{font-size:0.7em;color:#666;margin-bottom:6px}.eq{color:#888;font-size:0.65em}
canvas{border:1px solid #000;display:block;cursor:crosshair}
canvas:active{cursor:crosshair}
.c{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:6px 0;max-width:900px}
.cg{display:flex;align-items:center;gap:3px;background:#fafafa;border:1px solid #eee;padding:3px 8px;border-radius:2px}
.cg label{font-size:0.6em;color:#666;text-transform:uppercase;letter-spacing:1px}
.cg input[type=range]{width:70px;accent-color:#000;height:14px}
.cg .v{font-size:0.65em;color:#000;min-width:24px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font-family:'Courier New',monospace;font-size:0.65em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
button:hover{background:#000;color:#fff}
.s{display:flex;flex-wrap:wrap;gap:2px 12px;margin:4px 0;font-size:0.65em;color:#666;max-width:900px;justify-content:center}
.s span{white-space:nowrap}.s .l{color:#999}.s .v{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Billiard Simulation</h1>
<p>Elastic 2D collisions &nbsp;·&nbsp; <span class="eq">p conserved · KE conserved</span></p>
<canvas id="c" width="900" height="460"></canvas>
<div class="c" id="ctrls"></div>
<div class="s" id="stats"></div>
<script>
const ca=document.getElementById('c'),ctx=ca.getContext('2d'),W=900,H=460,R=10,mar=25;
let balls=[],pktd=0,shot=0,mx=0,my=0,aim=0,p=0,st=0,fric=0.988,sm=1;
const pockets=[{x:20,y:20},{x:450,y:8},{x:880,y:20},{x:20,y:440},{x:450,y:452},{x:880,y:440}];
const h={t:[],ke:[],px:[],py:[],nb:[]};
function init(){
  balls=[{x:180,y:230,vx:0,vy:0,r:R,m:1,id:0}];
  const rows=[[270,230],[290,218],[290,242],[310,206],[310,230],[310,254]];
  for(let i=0;i<6;i++)balls.push({x:rows[i][0],y:rows[i][1],vx:0,vy:0,r:R,m:1,id:i+1});
  pktd=0;shot=0;st=0;h.t.length=0;h.ke.length=0;h.px.length=0;h.py.length=0;h.nb.length=0
}
init();
function cl(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
  if(d>a.r+b.r)return;
  const nx=dx/d,ny=dy/d,dvx=a.vx-b.vx,dvy=a.vy-b.vy,dvn=dvx*nx+dvy*ny;
  if(dvn>0)return;
  const j=2*dvn/(a.m+b.m);a.vx-=j*b.m*nx;a.vy-=j*b.m*ny;b.vx+=j*a.m*nx;b.vy+=j*a.m*ny;
  const ov=a.r+b.r-d;a.x-=ov*0.5*nx;a.y-=ov*0.5*ny;b.x+=ov*0.5*nx;b.y+=ov*0.5*ny
}
function stp(){
  if(p)return;
  for(let s=0;s<sm;s++){
    for(let i=0;i<balls.length;i++){const b=balls[i];b.x+=b.vx*0.01;b.y+=b.vy*0.01;b.vx*=fric;b.vy*=fric;if(Math.abs(b.vx)<0.3)b.vx=0;if(Math.abs(b.vy)<0.3)b.vy=0;if(b.x-mar<R){b.x=mar+R;b.vx=-b.vx}if(b.x>W-mar-R){b.x=W-mar-R;b.vx=-b.vx}if(b.y-mar<R){b.y=mar+R;b.vy=-b.vy}if(b.y>H-mar-R){b.y=H-mar-R;b.vy=-b.vy}}
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)cl(balls[i],balls[j]);
    for(let i=balls.length-1;i>=0;i--){const b=balls[i];for(const p of pockets){if(Math.hypot(b.x-p.x,b.y-p.y)<18){balls.splice(i,1);pktd++;break}}}
    let ke=0,px=0,py=0;for(const b of balls){ke+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);px+=b.m*b.vx;py+=b.m*b.vy}
    h.t.push(st);h.ke.push(ke);h.px.push(px);h.py.push(py);h.nb.push(balls.length);
    while(h.t.length>400){h.t.shift();h.ke.shift();h.px.shift();h.py.shift();h.nb.shift()}
    st+=0.01
  }
}
function shoot(pow,ang){if(shot||!balls.length)return;balls[0].vx=Math.cos(ang)*pow;balls[0].vy=Math.sin(ang)*pow;shot=1}
function dr(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.02)';ctx.fillRect(mar,mar,W-2*mar,H-2*mar);
  ctx.strokeStyle='#111';ctx.lineWidth=2.5;ctx.strokeRect(mar,mar,W-2*mar,H-2*mar);
  ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;ctx.strokeRect(mar+15,mar+15,W-2*mar-30,H-2*mar-30);
  for(const p of pockets){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill()}
  if(!shot&&balls.length>0){const cue=balls[0],dx=mx-cue.x,dy=my-cue.y,d=Math.hypot(dx,dy)||1;if(d<200){const pow=Math.min(d*1.5,300);ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(cue.x+dx/d*200,cue.y+dy/d*200);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(cue.x-dx/d*100,cue.y-dy/d*100);ctx.stroke();ctx.fillStyle='rgba(0,0,0,0.15)';ctx.font='8px monospace';ctx.fillText(`power: ${pow.toFixed(0)}`,cue.x+15,cue.y-25)}}
  for(let i=0;i<balls.length;i++){const b=balls[i];const g2=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r+2);g2.addColorStop(0,'#555');g2.addColorStop(1,'#000');ctx.fillStyle=g2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.3;ctx.beginPath();ctx.arc(b.x-2,b.y-2,b.r*0.3,0,Math.PI*2);ctx.stroke();if(b.id===0){ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.35,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='rgba(255,255,255,0.1)';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText(b.id,b.x,b.y+2)}}
  let ke=0,px=0,py=0;for(const b of balls){ke+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);px+=b.m*b.vx;py+=b.m*b.vy}
  const gx=580,gy=15,gw=290,gh=60;
  ctx.strokeStyle='#eee';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.fillText('KE vs time',gx+3,gy+10);
  if(h.ke.length>2){const km=Math.max(...h.ke)*1.1||1;ctx.beginPath();for(let i=0;i<h.ke.length;i++){const px2=gx+(i/h.ke.length)*gw,py2=gy+gh-(h.ke[i]/km)*gh;i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2)}ctx.strokeStyle='#111';ctx.lineWidth=0.7;ctx.stroke()}
  const pgx=580,pgy=85,pgw=290,pgh=50;
  ctx.strokeStyle='#eee';ctx.lineWidth=0.5;ctx.strokeRect(pgx,pgy,pgw,pgh);
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.fillText('momentum (px, py)',pgx+3,pgy+10);
  if(h.px.length>2){const pm=Math.max(...h.px.map(Math.abs),...h.py.map(Math.abs))*1.2||1;ctx.beginPath();for(let i=0;i<h.px.length;i++){const px2=pgx+(i/h.px.length)*pgw,py2=pgy+pgh/2-(h.px[i]/pm)*(pgh/2-4);i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2)}ctx.strokeStyle='#111';ctx.lineWidth=0.6;ctx.stroke();ctx.beginPath();for(let i=0;i<h.py.length;i++){const px2=pgx+(i/h.py.length)*pgw,py2=pgy+pgh/2-(h.py[i]/pm)*(pgh/2-4);i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2)}ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.5;ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([])}
if(!document.getElementById('ctrls').querySelector('button')){
  document.getElementById('ctrls').innerHTML=
    `<div class="cg"><label>Friction</label><input type="range" id="fS" min="0.95" max="1" step="0.001" value="${fric}"><span class="v" id="fV">${fric.toFixed(3)}</span></div>`+
    `<button id="rb">Reset</button><button id="pb">Pause</button>`+
    `<div class="cg"><label>Speed</label><input type="range" id="spS" min="1" max="10" step="1" value="${sm}"><span class="v" id="spV">${sm}x</span></div>`;
  document.getElementById('fS').oninput=function(){fric=+this.value;document.getElementById('fV').textContent=fric.toFixed(3)};
  document.getElementById('rb').onclick=function(){init();document.getElementById('pb').textContent='Pause'};
  document.getElementById('pb').onclick=function(){p=!p;this.textContent=p?'Play':'Pause'};
  document.getElementById('spS').oninput=function(){sm=+this.value;document.getElementById('spV').textContent=sm+'x'};
  ca.onmousedown=function(e){if(shot||!balls.length)return;const r2=ca.getBoundingClientRect(),mx2=e.clientX-r2.left,my2=e.clientY-r2.top;if(Math.hypot(mx2-balls[0].x,my2-balls[0].y)<150)aim=1};
  ca.onmousemove=function(e){const r2=ca.getBoundingClientRect();mx=e.clientX-r2.left;my=e.clientY-r2.top};
  ca.onmouseup=function(e){if(!aim||shot||!balls.length)return;aim=0;const r2=ca.getBoundingClientRect(),mx2=e.clientX-r2.left,my2=e.clientY-r2.top,dx=mx2-balls[0].x,dy=my2-balls[0].y,d=Math.hypot(dx,dy);if(d>10)shoot(Math.min(d*1.5,300),Math.atan2(dy,dx))};
}
  document.getElementById('stats').innerHTML=
    `<span><span class="l">Balls =</span> <span class="v">${balls.length}</span></span>`+
    `<span><span class="l">Pocketed =</span> <span class="v">${pktd}</span></span>`+
    `<span><span class="l">KE =</span> <span class="v">${ke.toFixed(2)}</span></span>`+
    `<span><span class="l">p<sub>x</sub> =</span> <span class="v">${px.toFixed(2)}</span></span>`+
    `<span><span class="l">p<sub>y</sub> =</span> <span class="v">${py.toFixed(2)}</span></span>`+
    `<span><span class="l">|p| =</span> <span class="v">${Math.hypot(px,py).toFixed(2)}</span></span>`+
    `<span><span class="l">#0 v =</span> <span class="v">${balls.length?Math.hypot(balls[0].vx,balls[0].vy).toFixed(2):'—'}</span></span>`+
    `<span><span class="l">State =</span> <span class="v">${shot?balls.length?'MOVING':'DONE':'AIM'}</span></span>`+
    `<span><span class="l">Friction =</span> <span class="v">${fric.toFixed(3)}</span></span>`+
    `<span><span class="l">Shot =</span> <span class="v">${shot?'YES':'NO'}</span></span>`+
    `<span><span class="l">t =</span> <span class="v">${st.toFixed(2)}</span> s</span>`
}
function lp(){stp();dr();requestAnimationFrame(lp)}
lp();
</script>
</body>
</html>
