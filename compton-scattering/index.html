<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compton Scattering · Δλ = h/(mₑc)(1−cos θ)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
p{font-size:0.7em;color:#666;margin:5px 0 10px;text-align:center;max-width:920px;line-height:1.5}
canvas{border:1px solid #000;display:block;background:#fff}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;max-width:920px}
.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:3px 10px;border-radius:2px}
.ctrl-group label{font-size:0.6em;color:#666;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.ctrl-group input[type=range]{width:72px;accent-color:#000;height:14px;cursor:pointer}
.ctrl-group .val{font-size:0.65em;color:#000;min-width:24px;text-align:right;font-weight:700}
button{background:#fff;border:1px solid #000;color:#000;padding:3px 10px;font:0.65em 'Courier New',monospace;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:.1s}
button:hover{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:6px;font-size:0.65em;color:#666;max-width:920px;justify-content:center}
.stats span{white-space:nowrap}.stats .label{color:#999}.stats .val{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Compton Scattering</h1>
<p>Δλ = h/(mₑc)(1−cosθ) &nbsp; E = hc/λ &nbsp; λ<sub>C</sub> = h/(mₑc) = 2.426×10⁻³ nm &nbsp; cotφ = (1+λ<sub>C</sub>/λ₀)tan(θ/2)</p>
<canvas id="c" width="920" height="520"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const ca=document.getElementById('c'),cx=ca.getContext('2d'),W=920,H=520
let th=60,l0=0.02,sp=1,pl=true,an=0,ti=0
const h=6.626e-34,me=9.11e-31,c=3e8,lc=h/(me*c)*1e9
const hDl=[],hE=[]
function dr(){
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H)
  if(pl){ti+=sp*0.016;if(an)th=20+140*(1+Math.sin(ti*0.5))/2}
  const r=th*Math.PI/180,dl=2.43e-3*(1-Math.cos(r)),l1=l0+dl,E0=1240/l0,E1=1240/l1
  const cx0=280,cy=255
  cx.strokeStyle = '#111'
  cx.lineWidth = 2.5
  cx.beginPath()
  cx.moveTo(cx0 - 220, cy)
  cx.lineTo(cx0, cy)
  cx.stroke()
  cx.fillStyle = '#111'
  cx.beginPath()
  cx.moveTo(cx0 - 120, cy)
  cx.lineTo(cx0 - 110, cy - 5)
  cx.lineTo(cx0 - 110, cy + 5)
  cx.fill()
  cx.fillStyle = '#111'
  cx.font = '8px monospace'
  cx.textAlign = 'center'
  cx.fillText('γ', cx0 - 160, cy - 14)
  cx.fillText('λ₀ = ' + l0.toFixed(3) + ' nm', cx0 - 100, cy - 30)
  cx.fillText('E₀ = ' + E0.toFixed(1) + ' eV', cx0 - 100, cy - 46)
  const ea = Math.atan(Math.sin(r) / (1 - Math.cos(r) + l0 / lc))
  const eD = ea * 180 / Math.PI
  cx.strokeStyle = 'rgba(0,0,0,0.3)'
  cx.lineWidth = 1.2
  cx.setLineDash([5, 3])
  cx.beginPath()
  cx.moveTo(cx0, cy)
  cx.lineTo(cx0 + 150 * Math.cos(ea), cy + 150 * Math.sin(ea))
  cx.stroke()
  cx.setLineDash([])
  cx.fillStyle = 'rgba(0,0,0,0.35)'
  cx.font = '7px monospace'
  cx.textAlign = 'center'
  cx.fillText('e⁻ (recoil)', cx0 + 80 * Math.cos(ea), cy + 80 * Math.sin(ea) - 12)
  cx.fillText('φ = ' + eD.toFixed(1) + '°', cx0 + 70 * Math.cos(ea), cy + 70 * Math.sin(ea) + 12)
  cx.strokeStyle = '#111'
  cx.lineWidth = 2.5
  cx.beginPath()
  cx.moveTo(cx0, cy)
  cx.lineTo(cx0 + 240 * Math.cos(r), cy - 240 * Math.sin(r))
  cx.stroke()
  const sx = cx0 + 140 * Math.cos(r)
  const sy = cy - 140 * Math.sin(r)
  cx.fillStyle = '#111'
  cx.beginPath()
  cx.moveTo(sx, sy)
  cx.lineTo(sx - 14 * Math.cos(r - 0.3), sy + 14 * Math.sin(r - 0.3))
  cx.lineTo(sx - 14 * Math.cos(r + 0.3), sy + 14 * Math.sin(r + 0.3))
  cx.fill()
  cx.fillStyle = '#999'
  cx.font = '8px monospace'
  cx.textAlign = 'center'
  cx.fillText("γ′", sx + 45, sy - 14)
  cx.fillText("λ' = " + l1.toFixed(3) + ' nm', sx + 45, sy + 4)
  cx.fillText("E' = " + E1.toFixed(1) + ' eV', sx + 45, sy + 20)
  cx.fillStyle = 'rgba(0,0,0,0.03)'
  cx.beginPath()
  cx.arc(cx0, cy, 12, 0, Math.PI * 2)
  cx.fill()
  cx.strokeStyle = 'rgba(0,0,0,0.08)'
  cx.lineWidth = 0.5
  cx.beginPath()
  cx.arc(cx0, cy, 12, 0, Math.PI * 2)
  cx.stroke()
  cx.strokeStyle = 'rgba(0,0,0,0.08)'
  cx.lineWidth = 0.3
  cx.beginPath()
  cx.arc(cx0, cy, 55, 0, -r, true)
  cx.stroke()
  cx.fillStyle = '#999'
  cx.font = '7px monospace'
  cx.textAlign = 'center'
  cx.fillText('θ = ' + th.toFixed(0) + '°', cx0 + 75, cy - 22)
  const gX = 540
  const gY = 30
  const gW = 350
  const gH = 200
  cx.strokeStyle = '#ddd'
  cx.lineWidth = 0.5
  cx.strokeRect(gX, gY, gW, gH)
  cx.fillStyle = '#999'
  cx.font = '8px monospace'
  cx.textAlign = 'left'
  cx.fillText('Δλ vs scattering angle θ', gX + 4, gY + 12)
  cx.fillStyle = '#ccc'
  cx.font = '6px monospace'
  cx.fillText('Δλ (pm)', gX + 4, gY + 24)
  cx.strokeStyle = 'rgba(0,0,0,0.1)'
  cx.lineWidth = 0.6
  cx.beginPath()
  cx.moveTo(gX, gY + gH)
  cx.lineTo(gX + gW, gY + gH)
  cx.stroke()
  cx.beginPath()
  cx.moveTo(gX, gY)
  cx.lineTo(gX, gY + gH)
  cx.stroke()
  cx.strokeStyle = '#111'
  cx.lineWidth = 1.2
  cx.beginPath()
  for (let x = 0; x <= gW; x++) {
    const th2 = (x / gW) * Math.PI
    const dl2 = 2.43e-3 * (1 - Math.cos(th2)) * 1e3
    const py = gY + gH - dl2
    x === 0 ? cx.moveTo(gX + x, py) : cx.lineTo(gX + x, py)
  }
  cx.stroke()
  const ptX = gX + (th / 180) * gW
  const ptY = gY + gH - (dl * 1e3)
  cx.strokeStyle = 'rgba(0,0,0,0.2)'
  cx.lineWidth = 0.5
  cx.beginPath()
  cx.moveTo(ptX, gY + gH + 4)
  cx.lineTo(ptX, ptY)
  cx.lineTo(gX - 4, ptY)
  cx.stroke()
  cx.fillStyle = '#111'
  cx.beginPath()
  cx.arc(ptX, ptY, 4, 0, Math.PI * 2)
  cx.fill()
  const bX = 540
  const bY = 255
  const bW = 350
  const bH = 18
  cx.fillStyle = 'rgba(0,0,0,0.06)'
  cx.fillRect(bX, bY, bW, bH)
  cx.fillStyle = '#111'
  cx.fillRect(bX, bY, bW * E1 / E0, bH)
  cx.strokeStyle = 'rgba(0,0,0,0.08)'
  cx.lineWidth = 0.5
  cx.strokeRect(bX, bY, bW, bH)
  cx.fillStyle = '#999'
  cx.font = '7px monospace'
  cx.textAlign = 'left'
  cx.fillText("E'/E₀ = " + (E1 / E0 * 100).toFixed(1) + '%', bX, bY - 4)
  cx.textAlign = 'right'
  cx.fillText('E₀=' + E0.toFixed(0) + 'eV → E′=' + E1.toFixed(0) + 'eV', bX + bW, bY + bH + 14)
  hDl.push(dl * 1e3)
  hE.push(E1 / E0)
  if (hDl.length > 85) { hDl.shift(); hE.shift() }
  for (let k = 0; k < 2; k++) {
    const arr = k ? hE : hDl
    const mgX = 540
    const mgY = 290 + k * 110
    const mgW = 350
    const mgH = 90
    cx.strokeStyle = '#ddd'
    cx.lineWidth = 0.5
    cx.strokeRect(mgX, mgY, mgW, mgH)
    cx.fillStyle = '#999'
    cx.font = '7px monospace'
    cx.textAlign = 'left'
    cx.fillText(k ? 'Energy ratio E′/E₀ history' : 'Wavelength shift Δλ (pm) history', mgX + 4, mgY + 12)
    if (arr.length > 1) {
      const mx = Math.max(...arr)
      const mn = Math.min(...arr)
      const rg = mx - mn || 1
      cx.strokeStyle = k ? 'rgba(0,0,0,0.5)' : '#111'
      cx.lineWidth = 0.9
      cx.beginPath()
      for (let i = 0; i < arr.length; i++) {
        const x = mgX + i / (arr.length - 1) * mgW
        const y = mgY + mgH - (arr[i] - mn) / rg * (mgH - 14)
        i === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y)
      }
      cx.stroke()
    }
  }
  const pTrans = 1 - E1 / E0
  const eKE = E0 - E1
  const sigmaTh = 2 * Math.PI * Math.pow(lc * 1e-9 * 1e10, 2) * (1 + Math.cos(r) * Math.cos(r)) / (1 - Math.cos(r)) / 2
if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML =
    '<div class="ctrl-group"><label>θ(°)</label><input type="range" id="tS" min="0" max="180" step="1" value="' + th + '"><span class="val" id="tV">' + (th|0) + '</span></div>' +
    '<div class="ctrl-group"><label>λ₀(nm)</label><input type="range" id="lS" min="0.001" max="0.1" step="0.002" value="' + l0 + '"><span class="val" id="lV">' + l0.toFixed(3) + '</span></div>' +
    '<div class="ctrl-group"><label>SPEED</label><input type="range" id="spS" min="0" max="5" step="0.1" value="' + sp + '"><span class="val" id="spV">' + sp.toFixed(1) + '</span></div>' +
    '<button id="plBtn">' + (pl ? '⏸PAUSE' : '▶PLAY') + '</button>' +
    '<button id="rsBtn">↺RESET</button>' +
    '<button id="anBtn">' + (an ? '⊙SWEEP' : '○SWEEP') + '</button>'
  document.getElementById('tS').oninput = function(){ th = +this.value; tV.textContent = th|0 }
  document.getElementById('lS').oninput = function(){ l0 = +this.value; lV.textContent = l0.toFixed(3) }
  document.getElementById('spS').oninput = function(){ sp = +this.value; spV.textContent = sp.toFixed(1) }
  document.getElementById('plBtn').onclick = function(){ pl = !pl; this.textContent = pl ? '⏸PAUSE' : '▶PLAY' }
  document.getElementById('rsBtn').onclick = function(){ th = 60; l0 = 0.02; ti = 0; hDl.length = 0; hE.length = 0 }
  document.getElementById('anBtn').onclick = function(){ an = 1 - an; this.textContent = an ? '⊙SWEEP' : '○SWEEP' }
}
  document.getElementById('stats').innerHTML =
    '<span><span class="label">θ =</span> <span class="val">' + th.toFixed(1) + '°</span></span>' +
    '<span><span class="label">λ₀ =</span> <span class="val">' + l0.toFixed(3) + '</span> nm</span>' +
    '<span><span class="label">λ′ =</span> <span class="val">' + l1.toFixed(4) + '</span> nm</span>' +
    '<span><span class="label">Δλ =</span> <span class="val">' + (dl*1e3).toFixed(4) + '</span> pm</span>' +
    '<span><span class="label">E₀ =</span> <span class="val">' + E0.toFixed(1) + '</span> eV</span>' +
    '<span><span class="label">E′ =</span> <span class="val">' + E1.toFixed(1) + '</span> eV</span>' +
    '<span><span class="label">ΔE/E₀ =</span> <span class="val">' + (pTrans*100).toFixed(1) + '%</span></span>' +
    '<span><span class="label">e⁻ KE =</span> <span class="val">' + eKE.toFixed(2) + '</span> eV</span>' +
    '<span><span class="label">λ_C =</span> <span class="val">' + lc.toFixed(4) + '</span> nm</span>' +
    '<span><span class="label">φ_e =</span> <span class="val">' + eD.toFixed(1) + '°</span></span>' +
    '<span><span class="label">λ₀/λ_C =</span> <span class="val">' + (l0/lc).toFixed(2) + '</span></span>' +
    '<span><span class="label">Δλ_max =</span> <span class="val">' + (2*2.43e-3*1e3).toFixed(3) + '</span> pm</span>' +
    '<span><span class="label">hc =</span> <span class="val">' + (h*c/1.6e-19).toFixed(1) + '</span> eV·nm</span>' +
    '<span><span class="label">σ_KN ∝</span> <span class="val">' + sigmaTh.toFixed(2) + '</span> a.u.</span>'
}
setInterval(dr, 16)
</script>
</body>
</html>
