<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planck Blackbody · B_λ(T) = 2hc²/λ⁵ · 1/(e^{hc/λkT}−1)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:1.2em;font-weight:900;text-transform:uppercase;letter-spacing:2px}
.eq{font-size:0.7em;color:#666;margin-bottom:5px}
canvas{border:1px solid #000;display:block}
.ctrl{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:5px;max-width:920px}
.cg{display:flex;align-items:center;gap:3px;background:#fafafa;border:1px solid #eee;padding:2px 7px;border-radius:2px}
.cg label{font-size:0.58em;color:#666;text-transform:uppercase;letter-spacing:1px}
.cg input[type=range]{width:70px;accent-color:#000;height:14px}
.cg .v{font-size:0.6em;color:#000;min-width:24px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:2px 9px;font-family:'Courier New',monospace;font-size:0.6em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .12s}
button:hover{background:#000;color:#fff}
.st{display:flex;flex-wrap:wrap;gap:1px 10px;margin-top:3px;font-size:0.6em;color:#666;max-width:920px;justify-content:center}
.st span{white-space:nowrap}
.st .l{color:#999}
.st .v{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Planck Blackbody Radiation</h1>
<p class="eq">B_λ(T) = 2hc²/λ⁵ · 1/(e^{hc/λkT}−1) — Wien: λ_maxT = 2.898×10⁻³ m·K</p>
<canvas id="c" width="920" height="520"></canvas>
<div class="ctrl" id="ctrls"></div>
<div class="st" id="st"></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d'),W=920,H=520;
const hc=1.98644586e-25,kB=1.380649e-23,sig=5.670374e-8;
let T=5000,showAll=1,lmin=1e-8,lmax=3.5e-6,lTarg=1;
const tHist=[],pHist=[],peakHist=[],maxH=200;
let time=0;
function planck(l,T){const d=Math.exp(hc/(l*kB*T))-1;return d<=0?0:2*hc*hc/(l*l*l*l*l*d)}
function wien(T){return 2.898e-3/T}
function stefan(T){return sig*T*T*T*T}
function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const gx=W*0.08,gw=W*0.84,gy=H*0.1,gh=H*0.6,lMin=Math.log(lmin),lMax=Math.log(lmax);
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=0.5;ctx.strokeRect(gx,gy,gw,gh);
  // axes labels
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.font='8px monospace';ctx.textAlign='center';
  for(let i=0;i<=8;i++){const l=lmin*Math.pow(lmax/lmin,i/8),sx=gx+i/8*gw;ctx.beginPath();ctx.moveTo(sx,gy+gh);ctx.lineTo(sx,gy+gh+4);ctx.stroke();ctx.fillText((l*1e9).toFixed(0)+'nm',sx,gy+gh+14)}
  ctx.textAlign='left';ctx.fillText('λ →',gx+gw+4,gy+gh+4);
  // compute curves
  let maxB=0;const curves=[];
  const temps=showAll?[2000,3000,4000,5000,6000,7000,8000,9000,10000]:[T];
  for(let ti=0;ti<temps.length;ti++){
    const pts=[];for(let i=0;i<=300;i++){const l=lmin*Math.pow(lmax/lmin,i/300);pts.push({l,B:planck(l,temps[ti])});if(pts[i].B>maxB)maxB=pts[i].B}curves.push(pts)
  }
  for(let ti=0;ti<temps.length;ti++){
    const pts=curves[ti],sel=temps[ti]===T,a=sel?1:0.12,lw=sel?1.6:0.4;
    ctx.beginPath();for(let i=0;i<pts.length;i++){const sx=gx+(Math.log(pts[i].l)-lMin)/(lMax-lMin)*gw,sy=gy+gh-pts[i].B/maxB*gh;i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy)}
    ctx.strokeStyle=`rgba(0,0,0,${a})`;ctx.lineWidth=lw;ctx.stroke()
  }
  // Wien line
  const lmaxW=wien(T),sxW=gx+(Math.log(lmaxW)-lMin)/(lMax-lMin)*gw;
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.6;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(sxW,gy);ctx.lineTo(sxW,gy+gh);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText('λ_max='+(lmaxW*1e9).toFixed(0)+'nm',sxW+4,gy+gh-4);
  // legend
  ctx.font='8px monospace';ctx.textAlign='right';let ly=gy+14;
  for(let ti=0;ti<temps.length;ti++){const sel=temps[ti]===T;ctx.fillStyle=`rgba(0,0,0,${sel?1:0.2})`;ctx.fillText(temps[ti]+'K',gx+gw-10,ly);if(sel){ctx.fillRect(gx+gw-18,ly-7,6,6)}ly+=14}
  // color bar
  const by=H*0.78,bh=14,bw=gw;const grad=ctx.createLinearGradient(gx,0,gx+bw,0);
  for(let i=0;i<=1;i+=0.02){const l=lmin*Math.pow(lmax/lmin,i);const [r,g,b]=wav(l*1e9);grad.addColorStop(i,`rgb(${r},${g},${b})`)}
  ctx.fillStyle=grad;ctx.fillRect(gx,by,bw,bh);
  // Power spectrum mini graph (Rayleigh-Jeans tail check)
  const gx2=gx,gy2=by+bh+10,gw2=gw,gh2=80;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(gx2,gy2,gw2,gh2);
  ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('B_λ(T) — selected curve only',gx2+3,gy2+10);
  const sp=[];for(let i=0;i<=200;i++){const l=lmin*Math.pow(lmax/lmin,i/200);sp.push(planck(l,T))}if(Math.max(...sp)>0){const ms=Math.max(...sp);ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<sp.length;i++){const px=gx2+(i/200)*gw2,py=gy2+gh2-sp[i]/ms*(gh2-10);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke()}
  // stats tracking
  const S=stefan(T),peakB=planck(lmaxW,T),pwr=lTarg*1e-9;const spc=planck(pwr,T);
  if(tHist.length===0||time>tHist[tHist.length-1]+0.5){tHist.push(time);pHist.push(S);peakHist.push(lmaxW);if(tHist.length>maxH){tHist.shift();pHist.shift();peakHist.shift()}}
if(!document.getElementById('ctrls').querySelector('button')){
  document.getElementById('ctrls').innerHTML=
    `<div class="cg"><label>T (K)</label><input type="range" id="sT" min="500" max="15000" step="100" value="${T}"><span class="v" id="vT">${T}</span></div>`+
    `<div class="cg"><label>λ_min</label><input type="range" id="sLm" min="0.5" max="5" step="0.1" value="${lmin*1e7}"><span class="v" id="vLm">${(lmin*1e7).toFixed(1)}</span></div>`+
    `<div class="cg"><label>λ_max</label><input type="range" id="sLM" min="2" max="10" step="0.5" value="${lmax*1e6}"><span class="v" id="vLM">${(lmax*1e6).toFixed(1)}</span></div>`+
    `<div class="cg"><label>λ_targ</label><input type="range" id="sLt" min="200" max="1200" step="10" value="${lTarg}"><span class="v" id="vLt">${lTarg}</span></div>`+
    `<div class="cg"><label>ShowAll</label><input type="range" id="sSA" min="0" max="1" step="1" value="${showAll}"><span class="v" id="vSA">${showAll?'ON':'OFF'}</span></div>`+
    `<button id="rs">RESET</button>`;
  document.getElementById('sT').oninput=function(){T=+this.value;document.getElementById('vT').textContent=T};
  document.getElementById('sLm').oninput=function(){lmin=+this.value*1e-7;document.getElementById('vLm').textContent=(+this.value).toFixed(1)};
  document.getElementById('sLM').oninput=function(){lmax=+this.value*1e-6;document.getElementById('vLM').textContent=(+this.value).toFixed(1)};
  document.getElementById('sLt').oninput=function(){lTarg=+this.value;document.getElementById('vLt').textContent=lTarg};
  document.getElementById('sSA').oninput=function(){showAll=+this.value;document.getElementById('vSA').textContent=showAll?'ON':'OFF'};
  document.getElementById('rs').onclick=function(){time=0;tHist.length=0;pHist.length=0;peakHist.length=0};
}
  document.getElementById('st').innerHTML=
    `<span><span class="l">T =</span> <span class="v">${T}</span> K</span>`+
    `<span><span class="l">λ_max =</span> <span class="v">${(lmaxW*1e9).toFixed(0)}</span> nm</span>`+
    `<span><span class="l">B_λ(λ_max) =</span> <span class="v">${peakB.toExponential(3)}</span></span>`+
    `<span><span class="l">M = σT⁴ =</span> <span class="v">${S.toExponential(3)}</span> W/m²</span>`+
    `<span><span class="l">B_λ(${lTarg}nm) =</span> <span class="v">${spc.toExponential(3)}</span></span>`+
    `<span><span class="l">Wien const =</span> <span class="v">${(lmaxW*T).toExponential(4)}</span> m·K</span>`+
    `<span><span class="l">hc/k =</span> <span class="v">${(hc/kB).toExponential(3)}</span> m·K</span>`+
    `<span><span class="l">Rayleigh-Jeans</span> <span class="v">λ»λ_max ✓</span></span>`+
    `<span><span class="l">Stefan-Boltz</span> <span class="v">M∝T⁴</span></span>`+
    `<span><span class="l">λ_range</span> <span class="v">${(lmin*1e9).toFixed(0)}–${(lmax*1e9).toFixed(0)}</span> nm</span>`+
    `<span><span class="l">T_range</span> <span class="v">${showAll?'500–10000':T}</span> K</span>`+
    `<span><span class="l">Curves</span> <span class="v">${showAll?9:1}</span></span>`
}
function wav(nm){let r=0,g=0,b=0;if(nm>=380&&nm<440){r=-(nm-440)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=-(nm-510)/20}else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=-(nm-645)/65}else if(nm<=780){r=1};let f=1;if(nm>=380&&nm<420)f=0.3+0.7*(nm-380)/40;else if(nm>=645&&nm<=780)f=0.3+0.7*(780-nm)/135;return[Math.round(r*f*255),Math.round(g*f*255),Math.round(b*f*255)]}
function loop(){time+=0.02;draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
