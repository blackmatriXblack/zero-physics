<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1D Heat Conduction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #000; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { display: block; }
  .title {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .3;
    pointer-events: none; white-space: nowrap;
  }
  .data {
    position: absolute; right: 10px; top: 34px;
    font-size: 9px; line-height: 1.6; text-align: right;
    pointer-events: none; opacity: .75;
  }
  .ctrl {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
    background: rgba(255,255,255,.92); padding: 5px 12px;
    border: 1px solid #000; font-size: 9px; font-family: 'Courier New', monospace;
  }
  .ctrl button {
    background: #fff; border: 1px solid #000; color: #000;
    padding: 2px 8px; font: 8px 'Courier New'; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .ctrl button:hover { background: #000; color: #fff; }
  .ctrl label {
    font-size: 7px; color: #666; text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 3px;
  }
  .ctrl input[type=range] { accent-color: #000; width: 50px; height: 14px; vertical-align: middle; }
  .ctrl .v { min-width: 24px; display: inline-block; text-align: right; font-size: 8px; }
</style>
</head>
<body>

<div class="title">1D Heat Conduction — dT/dt = alpha * d2T/dx2</div>
<div class="data" id="d"></div>
<canvas id="c"></canvas>

<div class="ctrl">
  <button id="pb">PAUSE</button>
  <button id="rb">RESET</button>
  <label>α <input type="range" id="aS" min=".002" max=".2" step=".002" value=".05"><span class="v" id="aV">0.050</span></label>
  <label>Th <input type="range" id="hS" min=".2" max="1" step=".02" value="1"><span class="v" id="hV">1.00</span></label>
  <label>Tc <input type="range" id="cS" min="0" max=".8" step=".02" value="0"><span class="v" id="cV">0.00</span></label>
  <label>Spd <input type="range" id="sS" min="1" max="50" value="10"><span class="v" id="sV">10</span></label>
</div>

<script>
const c = document.getElementById('c');
const cx = c.getContext('2d');
let W, H;

function resizeCanvas() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const N = 150, L = 1.0, dx = L / N;
let alpha = 0.05, Th = 1.0, Tc = 0.0, speed = 10, running = true, frame = 0;
let T, Tnew;

const HIST_LEN = 150;
let histFlux = [];

function init() {
  T = new Float64Array(N);
  Tnew = new Float64Array(N);
  const mid = Math.floor(N / 3);
  for (let i = 0; i < N; i++) T[i] = Tc;
  for (let i = 0; i < mid; i++) T[i] = Th;
  for (let i = 0; i < N; i++) Tnew[i] = T[i];
  frame = 0;
  histFlux = [];
}

function step() {
  const dt = 0.4 * dx * dx / alpha;
  for (let i = 1; i < N - 1; i++) {
    Tnew[i] = T[i] + alpha * dt / (dx * dx) * (T[i + 1] - 2 * T[i] + T[i - 1]);
  }
  T[0] = Th; T[N - 1] = Tc;
  Tnew[0] = Th; Tnew[N - 1] = Tc;
  const tmp = T; T = Tnew; Tnew = tmp;
  frame++;
}

function tempToGray(t) {
  const v = Math.max(0, Math.min(1, t));
  const c2 = Math.round(v * 255);
  return 'rgb(' + c2 + ',' + c2 + ',' + c2 + ')';
}

function draw() {
  cx.fillStyle = '#fff';
  cx.fillRect(0, 0, W, H);

  const gx = W * 0.06, gw = W * 0.55, gy = H * 0.10, gh = H * 0.45;
  cx.strokeStyle = 'rgba(0,0,0,0.1)'; cx.lineWidth = 0.5;
  cx.strokeRect(gx, gy, gw, gh);

  cx.fillStyle = '#999'; cx.font = '7px monospace'; cx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const x = gx + i / 5 * gw;
    cx.fillRect(x, gy + gh, 1, 3);
    cx.fillText((i / 5).toFixed(1), x, gy + gh + 10);
  }
  for (let i = 0; i <= 4; i++) {
    const y = gy + (1 - i / 4) * gh;
    cx.fillRect(gx - 3, y, 3, 1);
    cx.textAlign = 'right'; cx.fillText((i / 4).toFixed(1), gx - 6, y + 3);
  }
  cx.textAlign = 'left';
  cx.fillStyle = '#666'; cx.fillText('T', gx - 12, gy - 4); cx.fillText('x', gx + gw + 2, gy + gh + 2);

  cx.strokeStyle = '#000'; cx.lineWidth = 2; cx.beginPath();
  for (let i = 0; i < N; i++) {
    const x = gx + (i / (N - 1)) * gw;
    const y = gy + (1 - T[i]) * gh;
    if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
  }
  cx.stroke();

  // Temperature bar
  const barX = gx, barY = gy + gh + 20, barW = gw, barH = Math.min(H * 0.1, 30);
  const segW = barW / N;
  for (let i = 0; i < N; i++) {
    cx.fillStyle = tempToGray(T[i]);
    cx.fillRect(barX + i * segW, barY, segW + 0.5, barH);
  }
  cx.strokeStyle = '#000'; cx.lineWidth = 0.8;
  cx.strokeRect(barX, barY, barW, barH);
  cx.font = '8px monospace'; cx.fillStyle = '#000'; cx.textAlign = 'center';
  cx.fillText('HOT', barX - 10, barY + barH / 2 + 3);
  cx.fillText('COLD', barX + barW + 10, barY + barH / 2 + 3);

  // Mini flux graph
  const mgx = W * 0.68, mgy = gy;
  const mgw = Math.min(W * 0.28, 180), mgh = Math.min(H * 0.25, 100);
  cx.strokeStyle = 'rgba(0,0,0,0.1)'; cx.lineWidth = 0.5;
  cx.strokeRect(mgx, mgy, mgw, mgh);
  cx.fillStyle = 'rgba(0,0,0,0.3)'; cx.font = '7px monospace';
  cx.fillText('Heat flux', mgx + 4, mgy + 10);
  if (histFlux.length > 1) {
    const fMin = Math.min(...histFlux), fMax = Math.max(...histFlux), fR = fMax - fMin || 1;
    cx.strokeStyle = 'rgba(0,0,0,0.5)'; cx.lineWidth = 0.6; cx.beginPath();
    for (let i = 0; i < histFlux.length; i++) {
      const x = mgx + (i / (HIST_LEN - 1)) * mgw;
      const y = mgy + mgh - (histFlux[i] - fMin) / fR * mgh;
      if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
    }
    cx.stroke();
  }

  const mid = Math.floor(N / 2);
  const flux = -alpha * (T[mid + 1] - T[mid - 1]) / (2 * dx);
  let tSum = 0, tMax = 0, tMin = 1;
  for (let i = 0; i < N; i++) {
    tSum += T[i];
    if (T[i] > tMax) tMax = T[i];
    if (T[i] < tMin) tMin = T[i];
  }
  const tAvg = tSum / N;
  const grad = (T[N - 1] - T[0]) / (N * dx);
  const tau = L * L / (alpha * Math.PI * Math.PI);

  document.getElementById('d').innerHTML =
    'alpha=' + alpha.toFixed(3) +
    '<br>T_left=' + T[0].toFixed(3) +
    '<br>T_right=' + T[N - 1].toFixed(3) +
    '<br>Flux=' + flux.toFixed(4) +
    '<br>Frame=' + frame +
    '<br>T_mean=' + tAvg.toFixed(3) +
    '<br>T_max=' + tMax.toFixed(3) +
    '<br>T_min=' + tMin.toFixed(3) +
    '<br>dT/dx=' + grad.toFixed(4) +
    '<br>Q_total=' + (tSum * dx).toFixed(3) +
    '<br>\u03c4=' + tau.toFixed(1) +
    '<br>L=' + L.toFixed(1);
}

document.getElementById('pb').onclick = () => {
  running = !running;
  document.getElementById('pb').textContent = running ? 'PAUSE' : 'PLAY';
};
document.getElementById('rb').onclick = init;
document.getElementById('aS').oninput = function () { alpha = parseFloat(this.value); document.getElementById('aV').textContent = alpha.toFixed(3); };
document.getElementById('hS').oninput = function () { Th = parseFloat(this.value); document.getElementById('hV').textContent = Th.toFixed(2); };
document.getElementById('cS').oninput = function () { Tc = parseFloat(this.value); document.getElementById('cV').textContent = Tc.toFixed(2); };
document.getElementById('sS').oninput = function () { speed = parseFloat(this.value); document.getElementById('sV').textContent = speed; };
init();

function loop() {
  if (running) {
    for (let i = 0; i < speed; i++) {
      step();
      const mid = Math.floor(N / 2);
      const fl = -alpha * (T[mid + 1] - T[mid - 1]) / (2 * dx);
      histFlux.push(fl);
    }
    if (histFlux.length > HIST_LEN) histFlux.shift();
  }
  draw();
  requestAnimationFrame(loop);
}

resizeCanvas();
loop();
</script>
</body>
</html>
