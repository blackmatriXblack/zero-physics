<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Pendulum · θ̈ + (g/l) sin θ = 0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}
h1{font-size:1.4em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
p{font-size:0.75em;color:#666;margin-bottom:10px}
canvas{border:1px solid #000;display:block;cursor:grab}
canvas:active{cursor:grabbing}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px;max-width:900px}
.ctrl-group{display:flex;align-items:center;gap:4px;background:#fafafa;border:1px solid #eee;padding:4px 10px;border-radius:2px}
.ctrl-group label{font-size:0.65em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-group input[type=range]{width:80px;accent-color:#000}
.ctrl-group .val{font-size:0.7em;color:#000;min-width:28px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:4px 12px;font-family:'Courier New',monospace;font-size:0.7em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
button:hover{background:#000;color:#fff}
button.active{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:0.7em;color:#666;max-width:900px;justify-content:center}
.stats span{white-space:nowrap}
.stats .label{color:#999}
.stats .val{color:#000;font-weight:700}
.graph-container{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.graph-box{border:1px solid #ddd;position:relative}
.graph-box .gtitle{position:absolute;top:3px;left:6px;font-size:0.6em;color:#999;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<h1>Simple Pendulum</h1>
<p>θ̈ + (g/l) sin θ = 0 — Click & drag the bob to set initial angle</p>
<canvas id="c" width="900" height="420"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<div class="graph-container" id="graphs"></div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;

// Physics state
let g=9.81, l=1.8, theta=2.7, omega=0;
const dt=0.008;
let paused=false, speed=1;
let dragging=false;

// Main view
const px=200, py=90, scale=160;

// Data collection
const history={t:[],th:[],om:[],ke:[],pe:[],te:[]};
const maxHistory=600;
let simTime=0;

// Energy graph
const egX=610, egY=30, egW=260, egH=120;
// Phase space
const psX=610, psY=200, psW=260, psH=160;

function energy(){
  return {ke:0.5*l*l*omega*omega, pe:g*l*(1-Math.cos(theta)), te:0.5*l*l*omega*omega+g*l*(1-Math.cos(theta))};
}

function step(){
  if(paused)return;
  for(let s=0;s<speed;s++){
    const alpha=-(g/l)*Math.sin(theta);
    omega+=alpha*dt*0.5;
    theta+=omega*dt;
    omega+=alpha*dt*0.5;
    const e=energy();
    history.t.push(simTime);
    history.th.push(theta);
    history.om.push(omega);
    history.ke.push(e.ke);
    history.pe.push(e.pe);
    history.te.push(e.te);
    if(history.t.length>maxHistory){history.t.shift();history.th.shift();history.om.shift();history.ke.shift();history.pe.shift();history.te.shift();}
    simTime+=dt;
  }
}

function resetSim(){
  theta=2.7; omega=0; simTime=0;
  history.t.length=0;history.th.length=0;history.om.length=0;
  history.ke.length=0;history.pe.length=0;history.te.length=0;
  paused=false;
  document.getElementById('pauseBtn').textContent='Pause';
}

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  const mx=px+l*scale*Math.sin(theta), my=py+l*scale*Math.cos(theta);

  // Ceiling
  ctx.strokeStyle='#111';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(px-200,py-2);ctx.lineTo(px+200,py-2);ctx.stroke();

  // Ceiling anchors
  for(let ax=-180;ax<=180;ax+=60){
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px+ax,py-2);ctx.lineTo(px+ax,py-25);ctx.stroke();
  }

  // Pivot
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();

  // Rod
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(mx,my);ctx.stroke();

  // Angle arc
  if(Math.abs(theta)>0.005){
    const ar=35;
    ctx.beginPath();ctx.arc(px,py,ar,-Math.PI/2,-Math.PI/2+theta,theta<0);
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.font='10px monospace';
    const ax_=px+ar*Math.cos(-Math.PI/2+theta/2);
    const ay_=py+ar*Math.sin(-Math.PI/2+theta/2);
    ctx.fillText('θ='+theta.toFixed(2),px+ar+8,py-ar*0.5+4);
  }

  // Bob with gradient
  const grad=ctx.createRadialGradient(mx-4,my-4,2,mx,my,16);
  grad.addColorStop(0,'#333');grad.addColorStop(1,'#000');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(mx,my,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.arc(mx-3,my-3,8,0,Math.PI*2);ctx.stroke();

  // Trail with energy color gradient
  const tlen=history.th.length;
  if(tlen>2){
    for(let i=1;i<tlen;i++){
      const frac=i/tlen;
      const hx=px+l*scale*Math.sin(history.th[i]);
      const hy=py+l*scale*Math.cos(history.th[i]);
      ctx.fillStyle=`rgba(0,0,0,${0.03+0.12*frac})`;
      ctx.beginPath();ctx.arc(hx,hy,2+frac*2,0,Math.PI*2);ctx.fill();
    }
    // Trail line
    ctx.beginPath();
    ctx.moveTo(px+l*scale*Math.sin(history.th[0]),py+l*scale*Math.cos(history.th[0]));
    for(let i=1;i<tlen;i++){
      ctx.lineTo(px+l*scale*Math.sin(history.th[i]),py+l*scale*Math.cos(history.th[i]));
    }
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.5;ctx.stroke();
  }

  // ---- Energy Graph ----
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;
  ctx.strokeRect(egX,egY,egW,egH);
  ctx.fillStyle='#999';ctx.font='8px monospace';
  ctx.textAlign='left';ctx.fillText('energy',egX+3,egY+10);

  if(history.te.length>2){
    const eMax=Math.max(...history.te)*1.1||1;
    // PE
    ctx.beginPath();
    for(let i=0;i<history.ke.length;i++){
      const gx=egX+(i/history.ke.length)*egW;
      const gy=egY+egH-(history.pe[i]/eMax)*egH;
      i===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
    }
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.setLineDash([2,3]);ctx.stroke();
    ctx.setLineDash([]);
    // KE
    ctx.beginPath();
    for(let i=0;i<history.ke.length;i++){
      const gx=egX+(i/history.ke.length)*egW;
      const gy=egY+egH-(history.ke[i]/eMax)*egH;
      i===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
    }
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.stroke();
    // TE
    ctx.beginPath();
    for(let i=0;i<history.te.length;i++){
      const gx=egX+(i/history.te.length)*egW;
      const gy=egY+egH-(history.te[i]/eMax)*egH;
      i===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
    }
    ctx.strokeStyle='#111';ctx.lineWidth=0.6;ctx.stroke();
    // Legend
    ctx.font='7px monospace';ctx.textAlign='left';
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText('KE',egX+egW-35,egY+12);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillText('PE',egX+egW-18,egY+12);
    ctx.fillStyle='#111';ctx.fillText('E',egX+egW-50,egY+12);
  }

  // ---- Phase Space ----
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;
  ctx.strokeRect(psX,psY,psW,psH);
  ctx.fillStyle='#999';ctx.font='8px monospace';
  ctx.textAlign='left';ctx.fillText('phase space (θ vs ω)',psX+3,psY+10);

  // Axes
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(psX+psW/2,psY);ctx.lineTo(psX+psW/2,psY+psH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(psX,psY+psH/2);ctx.lineTo(psX+psW,psY+psH/2);ctx.stroke();

  if(history.th.length>2){
    const thMax=Math.max(...history.th.map(Math.abs))*1.2||1;
    const omMax=Math.max(...history.om.map(Math.abs))*1.2||1;
    // Phase trajectory
    ctx.beginPath();
    for(let i=0;i<history.th.length;i++){
      const gx=psX+psW/2+(history.th[i]/thMax)*(psW/2-6);
      const gy=psY+psH/2-(history.om[i]/omMax)*(psH/2-6);
      i===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
    }
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;ctx.stroke();
    // Current point
    const cx=psX+psW/2+(theta/thMax)*(psW/2-6);
    const cy=psY+psH/2-(omega/omMax)*(psH/2-6);
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
  }

  // ---- Info text on canvas ----
  const e=energy();
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.font='9px monospace';ctx.textAlign='left';
  const T_small=2*Math.PI*Math.sqrt(l/g);
  const T_actual=history.t.length>1?(history.t[history.t.length-1]-history.t[Math.max(0,history.t.length-50)])/(Math.max(1,history.th.length-50)*dt*speed):T_small;
  
  // ---- Controls setup ----
if(!document.getElementById('controls').querySelector('button')){
  document.getElementById('controls').innerHTML=
    `<div class="ctrl-group"><label>θ₀</label><input type="range" id="thetaS" min="0.1" max="3.14" step="0.01" value="${theta}"><span class="val" id="thetaV">${theta.toFixed(2)}</span></div>`+
    `<div class="ctrl-group"><label>Length</label><input type="range" id="lenS" min="0.3" max="4" step="0.1" value="${l}"><span class="val" id="lenV">${l.toFixed(1)}</span></div>`+
    `<div class="ctrl-group"><label>Gravity</label><input type="range" id="gravS" min="1" max="30" step="0.1" value="${g}"><span class="val" id="gravV">${g.toFixed(1)}</span></div>`+
    `<button id="pauseBtn">Pause</button>`+
    `<button id="resetBtn">Reset</button>`+
    `<div class="ctrl-group"><label>Speed</label><input type="range" id="speedS" min="1" max="6" step="1" value="${speed}"><span class="val" id="speedV">${speed}x</span></div>`;

  document.getElementById('thetaS').addEventListener('input',function(){
    theta=parseFloat(this.value);omega=0;simTime=0;
    history.t.length=0;history.th.length=0;history.om.length=0;
    history.ke.length=0;history.pe.length=0;history.te.length=0;
    document.getElementById('thetaV').textContent=theta.toFixed(2);
  });
  document.getElementById('lenS').addEventListener('input',function(){
    l=parseFloat(this.value);
    document.getElementById('lenV').textContent=l.toFixed(1);
  });
  document.getElementById('gravS').addEventListener('input',function(){
    g=parseFloat(this.value);
    document.getElementById('gravV').textContent=g.toFixed(1);
  });
  document.getElementById('pauseBtn').addEventListener('click',function(){
    paused=!paused;this.textContent=paused?'Play':'Pause';
  });
  document.getElementById('resetBtn').addEventListener('click',resetSim);
  document.getElementById('speedS').addEventListener('input',function(){
    speed=parseInt(this.value);
    document.getElementById('speedV').textContent=speed+'x';
  });

  // Mouse interaction
  canvas.onmousedown=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx_=e.clientX-rect.left, my_=e.clientY-rect.top;
    const dx=mx_-px, dy=my_-py;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(Math.abs(dist-l*scale)<40){
      dragging=true;
      canvas.style.cursor='grabbing';
    }
  };
  canvas.onmousemove=function(e){
    if(!dragging)return;
    const rect=canvas.getBoundingClientRect();
    const mx_=e.clientX-rect.left, my_=e.clientY-rect.top;
    theta=Math.atan2(mx_-px,my_-py);
    if(theta>Math.PI)theta-=2*Math.PI;
    if(theta<-Math.PI)theta+=2*Math.PI;
    omega=0;simTime=0;
    history.t.length=0;history.th.length=0;history.om.length=0;
    history.ke.length=0;history.pe.length=0;history.te.length=0;
    document.getElementById('thetaS').value=Math.abs(theta);
    document.getElementById('thetaV').textContent=Math.abs(theta).toFixed(2);
  };
  canvas.onmouseup=canvas.onmouseleave=function(){dragging=false;canvas.style.cursor='grab';};

  // Stats
}
  document.getElementById('stats').innerHTML=
    `<span><span class="label">θ =</span> <span class="val">${theta.toFixed(3)}</span> rad</span>`+
    `<span><span class="label">ω =</span> <span class="val">${omega.toFixed(3)}</span> rad/s</span>`+
    `<span><span class="label">KE =</span> <span class="val">${e.ke.toFixed(4)}</span> J</span>`+
    `<span><span class="label">PE =</span> <span class="val">${e.pe.toFixed(4)}</span> J</span>`+
    `<span><span class="label">E =</span> <span class="val">${e.te.toFixed(4)}</span> J</span>`+
    `<span><span class="label">T₀ =</span> <span class="val">${T_small.toFixed(3)}</span> s (small θ)</span>`+
    `<span><span class="label">T =</span> <span class="val">${T_actual.toFixed(3)}</span> s</span>`+
    `<span><span class="label">t =</span> <span class="val">${simTime.toFixed(2)}</span> s</span>`+
    `<span><span class="label">l/g =</span> <span class="val">${(l/g).toFixed(4)}</span></span>`+
    `<span><span class="label">ΔE/E =</span> <span class="val">${history.te.length>2?((Math.max(...history.te)-Math.min(...history.te))/(Math.abs(Math.max(...history.te))||1)*100).toFixed(4):'0.0000'}%</span></span>`;
}

function loop(){
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
