<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Radiation · P = εσAT⁴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{font-size:1.3em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:1px}
p{font-size:0.7em;color:#666;margin-bottom:6px}
canvas{border:1px solid #000;display:block}
.controls{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:5px;max-width:920px}
.ctrl-group{display:flex;align-items:center;gap:3px;background:#fafafa;border:1px solid #eee;padding:2px 8px;border-radius:2px}
.ctrl-group label{font-size:0.6em;color:#666;text-transform:uppercase;letter-spacing:1px}
.ctrl-group input[type=range]{width:60px;height:12px;accent-color:#000}
.ctrl-group .val{font-size:0.65em;color:#000;min-width:24px;text-align:right}
button{background:#fff;border:1px solid #000;color:#000;padding:2px 10px;font-family:'Courier New',monospace;font-size:0.65em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
button:hover{background:#000;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:0.65em;color:#666;max-width:920px;justify-content:center}
.stats span{white-space:nowrap}
.stats .label{color:#999}
.stats .val{color:#000;font-weight:700}
</style>
</head>
<body>
<h1>Thermal Radiation</h1>
<p>P = εσAT⁴ — Stefan–Boltzmann law, Wien's displacement</p>
<canvas id="c" width="920" height="490"></canvas>
<div class="controls" id="controls"></div>
<div class="stats" id="stats"></div>
<script>
const C=document.getElementById('c'),cx=C.getContext('2d'),W=920,H=490;
let T=1000,epsilon=0.8,running=1,speed=1;
const sigma=5.67e-8,A=1;
let hT=[],hP=[],tHist=0;

function reset(){T=1000;epsilon=0.8;hT=[];hP=[];tHist=0;}
function step(){
 if(!running)return;
 for(let s=0;s<speed;s++){
  const P=epsilon*sigma*A*Math.pow(T,4);
  T-=P*0.00001*speed;if(T<300)T=300;
  tHist+=0.02;
  hT.push(T);hP.push(P);
  if(hT.length>60){hT.shift();hP.shift();}
  if(Math.random()<0.005)T+=(-0.5+Math.random())*100;
 }
}

function draw(){
 cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
 const P=epsilon*sigma*A*Math.pow(T,4);
 const lMax=2898/T*1e6; // Wien in nm

 // Glowing sphere
 const x=200,y=240;
 const gray=Math.round(Math.max(0,255-(T-300)/1700*200));
 cx.fillStyle='rgb('+gray+','+gray+','+gray+')';
 cx.beginPath();cx.arc(x,y,55,0,Math.PI*2);cx.fill();
 cx.strokeStyle='#111';cx.lineWidth=0.5;cx.stroke();
 cx.fillStyle=gray<128?'#fff':'#111';cx.font='7px monospace';cx.textAlign='center';cx.textBaseline='middle';
 cx.fillText(T.toFixed(0)+' K',x,y);

 // Radiation waves
 cx.strokeStyle='rgba(0,0,0,0.02)';cx.lineWidth=0.3;
 for(let i=0;i<24;i++){
  const ang=Math.PI*2*i/24,len=70+30*Math.sin(i*3+tHist*50);
  cx.beginPath();
  for(let r=55;r<55+len;r+=2){
   const disp=Math.sin(r*0.3+tHist*80)*4,px=x+(r+disp)*Math.cos(ang),py=y+(r+disp)*Math.sin(ang);
   r===55?cx.moveTo(px,py):cx.lineTo(px,py);
  }
  cx.stroke();
 }

 // Emitted power info
 cx.fillStyle='#111';cx.font='7px monospace';cx.textAlign='left';
 cx.fillText('P = εσAT⁴',30,330);
 cx.fillText('σ = 5.67×10⁻⁸ W·m⁻²·K⁻⁴',30,344);
 cx.fillText('λₘₐₓ = b/T (Wien)',30,358);

 // P vs T graph
 const gX=340,gY=25,gW=540,gH=150;
 cx.strokeStyle='#ddd';cx.lineWidth=0.5;cx.strokeRect(gX,gY,gW,gH);
 cx.fillStyle='#999';cx.font='6px monospace';cx.textAlign='left';
 cx.fillText('P = εσT⁴ (Stefan–Boltzmann)',gX+3,gY+10);
 cx.strokeStyle='rgba(0,0,0,0.1)';cx.lineWidth=0.5;
 cx.beginPath();cx.moveTo(gX,gY);cx.lineTo(gX,gY+gH);cx.stroke();
 cx.beginPath();cx.moveTo(gX,gY+gH);cx.lineTo(gX+gW,gY+gH);cx.stroke();
 cx.strokeStyle='#111';cx.lineWidth=1;cx.beginPath();let first=true;
 for(let x=0;x<=gW;x++){const t=300+(x/gW)*1700,p=epsilon*sigma*A*Math.pow(t,4);const px=gX+x,py=gY+gH-Math.log10(p+1)/14*(gH-20);first?cx.moveTo(px,py):cx.lineTo(px,py);first=false;}
 cx.stroke();
 const opX=gX+((T-300)/1700)*gW,opY=gY+gH-Math.log10(P+1)/14*(gH-20);
 cx.fillStyle='#111';cx.beginPath();cx.arc(opX,opY,3,0,Math.PI*2);cx.fill();
 cx.fillStyle='#111';cx.font='5px monospace';cx.textAlign='center';cx.fillText('OP',opX,opY-6);

 // Temperature + Power bars
 const bX=340,bY=190,bW=400,bH=14;
 const tFrac=(T-300)/1700,pFrac=Math.min(1,Math.log10(P+1)/14);
 cx.fillStyle='rgba(0,0,0,0.06)';cx.fillRect(bX,bY,bW,bH);
 cx.fillStyle='#111';cx.fillRect(bX,bY,Math.min(bW,tFrac*bW),bH);
 cx.fillStyle='#999';cx.font='6px monospace';cx.textAlign='left';cx.fillText('T = '+T.toFixed(0)+' K',bX,bY-2);
 cx.fillStyle='rgba(0,0,0,0.06)';cx.fillRect(bX,bY+20,bW,bH);
 cx.fillStyle='#111';cx.fillRect(bX,bY+20,Math.min(bW,pFrac*bW),bH);
 cx.fillStyle='#999';cx.font='6px monospace';cx.fillText('P = '+(P/1000).toFixed(2)+' kW',bX,bY+18);

 // Wien scale & color bar
 const cX=340,cY=250,cW=400,cH=18;
 for(let x=0;x<cW;x++){const t=300+(x/cW)*1700;const r=Math.min(255,Math.round((t-300)/1700*255)),g=Math.min(255,Math.round(Math.max(0,(t-800)/900*255))),b=Math.min(255,Math.round(Math.max(0,(t-1400)/300*255)));cx.fillStyle='rgb('+r+','+g+','+b+')';cx.fillRect(cX+x,cY,1,cH);}
 cx.strokeStyle='#ddd';cx.lineWidth=0.5;cx.strokeRect(cX,cY,cW,cH);
 cx.fillStyle='#999';cx.font='6px monospace';cx.textAlign='center';cx.fillText('Color temperature (300–2000 K)',cX+cW/2,cY-2);

 // Cooling history mini-graph
 const ggx=340,ggy=280,ggw=540,ggh=80;
 cx.strokeStyle='#ddd';cx.lineWidth=0.5;cx.strokeRect(ggx,ggy,ggw,ggh);
 cx.fillStyle='#999';cx.font='6px monospace';cx.textAlign='left';
 cx.fillText('Temperature cooling history',ggx+3,ggy+8);
 if(hT.length>1){
  cx.strokeStyle='#111';cx.lineWidth=0.8;cx.beginPath();
  const minT=Math.min(...hT),maxT=Math.max(...hT),range=Math.max(maxT-minT,1);
  hT.forEach((v,i)=>{const px=ggx+i/(hT.length-1)*ggw,py=ggy+ggh-(v-minT)/range*(ggh-12);i===0?cx.moveTo(px,py):cx.lineTo(px,py);});
  cx.stroke();
 }

 // Power history mini-graph
 const ggx2=340,ggy2=365,ggw2=540,ggh2=70;
 cx.strokeStyle='#ddd';cx.lineWidth=0.5;cx.strokeRect(ggx2,ggy2,ggw2,ggh2);
 cx.fillStyle='#999';cx.font='6px monospace';cx.fillText('Power history',ggx2+3,ggy2+8);
 if(hP.length>1){
  cx.strokeStyle='rgba(0,0,0,0.4)';cx.lineWidth=0.8;cx.beginPath();
  const maxP=Math.max(...hP,1);
  hP.forEach((v,i)=>{const px=ggx2+i/(hP.length-1)*ggw2,py=ggy2+ggh2-Math.log10(v+1)/14*(ggh2-8);i===0?cx.moveTo(px,py):cx.lineTo(px,py);});
  cx.stroke();
 }

 // Controls
 const cS='<div class="ctrl-group"><label>T(K)</label><input type="range" id="tS" min="300" max="2000" step="10" value="'+T.toFixed(0)+'"><span class="val" id="tV">'+T.toFixed(0)+'</span></div>'+
 '<div class="ctrl-group"><label>ε</label><input type="range" id="eS" min="0" max="1" step="0.02" value="'+epsilon.toFixed(2)+'"><span class="val" id="eV">'+epsilon.toFixed(2)+'</span></div>'+
 '<button id="playB">'+(running?'⏸':'▶')+'</button><button id="resetB">↺</button>'+
 '<div class="ctrl-group"><label>Speed</label><input type="range" id="spdS" min="1" max="10" step="1" value="'+speed+'"><span class="val" id="spdV">'+speed+'</span></div>';
if(!document.getElementById('controls').querySelector('button')){
 document.getElementById('controls').innerHTML=cS;
 document.getElementById('tS').oninput=function(){T=+this.value;document.getElementById('tV').textContent=T.toFixed(0);};
 document.getElementById('eS').oninput=function(){epsilon=+this.value;document.getElementById('eV').textContent=epsilon.toFixed(2);};
 document.getElementById('playB').onclick=function(){running=!running;this.textContent=running?'⏸':'▶';};
 document.getElementById('resetB').onclick=function(){reset();};
 document.getElementById('spdS').oninput=function(){speed=+this.value;document.getElementById('spdV').textContent=speed;};

}
  document.getElementById('stats').innerHTML=
  '<span><span class="label">T =</span> <span class="val">'+T.toFixed(0)+'</span> K</span>'+
  '<span><span class="label">ε =</span> <span class="val">'+epsilon.toFixed(3)+'</span></span>'+
  '<span><span class="label">P = εσT⁴ =</span> <span class="val">'+(P/1000).toFixed(3)+'</span> kW</span>'+
  '<span><span class="label">λₘₐₓ = b/T =</span> <span class="val">'+(2898/T*1e6).toFixed(1)+'</span> nm</span>'+
  '<span><span class="label">σ =</span> <span class="val">'+sigma.toExponential(2)+'</span></span>'+
  '<span><span class="label">T⁴ =</span> <span class="val">'+(Math.pow(T,4)).toExponential(2)+'</span></span>'+
  '<span><span class="label">P/A =</span> <span class="val">'+(P/A/1000).toFixed(3)+'</span> kW/m²</span>'+
  '<span><span class="label">b (Wien) =</span> <span class="val">2.898×10⁻³</span></span>'+
  '<span><span class="label">νₘₐₓ =</span> <span class="val">'+(5.879e10*T).toExponential(2)+'</span> Hz</span>'+
  '<span><span class="label">U = aVT⁴ ∝</span> <span class="val">'+(Math.pow(T,4)).toExponential(2)+'</span></span>'+
  '<span><span class="label">P₁/P₂ = (T₁/T₂)⁴</span> <span class="val">'+Math.pow(T/1000,4).toFixed(2)+'</span></span>'+
  '<span><span class="label">Photons/s ∝</span> <span class="val">'+Math.pow(T,3).toExponential(2)+'</span></span>'+
  '<span><span class="label">Rad. pressure =</span> <span class="val">'+(P/A/3e8).toExponential(2)+'</span> Pa</span>';
}
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
