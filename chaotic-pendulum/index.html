<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chaotic Pendulum</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:55px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Chaotic Pendulum</h1>
<div class="eq">θ̈ + γθ̇ + sin(θ) = F·cos(ωt) · Poincaré section shown</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>F <input type="range" id="fS" min="0" max="200" value="120"></label>
<label>γ <input type="range" id="gS" min="10" max="100" value="50"></label>
<label>ω <input type="range" id="wS" min="30" max="150" value="67"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const M={t:25,r:15,b:35,l:20},pw=W-M.l-M.r,ph=H-M.t-M.b;
let play=1,F=1.2,gamma=.5,omegaDr=.6667,spd=3;
let theta=.5,omegaV=0,t=0,trail=[],poin=[],lastPT=0;
let hist={theta:[],omega:[],E:[],tData:[]};
const dt=.05;
function deriv(th,om,t_){return{dth:om,dom:F*Math.cos(omegaDr*t_)-gamma*om-Math.sin(th)}}
function rk4(th,om,t_,dt){const k1=deriv(th,om,t_);const k2=deriv(th+.5*dt*k1.dth,om+.5*dt*k1.dom,t_+.5*dt);const k3=deriv(th+.5*dt*k2.dth,om+.5*dt*k2.dom,t_+.5*dt);const k4=deriv(th+dt*k3.dth,om+dt*k3.dom,t_+dt);return{theta:th+dt/6*(k1.dth+2*k2.dth+2*k3.dth+k4.dth),omega:om+dt/6*(k1.dom+2*k2.dom+2*k3.dom+k4.dom),t:t_+dt}}
function modAng(a){return((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI}
function mapC(th,om){const tx=modAng(th)/Math.PI,ow=om/4;return{x:M.l+(tx*.5+.5)*pw,y:M.t+(.5-ow*.5)*ph}}
function reset(){theta=(Math.random()-.5)*.5;omegaV=(Math.random()-.5)*.2;t=0;trail=[];poin=[];lastPT=0;hist={theta:[],omega:[],E:[],tData:[]}}
function step(){if(!play)return;for(let i=0;i<spd*2;i++){const r=rk4(theta,omegaV,t,dt);theta=r.theta;omegaV=r.omega;t=r.t;trail.push({theta,omega:omegaV});if(trail.length>15000)trail.shift();const T=2*Math.PI/omegaDr;if(t-lastPT>=T){poin.push({theta:modAng(theta),omega:omegaV});lastPT+=T;if(poin.length>4000)poin.shift()}}
if(t%Math.ceil(5/spd||1)===0){hist.theta.push(theta);hist.omega.push(omegaV);const Ek=.5*omegaV*omegaV,Ep=1-Math.cos(theta);hist.E.push(Ek+Ep);hist.tData.push(t);if(hist.theta.length>200){hist.theta.shift();hist.omega.shift();hist.E.shift();hist.tData.shift()}}}
function drawMini(x,y,w,h,data,color,label){if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<data.length;i++){const px=x+i*w/data.length,py=y+h-(data[i]-mn)/rng*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);ctx.restore()}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
const cx0=M.l+pw/2,cy0=M.t+ph/2;
ctx.strokeStyle='#eee';ctx.lineWidth=.5;for(let i=-4;i<=4;i++){const x=M.l+(i/4+.5)*pw;ctx.beginPath();ctx.moveTo(x,M.t);ctx.lineTo(x,M.t+ph);ctx.stroke();const y=M.t+(.5-i/4)*ph;ctx.beginPath();ctx.moveTo(M.l,y);ctx.lineTo(M.l+pw,y);ctx.stroke()}
ctx.strokeStyle='#ccc';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(M.l,cy0);ctx.lineTo(M.l+pw,cy0);ctx.stroke();ctx.beginPath();ctx.moveTo(cx0,M.t);ctx.lineTo(cx0,M.t+ph);ctx.stroke();
ctx.fillStyle='#999';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('-π',M.l+pw*.04,cy0+10);ctx.fillText('0',cx0,cy0+10);ctx.fillText('π',M.l+pw*.96,cy0+10);ctx.textAlign='right';ctx.fillText('-2',cx0-5,M.t+ph*.13);ctx.fillText('0',cx0-5,cy0+3);ctx.fillText('2',cx0-5,M.t+ph*.87);
if(trail.length>1){ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=.8;ctx.beginPath();const p0=mapC(trail[0].theta,trail[0].omega);ctx.moveTo(p0.x,p0.y);for(let i=1;i<trail.length;i++){const p=mapC(trail[i].theta,trail[i].omega);ctx.lineTo(p.x,p.y)}ctx.stroke()}
for(const p of poin){const pt=mapC(p.theta,p.omega);ctx.fillStyle='rgba(80,80,80,.6)';ctx.beginPath();ctx.arc(pt.x,pt.y,2.2,0,Math.PI*2);ctx.fill()}
if(trail.length>0){const p=mapC(trail[trail.length-1].theta,trail[trail.length-1].omega);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
drawMini(5,H-90,130,45,hist.E,'rgba(0,0,0,.7)','Energy');drawMini(W-135,H-90,130,45,hist.theta,'rgba(0,0,0,.5)','θ(t)');
ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='left';
const Ek=.5*omegaV*omegaV,Ep=1-Math.cos(theta),Et=Ek+Ep;
ctx.fillText('F='+F.toFixed(2)+' γ='+gamma.toFixed(2)+' ω='+omegaDr.toFixed(3)+' θ='+modAng(theta).toFixed(2),8,14);
ctx.fillText('ω='+omegaV.toFixed(2)+' t='+t.toFixed(1)+' Poincaré='+poin.length,8,26);
let h='';const fields=[['θ',modAng(theta).toFixed(4)],['ω (ang vel)',omegaV.toFixed(4)],['t',t.toFixed(1)],['Ek',Ek.toFixed(4)],['Ep',Ep.toFixed(4)],['Et',Et.toFixed(4)],['F_drive',F.toFixed(3)],['γ_damp',gamma.toFixed(3)],['ω_drive',omegaDr.toFixed(3)],['T_drive',(2*Math.PI/omegaDr).toFixed(3)],['Poincaré pts',poin.length],['max|θ|',trail.length>0?Math.max(...trail.map(p=>Math.abs(modAng(p.theta)))).toFixed(3):'0'],
['max|ω|',trail.length>0?Math.max(...trail.map(p=>Math.abs(p.omega))).toFixed(3):'0'],['rms ω',trail.length>0?Math.sqrt(trail.reduce((s,p)=>s+p.omega*p.omega,0)/trail.length).toFixed(3):'0'],
['restoring',(-Math.sin(theta)).toFixed(4)],['forcing',(F*Math.cos(omegaDr*t)).toFixed(4)]];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=reset;
document.getElementById('fS').oninput=e=>{F=e.value/100;reset()}
document.getElementById('gS').oninput=e=>{gamma=e.value/100;reset()}
document.getElementById('wS').oninput=e=>{omegaDr=.3+e.value/100;reset()}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
reset();loop();
</script>
</body>
</html>
