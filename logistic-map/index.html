<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Logistic Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:60px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Logistic Map</h1>
<div class="eq">xₙ₊₁ = r·xₙ·(1−xₙ) · Feigenbaum r≈3.5699</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>r <input type="range" id="rS" min="0" max="400" value="250"></label>
<label>x₀ <input type="range" id="x0S" min="1" max="99" value="50"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Speed <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const M={t:25,r:20,b:35,l:50},pw=W-M.l-M.r,ph=H-M.t-M.b;
let play=1,r=2.5,x0=.5,spd=3,t=0,mode='bif',orbitPts=[],bifImg=null;
let hist={x:[],lyap:[],rVals:[]};
function lyapunov(rVal,iters=500){let x=Math.random()*.5+.25,sum=0;for(let i=0;i<200;i++)x=rVal*x*(1-x);for(let i=0;i<iters;i++){const d=Math.abs(rVal*(1-2*x));if(d>1e-10)sum+=Math.log(d);x=rVal*x*(1-x)}return sum/iters}
function genBif(){bifImg=ctx.createImageData(W,H);const d=ctx.createImageData(W,H);for(let i=0;i<d.data.length;i+=4){d.data[i]=255;d.data[i+1]=255;d.data[i+2]=255;d.data[i+3]=255}
const dens=new Uint16Array(pw*ph);for(let c=0;c<pw;c++){const rv=(c/pw)*4;let x=.5+Math.random()*.1;for(let i=0;i<300;i++)x=rv*x*(1-x);for(let i=0;i<500;i++){x=rv*x*(1-x);const row=Math.floor((1-x)*ph);if(row>=0&&row<ph)dens[c+row*pw]++}}
const maxD=Math.max(1,...dens);for(let c=0;c<pw;c++)for(let r=0;r<ph;r++){const dns=dens[c+r*pw];if(dns>0){const px=M.l+c,py=M.t+r,idx=(py*W+px)*4;const v=Math.max(40,255-Math.floor(Math.log(1+dns)/Math.log(1+maxD)*215));d.data[idx]=v;d.data[idx+1]=v;d.data[idx+2]=v}}
bifImg=d}
function drawAxes(){ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(M.l,M.t);ctx.lineTo(M.l,H-M.b);ctx.lineTo(W-M.r,H-M.b);ctx.stroke()
ctx.fillStyle='#000';ctx.font='10px monospace';ctx.textAlign='center';for(let i=0;i<=4;i++){const x=M.l+i/4*pw;ctx.fillText(i.toFixed(1),x,H-M.b+14)}
ctx.textAlign='right';for(let i=0;i<=5;i++){const y=M.t+(1-i/5)*ph;ctx.fillText((i/5).toFixed(1),M.l-6,y+3)}
ctx.fillStyle='#999';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('P1',M.l+pw*.28,M.t+10);ctx.fillText('P2',M.l+pw*.48,M.t+10);ctx.fillText('P4',M.l+pw*.54,M.t+10);ctx.fillText('CHAOS',M.l+pw*.8,M.t+10)}
function drawOrbit(rVal){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);if(bifImg)ctx.putImageData(bifImg,0,0);drawAxes()
const rx=M.l+(rVal/4)*pw;ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(rx,M.t);ctx.lineTo(rx,H-M.b);ctx.stroke();ctx.setLineDash([])
let x=.5;const pts=[];for(let i=0;i<200;i++)x=rVal*x*(1-x);for(let i=0;i<100;i++){x=rVal*x*(1-x);pts.push(x)}
for(const p of pts){const py=M.t+(1-p)*ph;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(rx,py,2.5,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#666';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('r='+rVal.toFixed(2),rx,M.t-6)}
function cobweb(rVal){const cx=W-190,cy=M.t+5,cw=185,ch=185;
ctx.fillStyle='#fff';ctx.fillRect(cx,cy,cw,ch);ctx.strokeStyle='#000';ctx.lineWidth=.5;ctx.strokeRect(cx,cy,cw,ch)
ctx.strokeStyle='#999';ctx.beginPath();ctx.moveTo(cx,cy+ch);ctx.lineTo(cx+cw,cy);ctx.stroke()
ctx.strokeStyle='#666';ctx.beginPath();for(let i=0;i<=cw;i++){const xn=i/cw;ctx.lineTo(cx+i,cy+ch-rVal*xn*(1-xn)*ch)}ctx.stroke()
let x=.5;for(let i=0;i<50;i++)x=rVal*x*(1-x);
ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<20;i++){const px=cx+x*cw,py=cy+ch-x*ch;ctx.lineTo(px,py);x=rVal*x*(1-x);ctx.lineTo(cx+x*cw,py)}ctx.stroke()
ctx.fillStyle='#666';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText('Cobweb r='+rVal.toFixed(2),cx+cw/2,cy+ch+10)}
function step(){if(!play)return;for(let i=0;i<spd;i++){let x=x0;for(let j=0;j<50;j++)x=r*x*(1-x);t++
if(t%2===0){hist.x.push(x);hist.rVals.push(r);const ly=lyapunov(r,300);hist.lyap.push(ly);if(hist.x.length>150){hist.x.shift();hist.rVals.shift();hist.lyap.shift()}}}}
function draw(){
if(mode==='bif'){genBif();ctx.putImageData(bifImg,0,0);drawAxes();const fr=3.5699,fx=M.l+(fr/4)*pw;ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(fx,M.t);ctx.lineTo(fx,H-M.b);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#666';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('r=3.5699',fx,M.t-4);mode='orbit'}
else{drawOrbit(r);cobweb(r)}
const xNow=hist.x.length>0?hist.x[hist.x.length-1]:0;
let last=0;for(let i=hist.x.length-1;i>=Math.max(0,hist.x.length-20);i--){if(i<1)break;const d=Math.abs(hist.x[i]-hist.x[i-1]);if(d>.001)last++}
let h='';const fields=[['r',r.toFixed(3)],['x₀',x0.toFixed(2)],['x_now',xNow.toFixed(4)],['lyapunov λ',hist.lyap.length>0?hist.lyap[hist.lyap.length-1].toFixed(4):'N/A'],
['period est',last],['iter t',t],['<x>',(hist.x.reduce((a,b)=>a+b,0)/(hist.x.length||1)).toFixed(4)],['max|x|',Math.max(...hist.x.concat([0])).toFixed(4)],['min|x|',Math.min(...hist.x.concat([1])).toFixed(4)],
['variance',(hist.x.reduce((s,v)=>s+(v-xNow)**2,0)/(hist.x.length||1)).toFixed(6)],['Feigenbaum δ','4.6692'],['fixed_pts',r<3?'1':r<3.449?'2':r<3.544?'4':'>4']];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;
}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=()=>{t=0;hist={x:[],lyap:[],rVals:[]};mode='bif';genBif();draw()}
document.getElementById('rS').oninput=e=>{r=e.value/100;document.getElementById('rS').previousSibling.textContent=r.toFixed(2);mode='bif'}
document.getElementById('x0S').oninput=e=>{x0=e.value/100;document.getElementById('x0S').previousSibling.textContent=x0.toFixed(2)}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
genBif();loop();
</script>
</body>
</html>
