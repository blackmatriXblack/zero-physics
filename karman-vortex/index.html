<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Karman Vortex Street</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;font-size:12px}
h1{font-size:1.1em;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:2px 0}
canvas{display:block;border:1px solid #000;width:100%;max-width:820px;height:auto;background:#fff}
.ctrl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:3px 0;width:100%;max-width:820px}
.ctrl label{display:flex;align-items:center;gap:2px;color:#666;text-transform:uppercase;letter-spacing:1px;font-size:9px}
.ctrl input[type=range]{width:55px;accent-color:#000;height:14px}
.ctrl button{padding:2px 10px;font:9px monospace;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
.ctrl button:hover{background:#000;color:#fff}
.d{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:2px;width:100%;max-width:820px;margin:2px 0}
.d span{font:8px monospace;color:#666;text-align:center;padding:1px 2px;border:1px solid #eee}
.d b{color:#000}
.eq{font-size:9px;color:#999;text-align:center;margin:2px 0;letter-spacing:1px}
</style>
</head>
<body>
<h1>Karman Vortex Street</h1>
<div class="eq">Re = UL/ν · St ≈ 0.198(1−19.7/Re) · Vortex shedding behind cylinder</div>
<canvas id="c" width="820" height="460"></canvas>
<div class="ctrl" id="ctrl">
<label>U <input type="range" id="spdS" min="5" max="60" value="22"></label>
<label>ν <input type="range" id="viscS" min="2" max="50" value="15"></label>
<button id="playBtn">⏸</button><button id="resetBtn">↺</button>
<label>Rate <input type="range" id="rate" min="1" max="10" value="3"></label>
</div>
<div class="d" id="d"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let play=1,flowSpd=2.2,visc=.15,spd=3,t=0,lastShed=0;
let vorts=[];
const cylX=Math.floor(W*.22),cylY=H/2,cylR=28;
let hist={t:[],Re:[],St:[],nVort:[],strength:[]};
function reset(){vorts=[];t=0;lastShed=0;hist={t:[],Re:[],St:[],nVort:[],strength:[]}}
function vVel(v,px,py){const dx=px-v.x,dy=py-v.y,r2=dx*dx+dy*dy;if(r2<1)return{vx:0,vy:0};const g=v.strength;return{vx:-g*dy/(2*Math.PI*r2),vy:g*dx/(2*Math.PI*r2)}}
function step(){if(!play)return;for(let s=0;s<spd;s++){t+=.016;
const Re=flowSpd*cylR*2/visc;const St=Math.max(.05,0.198*(1-19.7/Math.max(Re,30)));const shedFreq=St*flowSpd/(2*cylR);const phase=2*Math.PI*shedFreq*t;
if(Math.sin(phase)>0.97&&Math.sin(phase-.1)<=0.97&&t-lastShed>.15){const alt=Math.sin(phase)>0?1:-1;vorts.push({x:cylX+35,y:cylY+alt*22,strength:(.4+Math.random()*.6)*alt*flowSpd*.7,life:0,maxLife:6+Math.random()*3});lastShed=t}
for(let i=vorts.length-1;i>=0;i--){const v=vorts[i];v.life+=.016;let tvx=flowSpd,tvy=0;for(const o of vorts){if(o===v)continue;const dv=vVel(o,v.x,v.y);tvx+=dv.vx;tvy+=dv.vy}tvx*=(1-visc*.4);tvy*=(1-visc*.4);v.x+=tvx;v.y+=tvy;if(v.life>v.maxLife||v.x>W+40||v.x<-40)vorts.splice(i,1)}
if(t%Math.ceil(.5/spd||1)===0){const Re2=flowSpd*cylR*2/visc;const St2=Math.max(.05,0.198*(1-19.7/Math.max(Re2,30)));hist.t.push(t);hist.Re.push(Re2);hist.St.push(St2);hist.nVort.push(vorts.length);hist.strength.push(vorts.reduce((s,v)=>s+Math.abs(v.strength),0)/Math.max(1,vorts.length));if(hist.t.length>200){hist.t.shift();hist.Re.shift();hist.St.shift();hist.nVort.shift();hist.strength.shift()}}}}
function drawMini(x,y,w,h,data,color,label){if(data.length<2)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h);const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<data.length;i++){const px=x+i*w/data.length,py=y+h-(data[i]-mn)/rng*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#999';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText(label,x+2,y+8);ctx.restore()}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
for(let x=0;x<W;x+=12){const yOff=4*Math.sin(.04*x-t*flowSpd*.15);const alpha=Math.max(.04,.15-x*.00025);ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.fillRect(x,cylY+yOff-2,1,4);ctx.fillRect(x,cylY+yOff-18+2*Math.sin(.08*x+t),1,2)}
for(const v of vorts){const age=v.life/v.maxLife;if(age>1)continue;const alpha=(1-age)*.6;const rad=4+age*18;ctx.strokeStyle=`rgba(0,0,0,${alpha})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(v.x,v.y,Math.max(2,rad),0,Math.PI*2);ctx.stroke();
if(v.strength>0){ctx.beginPath();ctx.moveTo(v.x,v.y-3);ctx.lineTo(v.x,v.y+3);ctx.stroke();ctx.beginPath();ctx.moveTo(v.x-2,v.y-2);ctx.lineTo(v.x,v.y);ctx.lineTo(v.x+2,v.y-2);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(v.x-3,v.y);ctx.lineTo(v.x+3,v.y);ctx.stroke();ctx.beginPath();ctx.moveTo(v.x-2,v.y-2);ctx.lineTo(v.x,v.y);ctx.lineTo(v.x-2,v.y+2);ctx.stroke()}}
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cylX,cylY,cylR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('CYL',cylX,cylY+3);
ctx.fillStyle='#666';ctx.font='10px monospace';ctx.textAlign='left';const Re=flowSpd*cylR*2/visc;const St=Math.max(.05,0.198*(1-19.7/Math.max(Re,30)));ctx.fillText('→ Flow  Re='+Re.toFixed(0)+' St='+St.toFixed(3),8,16);
const meanStr=vorts.length>0?vorts.reduce((s,v)=>s+Math.abs(v.strength),0)/vorts.length:0;
let spacing=0;if(vorts.length>2){const sorted=vorts.slice().sort((a,b)=>a.x-b.x);let sum=0,cnt=0;for(let i=1;i<sorted.length;i++){if(sorted[i].x-sorted[i-1].x<100){sum+=sorted[i].x-sorted[i-1].x;cnt++}}spacing=cnt>0?sum/cnt:0}
drawMini(5,H-90,130,45,hist.Re,'rgba(0,0,0,.7)','Re');drawMini(W-135,H-90,130,45,hist.nVort,'rgba(0,0,0,.5)','# Vortices');
let h='';const fields=[['Re',Re.toFixed(0)],['U (flow)',flowSpd.toFixed(2)],['ν (visc)',visc.toFixed(3)],['St (Strouhal)',St.toFixed(4)],['shed freq',(St*flowSpd/(2*cylR)).toFixed(3)+'Hz'],['# vortices',vorts.length],['shed rate',(vorts.length/Math.max(t,.1)).toFixed(2)+'/s'],['mean |Γ|',meanStr.toFixed(3)],['max |Γ|',vorts.length>0?Math.max(...vorts.map(v=>Math.abs(v.strength))).toFixed(3):'0'],
['mean spacing',spacing.toFixed(1)+'px'],['conv. speed',(spacing*(St*flowSpd/(2*cylR))).toFixed(2)],['cyl R',cylR+'px'],['t',t.toFixed(1)],['vortices/s',(vorts.length/Math.max(t,.01)).toFixed(1)]];
for(const[k,v]of fields)h+=`<span>${k}&nbsp;<b>${v}</b></span>`;
document.getElementById('d').innerHTML=h;}
function loop(){step();draw();requestAnimationFrame(loop)}
document.getElementById('playBtn').onclick=()=>{play^=1;document.getElementById('playBtn').textContent=play?'⏸':'▶'}
document.getElementById('resetBtn').onclick=reset;
document.getElementById('spdS').oninput=e=>{flowSpd=e.value/10;document.getElementById('spdS').previousSibling.textContent=flowSpd.toFixed(1)}
document.getElementById('viscS').oninput=e=>{visc=e.value/100;document.getElementById('viscS').previousSibling.textContent=visc.toFixed(2)}
document.getElementById('rate').oninput=e=>{spd=parseInt(e.value)}
reset();loop();
</script>
</body>
</html>
